name: Quirky Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ============================================================
      # 2. Find Android NDK
      # ============================================================
      - name: Locate Android NDK
        shell: bash
        run: |
          set -e

          NDK=""

          if [ -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          elif [ -d "$ANDROID_SDK_ROOT/ndk/27.2.12479018" ]; then
            NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          else
            for d in "$ANDROID_HOME/ndk/"* "$ANDROID_SDK_ROOT/ndk/"*; do
              if [ -x "$d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" ]; then
                NDK="$d"
                break
              fi
            done
          fi

          if [ -z "$NDK" ]; then
            echo "ERROR: Android NDK not found."
            exit 1
          fi

          echo "Using NDK:"
          echo "$NDK"

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      # ============================================================
      # 3. Configure ARM64 compiler
      # ============================================================
      - name: Configure ARM64 compiler
        shell: bash
        run: |
          set -e

          CLANG="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          CLANGXX="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"

          test -x "$CLANG"
          test -x "$CLANGXX"

          echo "CC=$CLANG" >> "$GITHUB_ENV"
          echo "CXX=$CLANGXX" >> "$GITHUB_ENV"

          echo "CC=$CLANG"
          echo "CXX=$CLANGXX"

      # ============================================================
      # 4. Remove x86-only flags from CMakeLists
      # ============================================================
      - name: Remove x86 compiler flags
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("CMakeLists.txt")

          if not p.exists():
              print("CMakeLists.txt not found at root; skipping direct edit.")
              raise SystemExit(0)

          s = p.read_text()

          bad_flags = [
              "-msse",
              "-msse2",
              "-msse3",
              "-mssse3",
              "-msse4.1",
              "-msse4.2",
              "-mpopcnt",
              "-mavx",
              "-mavx2",
              "-mbmi",
              "-mbmi2",
          ]

          for flag in bad_flags:
              s = s.replace(flag, "")

          p.write_text(s)

          print("Removed x86-only compiler flags.")
          PY

      # ============================================================
      # 5. Patch launcher.h
      # ============================================================
      - name: Patch launcher.h
        shell: bash
        run: |
          set -e

          FILE="src/search/searcher/launcher.h"

          test -f "$FILE"

          python3 <<'PY'
          from pathlib import Path

          p = Path("src/search/searcher/launcher.h")
          s = p.read_text()

          # Add pthread header.
          if "#include <pthread.h>" not in s:
              s = s.replace(
                  "#include <thread>",
                  "#include <pthread.h>\n#include <thread>"
              )

          # Replace std::thread member with pthread member.
          old = "    std::thread thread_;"

          new = """    pthread_t thread_{};
              bool thread_joinable_ = false;"""

          if old not in s:
              raise SystemExit(
                  "ERROR: expected 'std::thread thread_;' was not found in launcher.h"
              )

          s = s.replace(old, new, 1)

          p.write_text(s)

          print("launcher.h patched successfully.")
          PY

          grep -n -E "pthread|thread_joinable|thread_" "$FILE"

      # ============================================================
      # 6. Patch launcher.cpp
      #
      # Exact source structure from original Quirky.
      # ============================================================
      - name: Patch launcher.cpp
        shell: bash
        run: |
          set -e

          FILE="src/search/searcher/launcher.cpp"

          test -f "$FILE"

          python3 <<'PY'
          from pathlib import Path

          p = Path("src/search/searcher/launcher.cpp")
          s = p.read_text()

          # --------------------------------------------------------
          # 1. Add pthread helper.
          # --------------------------------------------------------

          include_marker = '#include <string>\n#include <utility>'

          include_replacement = '''#include <memory>
          #include <pthread.h>
          #include <string>
          #include <utility>'''

          if include_marker not in s:
              raise SystemExit(
                  "ERROR: expected include block was not found."
              )

          s = s.replace(include_marker, include_replacement, 1)

          namespace_marker = "namespace q_search {\n\nuint8_t GetRTByteSizeLog"

          namespace_replacement = """namespace q_search {

          namespace {

          constexpr size_t LAUNCHER_STACK_SIZE = 16 * 1024 * 1024;
          constexpr size_t SEARCH_STACK_SIZE = 32 * 1024 * 1024;

          int CreateThreadWithStack(
              pthread_t* thread,
              size_t stack_size,
              void* (*entry)(void*),
              void* argument) {

              pthread_attr_t attr{};

              int result = pthread_attr_init(&attr);

              if (result != 0) {
                  return result;
              }

              result = pthread_attr_setstacksize(&attr, stack_size);

              if (result == 0) {
                  result = pthread_create(
                      thread,
                      &attr,
                      entry,
                      argument
                  );
              }

              pthread_attr_destroy(&attr);

              return result;
          }

          }  // namespace

          uint8_t GetRTByteSizeLog"""

          if namespace_marker not in s:
              raise SystemExit(
                  "ERROR: namespace insertion point was not found."
              )

          s = s.replace(namespace_marker, namespace_replacement, 1)

          # --------------------------------------------------------
          # 2. Replace SearchLauncher::Start.
          # --------------------------------------------------------

          old_start = """void SearchLauncher::Start(const q_core::Board& board, const std::vector<q_core::Move>& moves,
                             time_control_t time_control, depth_t max_depth) {
              Join();
              control_.Reset();
              tt_.NextPosition();
              thread_ = std::thread([this, board, moves, time_control, max_depth]() {
                  StartMainThread(board, moves, time_control, max_depth);
              });
          }"""

          new_start = """void* SearchLauncherThreadEntry(void* raw) {
              auto* args =
                  static_cast<std::tuple<SearchLauncher*,
                                         q_core::Board,
                                         std::vector<q_core::Move>,
                                         time_control_t,
                                         depth_t>*>(raw);

              SearchLauncher* launcher = std::get<0>(*args);

              launcher->StartMainThread(
                  std::get<1>(*args),
                  std::get<2>(*args),
                  std::get<3>(*args),
                  std::get<4>(*args)
              );

              delete args;
              return nullptr;
          }

          void SearchLauncher::Start(const q_core::Board& board, const std::vector<q_core::Move>& moves,
                                     time_control_t time_control, depth_t max_depth) {
              Join();
              control_.Reset();
              tt_.NextPosition();

              using Args = std::tuple<
                  SearchLauncher*,
                  q_core::Board,
                  std::vector<q_core::Move>,
                  time_control_t,
                  depth_t
              >;

              auto* args = new Args(
                  this,
                  board,
                  moves,
                  time_control,
                  max_depth
              );

              const int result = CreateThreadWithStack(
                  &thread_,
                  LAUNCHER_STACK_SIZE,
                  SearchLauncherThreadEntry,
                  args
              );

              if (result != 0) {
                  delete args;
                  thread_joinable_ = false;

                  q_util::PrintError(
                      "Failed to create Quirky launcher thread"
                  );

                  return;
              }

              thread_joinable_ = true;
          }"""

          if old_start not in s:
              raise SystemExit(
                  "ERROR: exact original SearchLauncher::Start block was not found."
              )

          s = s.replace(old_start, new_start, 1)

          # --------------------------------------------------------
          # 3. Move Searcher from stack to heap and use a 32 MB
          #    pthread stack for the actual search.
          # --------------------------------------------------------

          old_search = """    SearchStat stat;
              Searcher searcher(tt_, rt, board, control_, stat);
              SearchTimer timer(time_control, board, stat);
              std::thread search_thread = std::thread([&]() { searcher.Run(max_depth, real_pv_count); });"""

          new_search = """    SearchStat stat;

              auto searcher = std::make_unique<Searcher>(
                  tt_,
                  rt,
                  board,
                  control_,
                  stat
              );

              SearchTimer timer(time_control, board, stat);

              struct SearchThreadArgs {
                  Searcher* searcher;
                  depth_t max_depth;
                  size_t pv_count;
              };

              auto* search_args = new SearchThreadArgs{
                  searcher.get(),
                  max_depth,
                  real_pv_count
              };

              pthread_t search_thread{};

              const int search_result = CreateThreadWithStack(
                  &search_thread,
                  SEARCH_STACK_SIZE,
                  [](void* raw) -> void* {
                      auto* args =
                          static_cast<SearchThreadArgs*>(raw);

                      args->searcher->Run(
                          args->max_depth,
                          args->pv_count
                      );

                      delete args;
                      return nullptr;
                  },
                  search_args
              );

              if (search_result != 0) {
                  delete search_args;

                  q_util::PrintError(
                      "Failed to create Quirky search thread"
                  );

                  return;
              }"""

          if old_search not in s:
              raise SystemExit(
                  "ERROR: exact original Searcher/thread block was not found."
              )

          s = s.replace(old_search, new_search, 1)

          # --------------------------------------------------------
          # 4. Replace search_thread.join().
          # --------------------------------------------------------

          old_join = "    search_thread.join();"

          new_join = "    pthread_join(search_thread, nullptr);"

          if old_join not in s:
              raise SystemExit(
                  "ERROR: search_thread.join() was not found."
              )

          s = s.replace(old_join, new_join, 1)

          # --------------------------------------------------------
          # 5. Replace SearchLauncher::Join().
          # --------------------------------------------------------

          old_launcher_join = """void SearchLauncher::Join() {
              if (thread_.joinable()) {
                  control_.Stop();
                  thread_.join();
              }
          }"""

          new_launcher_join = """void SearchLauncher::Join() {
              if (thread_joinable_) {
                  control_.Stop();
                  pthread_join(thread_, nullptr);
                  thread_joinable_ = false;
              }
          }"""

          if old_launcher_join not in s:
              raise SystemExit(
                  "ERROR: exact original SearchLauncher::Join block was not found."
              )

          s = s.replace(old_launcher_join, new_launcher_join, 1)

          p.write_text(s)

          print("launcher.cpp patched successfully.")
          PY

      # ============================================================
      # 7. Verify patch
      # ============================================================
      - name: Verify pthread and heap changes
        shell: bash
        run: |
          set -e

          echo "=== pthread stack settings ==="
          grep -n "STACK_SIZE" src/search/searcher/launcher.cpp

          echo
          echo "=== pthread creation ==="
          grep -n "pthread_create\|CreateThreadWithStack" \
            src/search/searcher/launcher.cpp

          echo
          echo "=== heap Searcher ==="
          grep -n "make_unique<Searcher>" \
            src/search/searcher/launcher.cpp

          echo
          echo "=== pthread joins ==="
          grep -n "pthread_join" \
            src/search/searcher/launcher.cpp

          echo
          echo "=== remaining std::thread in launcher.cpp ==="
          if grep -n "std::thread" src/search/searcher/launcher.cpp; then
            echo "ERROR: std::thread still remains in launcher.cpp."
            exit 1
          fi

      # ============================================================
      # 8. Print patched source
      # ============================================================
      - name: Show patched launcher
        shell: bash
        run: |
          sed -n '1,125p' src/search/searcher/launcher.cpp
          echo "=============================="
          sed -n '125,280p' src/search/searcher/launcher.cpp

      # ============================================================
      # 9. Configure CMake
      # ============================================================
      - name: Configure CMake
        shell: bash
        run: |
          set -e

          rm -rf build

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=24 \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK" \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_FLAGS="-O3 -fno-fast-math -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-pthread" \
            -DNO_AVX2=ON

      # ============================================================
      # 10. Build
      # ============================================================
      - name: Build Quirky
        shell: bash
        run: |
          set -e

          cmake --build build \
            --parallel 2 \
            --verbose

      # ============================================================
      # 11. Find executable
      # ============================================================
      - name: Locate Quirky binary
        shell: bash
        run: |
          set -e

          echo "Searching for executables..."

          find build -type f -perm -111 -print

          BINARY=""

          for candidate in \
              build/Quirky \
              build/quirky \
              build/src/Quirky \
              build/src/quirky; do

              if [ -f "$candidate" ]; then
                  BINARY="$candidate"
                  break
              fi
          done

          if [ -z "$BINARY" ]; then
              BINARY="$(find build -type f -perm -111 | head -n 1)"
          fi

          if [ -z "$BINARY" ]; then
              echo "ERROR: no executable found."
              exit 1
          fi

          echo "Found:"
          echo "$BINARY"

          cp "$BINARY" Quirky-android-arm64
          chmod +x Quirky-android-arm64

      # ============================================================
      # 12. ELF verification
      # ============================================================
      - name: Verify ARM64 binary
        shell: bash
        run: |
          set -e

          file Quirky-android-arm64

          readelf -h Quirky-android-arm64 | \
            grep -E "Class:|Machine:|Type:"

      # ============================================================
      # 13. Upload binary
      # ============================================================
      - name: Upload Quirky Android ARM64
        uses: actions/upload-artifact@v4
        with:
          name: Quirky-Android-ARM64
          path: Quirky-android-arm64
