name: Quirky Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Locate Android NDK
      # ============================================================
      - name: Locate Android NDK
        shell: bash
        run: |
          set -e

          NDK=""

          if [ -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          else
            for d in "$ANDROID_HOME/ndk/"*; do
              if [ -x "$d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" ]; then
                NDK="$d"
                break
              fi
            done
          fi

          if [ -z "$NDK" ]; then
            echo "ERROR: Android NDK not found."
            exit 1
          fi

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

          echo "Using NDK:"
          echo "$NDK"

      # ============================================================
      # 3. Configure ARM64 compiler
      # ============================================================
      - name: Configure compiler
        shell: bash
        run: |
          set -e

          LLVM="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CC="$LLVM/aarch64-linux-android24-clang"
          CXX="$LLVM/aarch64-linux-android24-clang++"

          test -x "$CC"
          test -x "$CXX"

          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"

          echo "CC=$CC"
          echo "CXX=$CXX"

      # ============================================================
      # 4. Patch CMakeLists
      #
      # Remove the ORIGINAL x86 flags before CMake sees them.
      #
      # Important:
      # Remove the complete tokens, not substrings.
      # ============================================================
      - name: Patch CMakeLists
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("CMakeLists.txt")

          if not p.exists():
              raise SystemExit("ERROR: CMakeLists.txt not found.")

          s = p.read_text()

          bad_flags = [
              "-msse4.2",
              "-msse4.1",
              "-mssse3",
              "-msse3",
              "-msse2",
              "-msse",
              "-mpopcnt",
              "-mavx2",
              "-mavx",
              "-mbmi2",
              "-mbmi",
          ]

          # Longest first, and match complete tokens.
          for flag in bad_flags:
              s = re.sub(
                  rf'(?<!\S){re.escape(flag)}(?!\S)',
                  '',
                  s
              )

          p.write_text(s)

          print("===== FINAL CMakeLists.txt =====")
          print(p.read_text())
          PY

          echo
          echo "Checking CMakeLists for forbidden flags..."

          if grep -n -E \
            -- '-msse|-mssse3|-mpopcnt|-mavx|-mbmi' \
            CMakeLists.txt; then

            echo "ERROR: x86 flags remain in CMakeLists.txt."
            exit 1
          fi

          echo "CMakeLists x86 flag check: OK."

      # ============================================================
      # 5. Patch launcher.h
      # ============================================================
      - name: Patch launcher.h
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("src/search/searcher/launcher.h")
          s = p.read_text()

          if "#include <pthread.h>" not in s:

              if "#include <thread>" in s:
                  s = s.replace(
                      "#include <thread>",
                      "#include <pthread.h>\n#include <thread>",
                      1
                  )
              else:
                  s = "#include <pthread.h>\n" + s

          if "static void* ThreadEntry(void* arg);" not in s:

              marker = "private:"
              pos = s.find(marker)

              if pos == -1:
                  raise SystemExit(
                      "ERROR: private: section not found in launcher.h"
                  )

              s = (
                  s[:pos]
                  + "    static void* ThreadEntry(void* arg);\n\n"
                  + s[pos:]
              )

          if "std::thread thread_;" not in s:
              raise SystemExit(
                  "ERROR: std::thread thread_ not found in launcher.h"
              )

          s = s.replace(
              "std::thread thread_;",
              "pthread_t thread_{};\n    bool thread_joinable_ = false;",
              1
          )

          p.write_text(s)

          print("launcher.h patched successfully.")
          PY

      # ============================================================
      # 6. Patch launcher.cpp
      # ============================================================
      - name: Patch launcher.cpp
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("src/search/searcher/launcher.cpp")
          s = p.read_text()

          # --------------------------------------------------------
          # Includes
          # --------------------------------------------------------

          if "#include <memory>" not in s:

              marker = '#include "launcher.h"'

              if marker not in s:
                  raise SystemExit(
                      "ERROR: launcher.h include not found."
                  )

              s = s.replace(
                  marker,
                  marker + "\n\n#include <memory>",
                  1
              )

          if "#include <pthread.h>" not in s:

              marker = "#include <memory>"

              if marker in s:
                  s = s.replace(
                      marker,
                      marker + "\n#include <pthread.h>",
                      1
                  )
              else:
                  s = "#include <pthread.h>\n" + s

          # --------------------------------------------------------
          # pthread helper
          # --------------------------------------------------------

          if "LAUNCHER_STACK_SIZE" not in s:

              helper = r'''
          namespace {

          constexpr size_t LAUNCHER_STACK_SIZE =
              16 * 1024 * 1024;

          constexpr size_t SEARCH_STACK_SIZE =
              32 * 1024 * 1024;

          int CreateThreadWithStack(
              pthread_t* thread,
              size_t stack_size,
              void* (*entry)(void*),
              void* argument) {

              pthread_attr_t attr{};

              int result =
                  pthread_attr_init(&attr);

              if (result != 0)
                  return result;

              result =
                  pthread_attr_setstacksize(
                      &attr,
                      stack_size
                  );

              if (result == 0) {

                  result =
                      pthread_create(
                          thread,
                          &attr,
                          entry,
                          argument
                      );
              }

              pthread_attr_destroy(&attr);

              return result;
          }

          } // namespace

          '''

              marker = "namespace q_search {"

              if marker not in s:
                  raise SystemExit(
                      "ERROR: namespace q_search not found."
                  )

              s = s.replace(
                  marker,
                  marker + "\n" + helper,
                  1
              )

          # --------------------------------------------------------
          # LauncherThreadArgs
          # --------------------------------------------------------

          if "struct LauncherThreadArgs" not in s:

              marker = "void SearchLauncher::Start("
              pos = s.find(marker)

              if pos == -1:
                  raise SystemExit(
                      "ERROR: SearchLauncher::Start not found."
                  )

              args_struct = r'''
          namespace {

          struct LauncherThreadArgs {

              SearchLauncher* launcher;

              q_core::Board board;

              std::vector<q_core::Move> moves;

              time_control_t time_control;

              depth_t max_depth;
          };

          } // namespace

          '''

              s = s[:pos] + args_struct + s[pos:]

          # --------------------------------------------------------
          # ThreadEntry
          # --------------------------------------------------------

          if "SearchLauncher::ThreadEntry(void* raw)" not in s:

              marker = "void SearchLauncher::Start("
              pos = s.find(marker)

              if pos == -1:
                  raise SystemExit(
                      "ERROR: SearchLauncher::Start not found."
                  )

              entry = r'''
          void* SearchLauncher::ThreadEntry(void* raw) {

              auto* args =
                  static_cast<LauncherThreadArgs*>(raw);

              args->launcher->StartMainThread(
                  args->board,
                  args->moves,
                  args->time_control,
                  args->max_depth
              );

              delete args;

              return nullptr;
          }

          '''

              s = s[:pos] + entry + s[pos:]

          # --------------------------------------------------------
          # Outer thread
          # --------------------------------------------------------

          outer_pattern = re.compile(
              r"""
              \s*thread_\s*=\s*std::thread
              \s*\(
              \s*\[this,\s*board,\s*moves,\s*time_control,\s*max_depth\]
              \s*\(\s*\)
              \s*\{
              \s*StartMainThread
              \s*\(
              \s*board\s*,\s*moves\s*,\s*time_control\s*,\s*max_depth
              \s*\)
              \s*;
              \s*\}
              \s*\)
              \s*;
              """,
              re.VERBOSE
          )

          outer_replacement = r'''
              auto* args =
                  new LauncherThreadArgs{
                      this,
                      board,
                      moves,
                      time_control,
                      max_depth
                  };

              const int result =
                  CreateThreadWithStack(
                      &thread_,
                      LAUNCHER_STACK_SIZE,
                      &SearchLauncher::ThreadEntry,
                      args
                  );

              if (result != 0) {

                  delete args;

                  thread_joinable_ = false;

                  q_util::PrintError(
                      "Failed to create Quirky launcher thread"
                  );

                  return;
              }

              thread_joinable_ = true;
          '''

          s, count = outer_pattern.subn(
              outer_replacement,
              s,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: outer SearchLauncher std::thread replacement failed."
              )

          # --------------------------------------------------------
          # Searcher heap allocation
          # --------------------------------------------------------

          old = (
              "Searcher searcher(tt_, rt, board, control_, stat);"
          )

          if old in s:

              s = s.replace(
                  old,
                  """auto searcher =
                  std::make_unique<Searcher>(
                      tt_,
                      rt,
                      board,
                      control_,
                      stat
                  );""",
                  1
              )

          elif "std::make_unique<Searcher>" not in s:

              raise SystemExit(
                  "ERROR: Searcher declaration not found."
              )

          # --------------------------------------------------------
          # Pointer call
          # --------------------------------------------------------

          s = s.replace(
              "searcher.Run(max_depth, real_pv_count);",
              "searcher->Run(max_depth, real_pv_count);"
          )

          # --------------------------------------------------------
          # Inner search thread
          # --------------------------------------------------------

          inner_pattern = re.compile(
              r"""
              \s*std::thread\s+search_thread\s*=
              \s*std::thread
              \s*\(\s*\[&\]\s*\(\s*\)\s*\{
              \s*searcher->Run
              \s*\(\s*max_depth\s*,\s*real_pv_count\s*\)
              \s*;
              \s*\}\s*\)
              \s*;
              """,
              re.VERBOSE
          )

          inner_replacement = r'''
              struct SearchThreadArgs {

                  Searcher* searcher;

                  depth_t max_depth;

                  size_t pv_count;
              };

              auto* search_args =
                  new SearchThreadArgs{
                      searcher.get(),
                      max_depth,
                      real_pv_count
                  };

              pthread_t search_thread{};

              const int search_result =
                  CreateThreadWithStack(
                      &search_thread,
                      SEARCH_STACK_SIZE,

                      [](void* raw) -> void* {

                          auto* args =
                              static_cast<SearchThreadArgs*>(
                                  raw
                              );

                          args->searcher->Run(
                              args->max_depth,
                              args->pv_count
                          );

                          delete args;

                          return nullptr;
                      },

                      search_args
                  );

              if (search_result != 0) {

                  delete search_args;

                  q_util::PrintError(
                      "Failed to create Quirky search thread"
                  );

                  return;
              }
          '''

          s, count = inner_pattern.subn(
              inner_replacement,
              s,
              count=1
          )

          if count != 1:

              if "pthread_t search_thread{};" not in s:
                  raise SystemExit(
                      "ERROR: inner search thread replacement failed."
                  )

          # --------------------------------------------------------
          # Joins
          # --------------------------------------------------------

          s = s.replace(
              "search_thread.join();",
              "pthread_join(search_thread, nullptr);"
          )

          s = s.replace(
              "if (thread_.joinable()) {",
              "if (thread_joinable_) {"
          )

          s = s.replace(
              "thread_.join();",
              "pthread_join(thread_, nullptr);\n"
              "        thread_joinable_ = false;"
          )

          p.write_text(s)

          print("launcher.cpp patched successfully.")
          PY

      # ============================================================
      # 7. Verify source
      # ============================================================
      - name: Verify pthread source
        shell: bash
        run: |
          set -e

          FILE="src/search/searcher/launcher.cpp"

          grep -n "LAUNCHER_STACK_SIZE" "$FILE"
          grep -n "SEARCH_STACK_SIZE" "$FILE"
          grep -n "pthread_create" "$FILE"
          grep -n "pthread_join" "$FILE"
          grep -n "make_unique<Searcher>" "$FILE"

          if grep -n "std::thread" "$FILE"; then
              echo "ERROR: std::thread remains."
              exit 1
          fi

          echo "pthread source verification passed."

      # ============================================================
      # 8. Configure CMake
      # ============================================================
      - name: Configure CMake
        shell: bash
        run: |
          set -e

          rm -rf build

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=24 \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK" \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_FLAGS="-O3 -fno-fast-math -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-pthread" \
            -DNO_AVX2=ON

      # ============================================================
      # 9. FIX GENERATED NINJA FLAGS
      #
      # This is the important part.
      #
      # CMakeLists has already been cleaned, but the project's
      # configuration can still inject the remnants:
      #
      #     2 3 4.1 4.2
      #
      # Remove those standalone arguments from build.ninja.
      # ============================================================
      - name: Sanitize generated Ninja flags
        shell: bash
        run: |
          set -e

          echo "Before sanitizing:"
          grep -m 3 "FLAGS =" build/build.ninja || true

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("build/build.ninja")

          if not p.exists():
              raise SystemExit(
                  "ERROR: build.ninja not found."
              )

          s = p.read_text()

          # These are the numeric remnants created by the
          # project's broken x86 flag handling.
          #
          # Match only standalone tokens.
          for token in ["4.2", "4.1", "3", "2"]:
              s = re.sub(
                  rf'(?<!\S){re.escape(token)}(?!\S)',
                  '',
                  s
              )

          # Collapse repeated whitespace.
          s = re.sub(
              r'[ \t]+',
              ' ',
              s
          )

          p.write_text(s)

          print("Generated Ninja file sanitized.")
          PY

          echo
          echo "After sanitizing:"
          grep -m 3 "FLAGS =" build/build.ninja || true

          echo
          echo "Checking for broken numeric arguments..."

          if grep -E \
            'FLAGS =.*(^| )2( |$)' \
            build/build.ninja; then

            echo "ERROR: standalone 2 remains."
            exit 1
          fi

          if grep -E \
            'FLAGS =.*(^| )3( |$)' \
            build/build.ninja; then

            echo "ERROR: standalone 3 remains."
            exit 1
          fi

          if grep -E \
            'FLAGS =.*(^| )4\.1( |$)' \
            build/build.ninja; then

            echo "ERROR: standalone 4.1 remains."
            exit 1
          fi

          if grep -E \
            'FLAGS =.*(^| )4\.2( |$)' \
            build/build.ninja; then

            echo "ERROR: standalone 4.2 remains."
            exit 1
          fi

          echo "Generated Ninja flags are clean."

      # ============================================================
      # 10. Build
      # ============================================================
      - name: Build Quirky
        shell: bash
        run: |
          set -e

          cmake --build build \
            --parallel 2 \
            --verbose

      # ============================================================
      # 11. Locate binary
      # ============================================================
      - name: Locate binary
        shell: bash
        run: |
          set -e

          find build \
            -type f \
            -perm -111 \
            -print

          BINARY=""

          for f in \
            build/Quirky \
            build/quirky \
            build/src/Quirky \
            build/src/quirky; do

            if [ -f "$f" ]; then
              BINARY="$f"
              break
            fi

          done

          if [ -z "$BINARY" ]; then
            BINARY="$(find build -type f -perm -111 | head -n 1)"
          fi

          if [ -z "$BINARY" ]; then
            echo "ERROR: Quirky executable not found."
            exit 1
          fi

          echo "Found:"
          echo "$BINARY"

          cp "$BINARY" Quirky-android-arm64
          chmod +x Quirky-android-arm64

      # ============================================================
      # 12. Verify ARM64
      # ============================================================
      - name: Verify ARM64 ELF
        shell: bash
        run: |
          set -e

          file Quirky-android-arm64

          readelf -h Quirky-android-arm64 | \
            grep -E "Class:|Machine:|Type:"

      # ============================================================
      # 13. Upload
      # ============================================================
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: Quirky-Android-ARM64
          path: Quirky-android-arm64
