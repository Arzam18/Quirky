name: Build Quirky for Android

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Download SIMDe (SIMD Everywhere)
        run: |
          git clone --depth 1 https://github.com/simd-everywhere/simde.git simde

      - name: Patch SIMD/AVX Code and CMake Flags
        run: |
          python3 -c '
          with open("CMakeLists.txt", "r") as f:
              text = f.read()

          # Strip strict x86 flags and warnings
          text = text.replace("-Werror", "")
          text = text.replace("-msse -msse2 -msse3 -mssse3 -msse4.1 -msse4.2 -mpopcnt", "-O3")
          text = text.replace("-mavx -mavx2 -mbmi -mbmi2", "")
          
          # Add SIMDe to the include path so the compiler finds it
          text += "\ninclude_directories(${PROJECT_SOURCE_DIR}/simde)\n"

          with open("CMakeLists.txt", "w") as f:
              f.write(text)
          '

          python3 -c '
          import os

          def patch_file(path):
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()

              original = content

              # Replace standard x86 headers with SIMDe AVX2 headers + Native Aliases
              headers_to_replace = ["<immintrin.h>", "<emmintrin.h>", "<smmintrin.h>", "<nmmintrin.h>", "<tmmintrin.h>", "<xmmintrin.h>"]
              for header in headers_to_replace:
                  if f"#include {header}" in content:
                      content = content.replace(f"#include {header}", "#define SIMDE_ENABLE_NATIVE_ALIASES\n#include <simde/x86/avx2.h>")

              if content != original:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Patched: {path}")

          for root, dirs, files in os.walk("src"):
              for file in files:
                  if file.endswith((".h", ".hpp", ".cpp", ".c")):
                      patch_file(os.path.join(root, file))
          '

      - name: Build Quirky for Android ARM64 (API 28+)
        run: |
          export NDK_CXX="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          export NDK_CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"

          mkdir build && cd build

          cmake .. \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=28 \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" \
            -DCMAKE_CXX_COMPILER="$NDK_CXX" \
            -DCMAKE_C_COMPILER="$NDK_CC" \
            -DCMAKE_BUILD_TYPE=Release \
            -DNO_AVX2=ON

          # Compile the engine
          cmake --build . --config Release --verbose -j$(nproc)

          mkdir -p ../dist/bin
          find . -maxdepth 2 -type f -name "Quirky*" -exec cp {} ../dist/bin/Quirky-android-arm64 \;

      - name: Verify Android Binary
        run: |
          ls -lh dist/bin/
          file dist/bin/*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quirky-android-arm64
          path: dist/bin/*
