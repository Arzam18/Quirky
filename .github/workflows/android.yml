name: Quirky Android ARM64

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. FIND PREINSTALLED ANDROID NDK
      # ============================================================
      - name: Find Android NDK
        shell: bash
        run: |
          set -e

          NDK="$(find "$ANDROID_SDK_ROOT/ndk" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n1)"

          if [ -z "$NDK" ]; then
            echo "ERROR: Android NDK not found."
            exit 1
          fi

          echo "Using NDK:"
          echo "$NDK"

          echo "NDK=$NDK" >> "$GITHUB_ENV"

          echo "TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            >> "$GITHUB_ENV"


      # ============================================================
      # 3. PATCH CMAKE
      #
      # Original Quirky CMake contains:
      #
      # -msse
      # -msse2
      # -msse3
      # -mssse3
      # -msse4.1
      # -msse4.2
      # -mpopcnt
      # -mavx
      # -mavx2
      # -mbmi
      # -mbmi2
      #
      # These are x86-only.
      # ============================================================
      - name: Patch CMake for ARM64
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("CMakeLists.txt")
          text = p.read_text()

          old = '''set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -pthread -O2 -msse -msse2 -msse3 -mssse3 -msse4.1 -msse4.2 -mpopcnt")'''

          new = '''set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -pthread -O2")'''

          if old not in text:
              raise SystemExit(
                  "ERROR: expected original CMAKE_CXX_FLAGS line was not found."
              )

          text = text.replace(old, new, 1)

          old = '''else()
          set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -mavx -mavx2 -mbmi -mbmi2")
          endif()'''

          new = '''else()
          message(FATAL_ERROR "NO_AVX2 must be enabled for the ARM64 build")
          endif()'''

          if old not in text:
              raise SystemExit(
                  "ERROR: expected AVX2 CMake block was not found."
              )

          text = text.replace(old, new, 1)

          p.write_text(text)
          PY

          echo
          echo "===== PATCHED CMakeLists.txt ====="
          cat CMakeLists.txt


      # ============================================================
      # 4. VERIFY NO X86 FLAGS
      # ============================================================
      - name: Verify CMake
        shell: bash
        run: |
          set -e

          if grep -nE \
            -- '-m(sse|ssse|avx|avx2|popcnt|bmi|bmi2|fma|f16c|abm|xop)' \
            CMakeLists.txt; then

            echo "ERROR: x86 flags remain."
            exit 1
          fi

          echo "OK: CMake contains no x86 compiler flags."


      # ============================================================
      # 5. REPLACE AVX2-ONLY NNUE LAYERS
      #
      # The original layers.h explicitly says compilation without
      # AVX2 is unsupported and directly includes immintrin.h.
      #
      # ARM64 cannot compile that implementation.
      #
      # This version keeps the same layer interfaces and performs
      # the operations scalarly.
      # ============================================================
      - name: Make NNUE layers ARM portable
        shell: bash
        run: |
          set -e

          cat > src/eval/layers.h <<'EOF'
          #ifndef QUIRKY_SRC_EVAL_LAYERS_H
          #define QUIRKY_SRC_EVAL_LAYERS_H

          #include <algorithm>
          #include <array>
          #include <cmath>
          #include <cstddef>
          #include <cstdint>
          #include <limits>

          #include "core/board/types.h"
          #include "core/util.h"
          #include "model_weights.h"
          #include "util/bit.h"
          #include "util/io.h"

          namespace q_eval {

          static constexpr int WEIGHT_SCALE = 64;
          static constexpr int ACTIVATION_SCALE = 127;
          static constexpr int OUTPUT_SCALE = 64 * 64;
          static constexpr int PRECISE_WEIGHT_SCALE = 64;

          static constexpr uint8_t FEATURE_ADDITIONAL_PRECISION = 5;
          static constexpr uint8_t LINEAR_ADDITIONAL_PRECISION = 3;


          struct ModelReader {
            public:

              template <std::integral T>
              T ReadWeight(int scale) {

                  float weight = MODEL_WEIGHTS[index_++];

                  int64_t final_weight =
                      std::round(weight * scale);

                  if (
                      final_weight >
                          static_cast<int64_t>(
                              std::numeric_limits<T>::max())
                      ||
                      final_weight <
                          static_cast<int64_t>(
                              std::numeric_limits<T>::min())
                  ) {
                      q_util::ExitWithError(
                          "Model weights are out of range"
                      );
                  }

                  return static_cast<T>(final_weight);
              }

            private:

              size_t index_ = 0;
          };


          // ==========================================================
          // FEATURE LAYER
          // ==========================================================

          template <size_t INPUT_SIZE, size_t OUTPUT_SIZE>
          struct FeatureLayer {

            public:

              void Initialize(ModelReader& reader) {

                  for (size_t i = 0; i < INPUT_SIZE; i++) {

                      for (
                          size_t j = 0;
                          j < OUTPUT_SIZE / 2;
                          j++
                      ) {

                          weights_[i][j] =
                              reader.ReadWeight<int16_t>(
                                  ACTIVATION_SCALE *
                                  (1 << FEATURE_ADDITIONAL_PRECISION)
                              );

                          const q_core::cell_t cell =
                              i / q_core::BOARD_SIZE + 1;

                          const q_core::coord_t coord =
                              i % q_core::BOARD_SIZE;

                          size_t pos =
                              (
                                  static_cast<size_t>(
                                      q_core::FlipCellColor(cell)
                                  ) - 1
                              ) *
                              q_core::BOARD_SIZE
                              +
                              q_core::FlipCoord(coord);

                          weights_[pos][j + OUTPUT_SIZE / 2] =
                              weights_[i][j];
                      }
                  }

                  for (
                      size_t i = 0;
                      i < OUTPUT_SIZE / 2;
                      i++
                  ) {

                      biases_[i] =
                          reader.ReadWeight<int16_t>(
                              ACTIVATION_SCALE *
                              (1 << FEATURE_ADDITIONAL_PRECISION)
                          );

                      biases_[i + OUTPUT_SIZE / 2] =
                          biases_[i];
                  }
              }


              void GetResultOnEmptyBoard(int16_t* output) {

                  std::copy(
                      biases_.begin(),
                      biases_.end(),
                      output
                  );
              }


              void Update(
                  int16_t* input,
                  size_t position,
                  int8_t delta
              ) {

                  const int16_t* weights =
                      weights_[position].data();

                  if (delta == -1) {

                      for (
                          uint16_t i = 0;
                          i < OUTPUT_SIZE;
                          i++
                      ) {
                          input[i] -= weights[i];
                      }

                  } else {

                      for (
                          uint16_t i = 0;
                          i < OUTPUT_SIZE;
                          i++
                      ) {
                          input[i] += weights[i];
                      }
                  }
              }


              void Add(
                  int16_t* input,
                  size_t position
              ) {

                  const int16_t* weights =
                      weights_[position].data();

                  for (
                      size_t i = 0;
                      i < OUTPUT_SIZE;
                      i++
                  ) {

                      uint16_t value =
                          static_cast<uint16_t>(
                              input[i]
                          );

                      value =
                          static_cast<uint16_t>(
                              value +
                              static_cast<uint16_t>(
                                  weights[i]
                              )
                          );

                      input[i] =
                          static_cast<int16_t>(value);
                  }
              }


              void SubAdd(
                  int16_t* input,
                  size_t position_first,
                  size_t position_second
              ) {

                  const int16_t* first =
                      weights_[position_first].data();

                  const int16_t* second =
                      weights_[position_second].data();

                  for (
                      size_t i = 0;
                      i < OUTPUT_SIZE;
                      i++
                  ) {

                      uint16_t value =
                          static_cast<uint16_t>(
                              input[i]
                          );

                      value =
                          static_cast<uint16_t>(
                              value -
                              static_cast<uint16_t>(
                                  first[i]
                              )
                          );

                      value =
                          static_cast<uint16_t>(
                              value +
                              static_cast<uint16_t>(
                                  second[i]
                              )
                          );

                      input[i] =
                          static_cast<int16_t>(value);
                  }
              }


              void SubSubAdd(
                  int16_t* input,
                  size_t position_first,
                  size_t position_second,
                  size_t position_third
              ) {

                  const int16_t* first =
                      weights_[position_first].data();

                  const int16_t* second =
                      weights_[position_second].data();

                  const int16_t* third =
                      weights_[position_third].data();

                  for (
                      size_t i = 0;
                      i < OUTPUT_SIZE;
                      i++
                  ) {

                      uint16_t value =
                          static_cast<uint16_t>(
                              input[i]
                          );

                      value =
                          static_cast<uint16_t>(
                              value -
                              static_cast<uint16_t>(
                                  first[i]
                              )
                          );

                      value =
                          static_cast<uint16_t>(
                              value -
                              static_cast<uint16_t>(
                                  second[i]
                              )
                          );

                      value =
                          static_cast<uint16_t>(
                              value +
                              static_cast<uint16_t>(
                                  third[i]
                              )
                          );

                      input[i] =
                          static_cast<int16_t>(value);
                  }
              }


            private:

              alignas(64)
              std::array<
                  std::array<int16_t, OUTPUT_SIZE>,
                  INPUT_SIZE
              > weights_;

              alignas(64)
              std::array<
                  int16_t,
                  OUTPUT_SIZE
              > biases_;
          };


          // ==========================================================
          // LINEAR LAYER
          // ==========================================================

          template <size_t INPUT_SIZE, size_t OUTPUT_SIZE>
          struct LinearLayer {

            public:

              void Initialize(ModelReader& reader) {

                  for (
                      size_t i = 0;
                      i < INPUT_SIZE;
                      i++
                  ) {

                      for (
                          size_t j = 0;
                          j < OUTPUT_SIZE;
                          j++
                      ) {

                          weights_[
                              GetWeightIndex(
                                  static_cast<int>(
                                      j * INPUT_SIZE + i
                                  )
                              )
                          ] =
                              reader.ReadWeight<int8_t>(
                                  WEIGHT_SCALE *
                                  (1 << LINEAR_ADDITIONAL_PRECISION)
                              );
                      }
                  }

                  for (
                      size_t i = 0;
                      i < OUTPUT_SIZE;
                      i++
                  ) {

                      biases_[i] =
                          reader.ReadWeight<int32_t>(
                              ACTIVATION_SCALE *
                              WEIGHT_SCALE *
                              (1 << LINEAR_ADDITIONAL_PRECISION)
                          );
                  }
              }


              void Process(
                  const int8_t* src,
                  int32_t* dest
              ) {

                  for (
                      size_t output = 0;
                      output < OUTPUT_SIZE;
                      output++
                  ) {

                      int64_t sum =
                          biases_[output];

                      for (
                          size_t input = 0;
                          input < INPUT_SIZE;
                          input++
                      ) {

                          const uint8_t activation =
                              static_cast<uint8_t>(
                                  src[input]
                              );

                          const int8_t weight =
                              weights_[
                                  GetWeightIndex(
                                      static_cast<int>(
                                          output *
                                          INPUT_SIZE +
                                          input
                                      )
                                  )
                              ];

                          sum +=
                              static_cast<int64_t>(
                                  activation
                              )
                              *
                              static_cast<int64_t>(
                                  weight
                              );
                      }

                      dest[output] =
                          static_cast<int32_t>(
                              sum >>
                              LINEAR_ADDITIONAL_PRECISION
                          );
                  }
              }


            private:

              static constexpr int GetWeightIndex(
                  int idx
              ) {

                  return
                      (
                          (idx / 4)
                          %
                          (INPUT_SIZE / 4)
                          *
                          OUTPUT_SIZE *
                          4
                      )
                      +
                      (idx / INPUT_SIZE * 4)
                      +
                      (idx % 4);
              }


              alignas(64)
              std::array<
                  int8_t,
                  INPUT_SIZE * OUTPUT_SIZE
              > weights_;

              alignas(64)
              std::array<
                  int32_t,
                  OUTPUT_SIZE
              > biases_;
          };


          // ==========================================================
          // PRECISE LINEAR LAYER
          // ==========================================================

          template <size_t INPUT_SIZE, size_t OUTPUT_SIZE>
          struct PreciseLinearLayer {

            public:

              void Initialize(ModelReader& reader) {

                  for (
                      size_t i = 0;
                      i < INPUT_SIZE;
                      i++
                  ) {

                      for (
                          size_t j = 0;
                          j < OUTPUT_SIZE;
                          j++
                      ) {

                          weights_[
                              j * INPUT_SIZE + i
                          ] =
                              reader.ReadWeight<int16_t>(
                                  WEIGHT_SCALE *
                                  PRECISE_WEIGHT_SCALE
                              );
                      }
                  }

                  for (
                      size_t i = 0;
                      i < OUTPUT_SIZE;
                      i++
                  ) {

                      biases_[i] =
                          reader.ReadWeight<int32_t>(
                              ACTIVATION_SCALE *
                              WEIGHT_SCALE *
                              WEIGHT_SCALE *
                              PRECISE_WEIGHT_SCALE
                          );
                  }
              }


              void Process(
                  const int16_t* input,
                  int32_t* output
              ) {

                  constexpr int SHIFT =
                      q_util::GetHighestBit(
                          static_cast<uint32_t>(
                              WEIGHT_SCALE *
                              PRECISE_WEIGHT_SCALE
                          )
                      );

                  for (
                      size_t out = 0;
                      out < OUTPUT_SIZE;
                      out++
                  ) {

                      int64_t sum =
                          biases_[out];

                      const size_t offset =
                          out * INPUT_SIZE;

                      for (
                          size_t i = 0;
                          i < INPUT_SIZE;
                          i++
                      ) {

                          sum +=
                              static_cast<int64_t>(
                                  input[i]
                              )
                              *
                              static_cast<int64_t>(
                                  weights_[
                                      offset + i
                                  ]
                              );
                      }

                      output[out] =
                          static_cast<int32_t>(
                              sum >> SHIFT
                          );
                  }
              }


            private:

              alignas(64)
              std::array<
                  int16_t,
                  INPUT_SIZE * OUTPUT_SIZE
              > weights_;

              alignas(64)
              std::array<
                  int32_t,
                  OUTPUT_SIZE
              > biases_;
          };


          // ==========================================================
          // OUTPUT LAYER
          // ==========================================================

          template <size_t INPUT_SIZE>
          struct OutputLayer {

            public:

              void Initialize(ModelReader& reader) {

                  for (
                      size_t i = 0;
                      i < INPUT_SIZE;
                      i++
                  ) {

                      weights_[i] =
                          reader.ReadWeight<int16_t>(
                              WEIGHT_SCALE *
                              OUTPUT_SCALE /
                              ACTIVATION_SCALE
                          );
                  }

                  bias_ =
                      reader.ReadWeight<int32_t>(
                          WEIGHT_SCALE *
                          OUTPUT_SCALE
                      );
              }


              int32_t Process(
                  const int16_t* input
              ) {

                  int64_t ans =
                      bias_;

                  for (
                      uint16_t i = 0;
                      i < INPUT_SIZE;
                      i++
                  ) {

                      ans +=
                          static_cast<int64_t>(
                              input[i]
                          )
                          *
                          static_cast<int64_t>(
                              weights_[i]
                          );
                  }

                  return static_cast<int32_t>(ans);
              }


            private:

              alignas(64)
              std::array<
                  int16_t,
                  INPUT_SIZE
              > weights_;

              int32_t bias_;
          };


          // ==========================================================
          // ACTIVATION FUNCTIONS
          // ==========================================================

          inline void ClippedReLU16(
              int size,
              int8_t* output,
              const int16_t* input
          ) {

              for (
                  int i = 0;
                  i < size;
                  i++
              ) {

                  int value =
                      static_cast<int>(
                          input[i]
                      )
                      >>
                      FEATURE_ADDITIONAL_PRECISION;

                  if (value < 0)
                      value = 0;

                  if (value > 127)
                      value = 127;

                  output[i] =
                      static_cast<int8_t>(
                          value
                      );
              }
          }


          inline void ClippedReLU32(
              int size,
              int16_t* output,
              const int32_t* input
          ) {

              constexpr int upper =
                  32768 *
                  WEIGHT_SCALE /
                  256
                  -
                  1;

              for (
                  int i = 0;
                  i < size;
                  i++
              ) {

                  int32_t value =
                      input[i];

                  if (value < 0)
                      value = 0;

                  if (value > upper)
                      value = upper;

                  output[i] =
                      static_cast<int16_t>(
                          value
                      );
              }
          }

          }  // namespace q_eval

          #endif
          EOF

          echo "ARM64 NNUE layer implementation installed."


      # ============================================================
      # 6. PATCH LAUNCHER HEADER
      #
      # This is based on the exact launcher.h in the uploaded ZIP.
      # ============================================================
      - name: Patch launcher header
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "src/search/searcher/launcher.h"
          )

          text = p.read_text()

          old = '''#include <thread>'''

          new = '''#include <pthread.h>'''

          if old not in text:
              raise SystemExit(
                  "ERROR: expected <thread> include not found in launcher.h"
              )

          text = text.replace(old, new, 1)


          old = '''    std::thread thread_;'''

          new = '''    pthread_t thread_{};
              bool thread_joinable_ = false;
              static void* LauncherThreadEntry(void* raw);'''

          if old not in text:
              raise SystemExit(
                  "ERROR: expected std::thread member not found in launcher.h"
              )

          text = text.replace(old, new, 1)

          p.write_text(text)
          PY

          echo "launcher.h patched."


      # ============================================================
      # 7. PATCH LAUNCHER CPP
      #
      # Every replacement below is matched against the exact source
      # from the uploaded Quirky archive.
      # ============================================================
      - name: Patch launcher implementation
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "src/search/searcher/launcher.cpp"
          )

          text = p.read_text()


          # --------------------------------------------------------
          # Includes
          # --------------------------------------------------------

          old = '''#include "launcher.h"

          #include <string>
          #include <utility>'''

          new = '''#include "launcher.h"

          #include <memory>
          #include <pthread.h>
          #include <string>
          #include <utility>'''

          if old not in text:
              raise SystemExit(
                  "ERROR: launcher.cpp include block does not match."
              )

          text = text.replace(old, new, 1)


          # --------------------------------------------------------
          # Insert pthread helpers
          # --------------------------------------------------------

          marker = '''namespace q_search {

          uint8_t GetRTByteSizeLog'''

          replacement = '''namespace q_search {

          namespace {

          constexpr size_t LAUNCHER_STACK_SIZE =
              16 * 1024 * 1024;

          constexpr size_t SEARCH_STACK_SIZE =
              32 * 1024 * 1024;


          struct LauncherThreadArgs {
              SearchLauncher* self;
              q_core::Board board;
              std::vector<q_core::Move> moves;
              time_control_t time_control;
              depth_t max_depth;
          };


          struct SearchThreadArgs {
              Searcher* searcher;
              depth_t max_depth;
              size_t pv_count;
          };


          bool CreateThreadWithStack(
              pthread_t* thread,
              size_t stack_size,
              void* (*entry)(void*),
              void* argument
          ) {

              pthread_attr_t attr;

              if (pthread_attr_init(&attr) != 0)
                  return false;

              if (
                  pthread_attr_setstacksize(
                      &attr,
                      stack_size
                  ) != 0
              ) {

                  pthread_attr_destroy(&attr);
                  return false;
              }

              const int result =
                  pthread_create(
                      thread,
                      &attr,
                      entry,
                      argument
                  );

              pthread_attr_destroy(&attr);

              return result == 0;
          }


          void* SearchThreadEntry(void* raw) {

              auto* args =
                  static_cast<SearchThreadArgs*>(
                      raw
                  );

              args->searcher->Run(
                  args->max_depth,
                  args->pv_count
              );

              delete args;

              return nullptr;
          }

          }  // namespace


          uint8_t GetRTByteSizeLog'''

          if marker not in text:
              raise SystemExit(
                  "ERROR: launcher namespace marker does not match."
              )

          text = text.replace(
              marker,
              replacement,
              1
          )


          # --------------------------------------------------------
          # SearchLauncher::Start
          # --------------------------------------------------------

          old = '''void SearchLauncher::Start(const q_core::Board& board, const std::vector<q_core::Move>& moves,
                                             time_control_t time_control, depth_t max_depth) {
              Join();
              control_.Reset();
              tt_.NextPosition();
              thread_ = std::thread([this, board, moves, time_control, max_depth]() {
                  StartMainThread(board, moves, time_control, max_depth);
              });
          }'''

          new = '''void SearchLauncher::Start(const q_core::Board& board, const std::vector<q_core::Move>& moves,
                                             time_control_t time_control, depth_t max_depth) {
              Join();
              control_.Reset();
              tt_.NextPosition();

              auto* args =
                  new LauncherThreadArgs{
                      this,
                      board,
                      moves,
                      time_control,
                      max_depth
                  };

              if (!CreateThreadWithStack(
                      &thread_,
                      LAUNCHER_STACK_SIZE,
                      &SearchLauncher::LauncherThreadEntry,
                      args)) {

                  delete args;
                  thread_joinable_ = false;

                  q_util::PrintError(
                      "Failed to create launcher thread"
                  );

                  return;
              }

              thread_joinable_ = true;
          }'''

          if old not in text:
              raise SystemExit(
                  "ERROR: exact SearchLauncher::Start block not found."
              )

          text = text.replace(old, new, 1)


          # --------------------------------------------------------
          # Launcher thread entry
          # --------------------------------------------------------

          marker = '''uint64_t GetNPS(const SearchStat& stat, time_t time_since_start)'''

          replacement = '''void* SearchLauncher::LauncherThreadEntry(
              void* raw
          ) {

              auto* args =
                  static_cast<LauncherThreadArgs*>(
                      raw
                  );

              args->self->StartMainThread(
                  args->board,
                  args->moves,
                  args->time_control,
                  args->max_depth
              );

              delete args;

              return nullptr;
          }


          uint64_t GetNPS(const SearchStat& stat, time_t time_since_start)'''

          if marker not in text:
              raise SystemExit(
                  "ERROR: GetNPS marker not found."
              )

          text = text.replace(
              marker,
              replacement,
              1
          )


          # --------------------------------------------------------
          # Searcher creation + inner search thread
          # --------------------------------------------------------

          old = '''    SearchStat stat;
              Searcher searcher(tt_, rt, board, control_, stat);
              SearchTimer timer(time_control, board, stat);
              std::thread search_thread = std::thread([&]() { searcher.Run(max_depth, real_pv_count); });'''

          new = '''    SearchStat stat;

              auto searcher =
                  std::make_unique<Searcher>(
                      tt_,
                      rt,
                      board,
                      control_,
                      stat
                  );

              SearchTimer timer(
                  time_control,
                  board,
                  stat
              );

              auto* search_args =
                  new SearchThreadArgs{
                      searcher.get(),
                      max_depth,
                      real_pv_count
                  };

              pthread_t search_thread{};

              if (!CreateThreadWithStack(
                      &search_thread,
                      SEARCH_STACK_SIZE,
                      SearchThreadEntry,
                      search_args
                  )) {

                  delete search_args;

                  q_util::PrintError(
                      "Failed to create search thread"
                  );

                  return;
              }'''

          if old not in text:
              raise SystemExit(
                  "ERROR: exact Searcher/std::thread block not found."
              )

          text = text.replace(old, new, 1)


          # --------------------------------------------------------
          # Inner join
          # --------------------------------------------------------

          old = '''    search_thread.join();'''

          new = '''    pthread_join(
              search_thread,
              nullptr
          );'''

          if old not in text:
              raise SystemExit(
                  "ERROR: search_thread.join() not found."
              )

          text = text.replace(old, new, 1)


          # --------------------------------------------------------
          # Launcher Join()
          # --------------------------------------------------------

          old = '''void SearchLauncher::Join() {
              if (thread_.joinable()) {
                  control_.Stop();
                  thread_.join();
              }
          }'''

          new = '''void SearchLauncher::Join() {
              if (thread_joinable_) {

                  control_.Stop();

                  pthread_join(
                      thread_,
                      nullptr
                  );

                  thread_joinable_ = false;
              }
          }'''

          if old not in text:
              raise SystemExit(
                  "ERROR: exact SearchLauncher::Join block not found."
              )

          text = text.replace(old, new, 1)


          # --------------------------------------------------------
          # Make sure we didn't accidentally leave std::thread.
          # --------------------------------------------------------

          if "std::thread" in text:
              raise SystemExit(
                  "ERROR: std::thread remains in launcher.cpp."
              )

          p.write_text(text)

          print("launcher.cpp patched successfully.")
          PY


      # ============================================================
      # 8. VERIFY SOURCE PATCHES
      # ============================================================
      - name: Verify source
        shell: bash
        run: |
          set -e

          echo "===== THREAD STACKS ====="

          grep -nE \
            'LAUNCHER_STACK_SIZE|SEARCH_STACK_SIZE' \
            src/search/searcher/launcher.cpp

          echo
          echo "===== PTHREAD ====="

          grep -nE \
            'pthread_create|pthread_join|pthread_attr_setstacksize' \
            src/search/searcher/launcher.cpp

          echo
          echo "===== SEARCHER HEAP ====="

          grep -n \
            'make_unique<Searcher>' \
            src/search/searcher/launcher.cpp

          echo
          echo "===== CHECK std::thread ====="

          if grep -RIn \
            'std::thread' \
            src/search/searcher/launcher.cpp \
            src/search/searcher/launcher.h; then

            echo "ERROR: std::thread remains."
            exit 1
          fi

          echo "OK."


      # ============================================================
      # 9. CLEAN BUILD DIRECTORY
      # ============================================================
      - name: Clean build
        shell: bash
        run: |
          set -eux

          rm -rf build


      # ============================================================
      # 10. CONFIGURE
      # ============================================================
      - name: Configure ARM64
        shell: bash
        run: |
          set -eux

          export CC="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"

          "$CC" --version
          "$CXX" --version

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_FLAGS="-O3 -fno-fast-math -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-O3 -fno-fast-math -fno-omit-frame-pointer -pthread -DNO_AVX2=1" \
            -DCMAKE_EXE_LINKER_FLAGS="-pthread" \
            -DNO_AVX2=ON


      # ============================================================
      # 11. VERIFY GENERATED FLAGS
      # ============================================================
      - name: Verify generated flags
        shell: bash
        run: |
          set -e

          echo "===== X86 FLAGS IN BUILD ====="

          if grep -RInE \
            -- '-m(sse|ssse|avx|avx2|popcnt|bmi|bmi2|fma|f16c|abm|xop)' \
            build \
            --include='build.ninja' \
            --include='*.ninja'; then

            echo "ERROR: x86 flags reached generated build files."
            exit 1
          fi

          echo "OK: no x86 flags."


      # ============================================================
      # 12. BUILD
      # ============================================================
      - name: Build Quirky
        shell: bash
        run: |
          set -eux

          cmake --build build --parallel 2


      # ============================================================
      # 13. LOCATE BINARY
      # ============================================================
      - name: Locate binary
        shell: bash
        run: |
          set -e

          BIN="$(find build \
            -type f \
            -perm -111 \
            -name Quirky \
            | head -n1)"

          if [ -z "$BIN" ]; then
            echo "ERROR: Quirky executable was not found."
            exit 1
          fi

          echo "Found:"
          echo "$BIN"

          echo "BIN=$BIN" >> "$GITHUB_ENV"


      # ============================================================
      # 14. VERIFY ELF
      # ============================================================
      - name: Verify AArch64 binary
        shell: bash
        run: |
          set -e

          file "$BIN"

          readelf -h "$BIN" | grep -E \
            'Class:|Machine:|Type:'

          if ! readelf -h "$BIN" | grep -q 'AArch64'; then
            echo "ERROR: binary is not AArch64."
            exit 1
          fi

          echo "OK: ARM64 ELF."


      # ============================================================
      # 15. PACKAGE
      # ============================================================
      - name: Package
        shell: bash
        run: |
          set -e

          mkdir -p artifact

          cp "$BIN" \
            artifact/Quirky-android-arm64

          chmod +x \
            artifact/Quirky-android-arm64

          ls -lh \
            artifact/Quirky-android-arm64


      # ============================================================
      # 16. UPLOAD
      # ============================================================
      - name: Upload ARM64 engine
        uses: actions/upload-artifact@v4
        with:
          name: Quirky-android-arm64
          path: artifact/Quirky-android-arm64
          if-no-files-found: error
