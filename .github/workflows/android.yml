name: Build Quirky for Android ARM64

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Configure Android ARM64
        shell: bash
        run: |
          set -eux

          export NDK="$ANDROID_NDK_LATEST_HOME"

          test -d "$NDK"

          export NDK_CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          export NDK_CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"

          test -x "$NDK_CXX"
          test -x "$NDK_CC"

          rm -rf build

          cmake -S . -B build             -G Ninja             -DCMAKE_SYSTEM_NAME=Android             -DCMAKE_SYSTEM_VERSION=28             -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a             -DCMAKE_ANDROID_NDK="$NDK"             -DCMAKE_CXX_COMPILER="$NDK_CXX"             -DCMAKE_C_COMPILER="$NDK_CC"             -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          set -eux
          cmake --build build --config Release --parallel 2

      - name: Verify ARM64 executable
        shell: bash
        run: |
          set -eux

          BIN="build/Quirky"
          test -f "$BIN"

          file "$BIN"
          readelf -h "$BIN" | grep -E "Class|Machine"
          readelf -d "$BIN" | grep NEEDED || true

          mkdir -p dist/bin
          cp "$BIN" dist/bin/Quirky-android-arm64
          chmod 755 dist/bin/Quirky-android-arm64

          ls -lh dist/bin/Quirky-android-arm64

      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: quirky-android-arm64
          path: dist/bin/Quirky-android-arm64
          if-no-files-found: error
