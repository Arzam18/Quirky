name: Quirky Android ARM64

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # FIND ANDROID NDK
      # ============================================================
      - name: Find Android NDK
        shell: bash
        run: |
          set -e

          NDK="$(find "$ANDROID_SDK_ROOT/ndk" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | sort -V \
            | tail -n1)"

          if [ -z "$NDK" ]; then
            echo "ERROR: Android NDK not found"
            exit 1
          fi

          echo "Using NDK:"
          echo "$NDK"

          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"


      # ============================================================
      # PATCH CMAKE
      #
      # The original CMakeLists contains:
      #
      # -msse
      # -msse2
      # -msse3
      # -mssse3
      # -msse4.1
      # -msse4.2
      # -mpopcnt
      # -mavx
      # -mavx2
      # -mbmi
      # -mbmi2
      #
      # These are x86-only.
      # ============================================================
      - name: Patch CMakeLists for ARM64
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("CMakeLists.txt")

          if not path.exists():
              raise SystemExit("ERROR: CMakeLists.txt not found")

          lines = path.read_text().splitlines()

          output = []
          inserted = False

          for line in lines:

              if re.match(r'^\s*set\s*\(\s*CMAKE_CXX_FLAGS\b', line):

                  if not inserted:
                      output.append(
                          'set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -pthread -O2")'
                      )
                      inserted = True

                  continue

              output.append(line)

          if not inserted:
              output.insert(
                  4,
                  'set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -pthread -O2")'
              )

          path.write_text("\n".join(output) + "\n")

          print("Patched CMakeLists.txt")
          PY

          echo
          echo "===== CMakeLists.txt ====="
          cat CMakeLists.txt


      # ============================================================
      # VERIFY NO X86 FLAGS IN CMAKE
      # ============================================================
      - name: Verify CMake flags
        shell: bash
        run: |
          set -e

          echo "===== Checking CMake x86 flags ====="

          if grep -nE \
            -- \
            '-m(sse|ssse|avx|avx2|popcnt|bmi|bmi2|fma|f16c|abm|xop)' \
            CMakeLists.txt ; then

            echo "ERROR: x86 flags remain in CMakeLists.txt"
            exit 1
          fi

          echo "OK: no x86 compiler flags remain."


      # ============================================================
      # REPLACE AVX2 NNUE LAYERS
      #
      # Original layers.h is explicitly AVX2-only.
      #
      # This first ARM build uses scalar implementations with
      # the same layer interfaces and weight layout.
      #
      # Correctness first.
      # NEON optimization comes later.
      # ============================================================
      - name: Replace AVX2 NNUE layers with ARM-safe implementation
        shell: bash
        run: |
          set -e

          cat > src/eval/layers.h <<'EOF'
          #ifndef QUIRKY_SRC_EVAL_LAYERS_H
          #define QUIRKY_SRC_EVAL_LAYERS_H

          #include <algorithm>
          #include <array>
          #include <cmath>
          #include <concepts>
          #include <cstddef>
          #include <cstdint>
          #include <limits>

          #include "core/board/types.h"
          #include "core/util.h"
          #include "model_weights.h"
          #include "util/bit.h"
          #include "util/io.h"

          namespace q_eval {

          static constexpr int WEIGHT_SCALE = 64;
          static constexpr int ACTIVATION_SCALE = 127;
          static constexpr int OUTPUT_SCALE = 64 * 64;
          static constexpr int PRECISE_WEIGHT_SCALE = 64;

          static constexpr uint8_t FEATURE_ADDITIONAL_PRECISION = 5;
          static constexpr uint8_t LINEAR_ADDITIONAL_PRECISION = 3;


          struct ModelReader {

            template <std::integral T>
            T ReadWeight(int scale) {

                float weight = MODEL_WEIGHTS[index_++];

                int64_t final_weight =
                    std::round(weight * scale);

                if (
                    final_weight >
                        static_cast<int64_t>(
                            std::numeric_limits<T>::max())
                    ||
                    final_weight <
                        static_cast<int64_t>(
                            std::numeric_limits<T>::min())
                ) {
                    q_util::ExitWithError(
                        "Model weights are out of range"
                    );
                }

                return static_cast<T>(final_weight);
            }

          private:

            size_t index_ = 0;
          };


          // ==========================================================
          // FEATURE LAYER
          // ==========================================================

          template <size_t INPUT_SIZE, size_t OUTPUT_SIZE>
          struct FeatureLayer {

            void Initialize(ModelReader& reader) {

                for (size_t i = 0; i < INPUT_SIZE; i++) {

                    for (
                        size_t j = 0;
                        j < OUTPUT_SIZE / 2;
                        j++
                    ) {

                        weights_[i][j] =
                            reader.ReadWeight<int16_t>(
                                ACTIVATION_SCALE *
                                (1 << FEATURE_ADDITIONAL_PRECISION)
                            );

                        const q_core::cell_t cell =
                            i / q_core::BOARD_SIZE + 1;

                        const q_core::coord_t coord =
                            i % q_core::BOARD_SIZE;

                        size_t pos =
                            (
                                static_cast<size_t>(
                                    q_core::FlipCellColor(cell)
                                ) - 1
                            )
                            *
                            q_core::BOARD_SIZE
                            +
                            q_core::FlipCoord(coord);

                        weights_[pos][j + OUTPUT_SIZE / 2] =
                            weights_[i][j];
                    }
                }

                for (
                    size_t i = 0;
                    i < OUTPUT_SIZE / 2;
                    i++
                ) {

                    biases_[i] =
                        reader.ReadWeight<int16_t>(
                            ACTIVATION_SCALE *
                            (1 << FEATURE_ADDITIONAL_PRECISION)
                        );

                    biases_[i + OUTPUT_SIZE / 2] =
                        biases_[i];
                }
            }


            void GetResultOnEmptyBoard(int16_t* output) {

                std::copy(
                    biases_.begin(),
                    biases_.end(),
                    output
                );
            }


            void Update(
                int16_t* input,
                size_t position,
                int8_t delta
            ) {

                const int16_t* weights =
                    weights_[position].data();

                for (
                    size_t i = 0;
                    i < OUTPUT_SIZE;
                    i++
                ) {

                    uint16_t value =
                        static_cast<uint16_t>(input[i]);

                    uint16_t weight =
                        static_cast<uint16_t>(weights[i]);

                    if (delta == -1) {

                        value =
                            static_cast<uint16_t>(
                                value - weight
                            );

                    } else {

                        value =
                            static_cast<uint16_t>(
                                value + weight
                            );
                    }

                    input[i] =
                        static_cast<int16_t>(value);
                }
            }


            void Add(
                int16_t* input,
                size_t position
            ) {

                const int16_t* weights =
                    weights_[position].data();

                for (
                    size_t i = 0;
                    i < OUTPUT_SIZE;
                    i++
                ) {

                    uint16_t value =
                        static_cast<uint16_t>(input[i]);

                    value =
                        static_cast<uint16_t>(
                            value +
                            static_cast<uint16_t>(weights[i])
                        );

                    input[i] =
                        static_cast<int16_t>(value);
                }
            }


            void SubAdd(
                int16_t* input,
                size_t position_first,
                size_t position_second
            ) {

                const int16_t* first =
                    weights_[position_first].data();

                const int16_t* second =
                    weights_[position_second].data();

                for (
                    size_t i = 0;
                    i < OUTPUT_SIZE;
                    i++
                ) {

                    uint16_t value =
                        static_cast<uint16_t>(input[i]);

                    value =
                        static_cast<uint16_t>(
                            value -
                            static_cast<uint16_t>(first[i])
                        );

                    value =
                        static_cast<uint16_t>(
                            value +
                            static_cast<uint16_t>(second[i])
                        );

                    input[i] =
                        static_cast<int16_t>(value);
                }
            }


            void SubSubAdd(
                int16_t* input,
                size_t position_first,
                size_t position_second,
                size_t position_third
            ) {

                const int16_t* first =
                    weights_[position_first].data();

                const int16_t* second =
                    weights_[position_second].data();

                const int16_t* third =
                    weights_[position_third].data();

                for (
                    size_t i = 0;
                    i < OUTPUT_SIZE;
                    i++
                ) {

                    uint16_t value =
                        static_cast<uint16_t>(input[i]);

                    value =
                        static_cast<uint16_t>(
                            value -
                            static_cast<uint16_t>(first[i])
                        );

                    value =
                        static_cast<uint16_t>(
                            value -
                            static_cast<uint16_t>(second[i])
                        );

                    value =
                        static_cast<uint16_t>(
                            value +
                            static_cast<uint16_t>(third[i])
                        );

                    input[i] =
                        static_cast<int16_t>(value);
                }
            }


          private:

            alignas(64)
            std::array<
                std::array<int16_t, OUTPUT_SIZE>,
                INPUT_SIZE
            > weights_;

            alignas(64)
            std::array<int16_t, OUTPUT_SIZE> biases_;
          };


          // ==========================================================
          // FIRST LINEAR LAYER
          // ==========================================================

          template <size_t INPUT_SIZE, size_t OUTPUT_SIZE>
          struct LinearLayer {

            void Initialize(ModelReader& reader) {

                for (
                    size_t i = 0;
                    i < INPUT_SIZE;
                    i++
                ) {

                    for (
                        size_t j = 0;
                        j < OUTPUT_SIZE;
                        j++
                    ) {

                        weights_[
                            GetWeightIndex(
                                static_cast<int>(
                                    j * INPUT_SIZE + i
                                )
                            )
                        ] =
                            reader.ReadWeight<int8_t>(
                                WEIGHT_SCALE *
                                (1 << LINEAR_ADDITIONAL_PRECISION)
                            );
                    }
                }

                for (
                    size_t i = 0;
                    i < OUTPUT_SIZE;
                    i++
                ) {

                    biases_[i] =
                        reader.ReadWeight<int32_t>(
                            ACTIVATION_SCALE *
                            WEIGHT_SCALE *
                            (1 << LINEAR_ADDITIONAL_PRECISION)
                        );
                }
            }


            void Process(
                const int8_t* src,
                int32_t* dest
            ) {

                for (
                    size_t output = 0;
                    output < OUTPUT_SIZE;
                    output++
                ) {

                    /*
                     * ClippedReLU16 produces unsigned activation
                     * values in the range 0..127.
                     *
                     * The original AVX2 implementation uses
                     * _mm256_maddubs_epi16, which multiplies
                     * unsigned bytes by signed int8 weights.
                     *
                     * This scalar loop performs the same
                     * mathematical operation.
                     */

                    uint32_t sum =
                        static_cast<uint32_t>(
                            biases_[output]
                        );

                    for (
                        size_t input = 0;
                        input < INPUT_SIZE;
                        input++
                    ) {

                        const uint8_t activation =
                            static_cast<uint8_t>(
                                src[input]
                            );

                        if (activation == 0)
                            continue;

                        const int8_t weight =
                            weights_[
                                GetWeightIndex(
                                    static_cast<int>(
                                        output *
                                        INPUT_SIZE +
                                        input
                                    )
                                )
                            ];

                        const int64_t product =
                            static_cast<int64_t>(
                                activation
                            )
                            *
                            static_cast<int64_t>(
                                weight
                            );

                        sum +=
                            static_cast<uint32_t>(
                                product
                            );
                    }

                    dest[output] =
                        static_cast<int32_t>(
                            sum >>
                            LINEAR_ADDITIONAL_PRECISION
                        );
                }
            }


          private:

            static constexpr int GetWeightIndex(int idx) {

                return
                    (
                        (idx / 4)
                        %
                        (INPUT_SIZE / 4)
                        *
                        OUTPUT_SIZE *
                        4
                    )
                    +
                    (idx / INPUT_SIZE * 4)
                    +
                    (idx % 4);
            }


            alignas(64)
            std::array<
                int8_t,
                INPUT_SIZE * OUTPUT_SIZE
            > weights_;

            alignas(64)
            std::array<
                int32_t,
                OUTPUT_SIZE
            > biases_;
          };


          // ==========================================================
          // PRECISE LINEAR LAYER
          // ==========================================================

          template <size_t INPUT_SIZE, size_t OUTPUT_SIZE>
          struct PreciseLinearLayer {

            void Initialize(ModelReader& reader) {

                for (
                    size_t i = 0;
                    i < INPUT_SIZE;
                    i++
                ) {

                    for (
                        size_t j = 0;
                        j < OUTPUT_SIZE;
                        j++
                    ) {

                        weights_[
                            j * INPUT_SIZE + i
                        ] =
                            reader.ReadWeight<int16_t>(
                                WEIGHT_SCALE *
                                PRECISE_WEIGHT_SCALE
                            );
                    }
                }

                for (
                    size_t i = 0;
                    i < OUTPUT_SIZE;
                    i++
                ) {

                    biases_[i] =
                        reader.ReadWeight<int32_t>(
                            ACTIVATION_SCALE *
                            WEIGHT_SCALE *
                            WEIGHT_SCALE *
                            PRECISE_WEIGHT_SCALE
                        );
                }
            }


            void Process(
                const int16_t* input,
                int32_t* output
            ) {

                constexpr int SHIFT =
                    q_util::GetHighestBit(
                        static_cast<uint32_t>(
                            WEIGHT_SCALE *
                            PRECISE_WEIGHT_SCALE
                        )
                    );

                for (
                    size_t out = 0;
                    out < OUTPUT_SIZE;
                    out++
                ) {

                    int64_t sum =
                        biases_[out];

                    const size_t offset =
                        out * INPUT_SIZE;

                    for (
                        size_t i = 0;
                        i < INPUT_SIZE;
                        i++
                    ) {

                        sum +=
                            static_cast<int64_t>(
                                input[i]
                            )
                            *
                            static_cast<int64_t>(
                                weights_[offset + i]
                            );
                    }

                    output[out] =
                        static_cast<int32_t>(
                            sum >> SHIFT
                        );
                }
            }


          private:

            alignas(64)
            std::array<
                int16_t,
                INPUT_SIZE * OUTPUT_SIZE
            > weights_;

            alignas(64)
            std::array<
                int32_t,
                OUTPUT_SIZE
            > biases_;
          };


          // ==========================================================
          // OUTPUT LAYER
          // ==========================================================

          template <size_t INPUT_SIZE>
          struct OutputLayer {

            void Initialize(ModelReader& reader) {

                for (
                    size_t i = 0;
                    i < INPUT_SIZE;
                    i++
                ) {

                    weights_[i] =
                        reader.ReadWeight<int16_t>(
                            WEIGHT_SCALE *
                            OUTPUT_SCALE /
                            ACTIVATION_SCALE
                        );
                }

                bias_ =
                    reader.ReadWeight<int32_t>(
                        WEIGHT_SCALE *
                        OUTPUT_SCALE
                    );
            }


            int32_t Process(
                const int16_t* input
            ) {

                int64_t ans = bias_;

                for (
                    uint16_t i = 0;
                    i < INPUT_SIZE;
                    i++
                ) {

                    ans +=
                        static_cast<int64_t>(
                            input[i]
                        )
                        *
                        static_cast<int64_t>(
                            weights_[i]
                        );
                }

                return static_cast<int32_t>(ans);
            }


          private:

            alignas(64)
            std::array<
                int16_t,
                INPUT_SIZE
            > weights_;

            int32_t bias_;
          };


          // ==========================================================
          // CLIPPED RELU 16 -> INT8
          // ==========================================================

          inline void ClippedReLU16(
              int size,
              int8_t* output,
              const int16_t* input
          ) {

              for (
                  int i = 0;
                  i < size;
                  i++
              ) {

                  int value =
                      static_cast<int>(
                          input[i]
                      )
                      >>
                      FEATURE_ADDITIONAL_PRECISION;

                  if (value < 0)
                      value = 0;

                  if (value > 127)
                      value = 127;

                  output[i] =
                      static_cast<int8_t>(
                          value
                      );
              }
          }


          // ==========================================================
          // CLIPPED RELU 32 -> INT16
          // ==========================================================

          inline void ClippedReLU32(
              int size,
              int16_t* output,
              const int32_t* input
          ) {

              constexpr int upper =
                  32768 *
                  WEIGHT_SCALE /
                  256
                  -
                  1;

              for (
                  int i = 0;
                  i < size;
                  i++
              ) {

                  int32_t value =
                      input[i];

                  if (value < 0)
                      value = 0;

                  if (value > upper)
                      value = upper;

                  output[i] =
                      static_cast<int16_t>(
                          value
                      );
              }
          }

          }  // namespace q_eval

          #endif  // QUIRKY_SRC_EVAL_LAYERS_H
          EOF

          echo "ARM-safe layers.h installed."


      # ============================================================
      # VERIFY LAYERS
      # ============================================================
      - name: Verify layers
        shell: bash
        run: |
          set -e

          if grep -nE \
            '#include <immintrin.h>|__m256|__m128|_mm256_|_mm_' \
            src/eval/layers.h ; then

            echo "ERROR: x86 intrinsics remain in layers.h"
            exit 1
          fi

          echo "OK: no x86 intrinsics in layers.h."


      # ============================================================
      # PATCH SEARCH THREADING
      #
      # Original source has:
      #
      #   std::thread -> StartMainThread()
      #
      # and inside:
      #
      #   Searcher searcher(...)
      #   std::thread -> searcher.Run(...)
      #
      # The Android crash showed a pthread stack overflow.
      #
      # We therefore:
      #
      #   Launcher thread = 16 MB
      #   Search thread  = 32 MB
      #
      # and put Searcher on the heap.
      # ============================================================
      - name: Patch pthread search threads
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          header = Path(
              "src/search/searcher/launcher.h"
          )

          source = Path(
              "src/search/searcher/launcher.cpp"
          )

          h = header.read_text()
          c = source.read_text()


          # ========================================================
          # HEADER
          # ========================================================

          old_header = """#include <thread>"""

          if old_header not in h:
              raise SystemExit(
                  "ERROR: launcher.h does not contain <thread>"
              )

          h = h.replace(
              old_header,
              "#include <pthread.h>",
              1
          )


          old_member = """    std::thread thread_;"""

          new_member = """    pthread_t thread_{};
              bool thread_joinable_ = false;
              static void* LauncherThreadEntry(void* raw);"""

          if old_member not in h:
              raise SystemExit(
                  "ERROR: std::thread member not found"
              )

          h = h.replace(
              old_member,
              new_member,
              1
          )

          header.write_text(h)


          # ========================================================
          # CPP INCLUDES
          # ========================================================

          include_marker = """#include "launcher.h"

          #include <string>"""

          if include_marker not in c:
              raise SystemExit(
                  "ERROR: launcher.cpp include block not found"
              )

          c = c.replace(
              include_marker,
              """#include "launcher.h"

          #include <memory>
          #include <pthread.h>
          #include <string>""",
              1
          )


          # ========================================================
          # HELPER CODE
          # ========================================================

          namespace_marker = """namespace q_search {

          uint8_t GetRTByteSizeLog"""

          if namespace_marker not in c:
              raise SystemExit(
                  "ERROR: namespace marker not found"
              )

          helper = """namespace q_search {

          namespace {

          constexpr size_t LAUNCHER_STACK_SIZE =
              16 * 1024 * 1024;

          constexpr size_t SEARCH_STACK_SIZE =
              32 * 1024 * 1024;


          struct LauncherThreadArgs {
              SearchLauncher* self;
              q_core::Board board;
              std::vector<q_core::Move> moves;
              time_control_t time_control;
              depth_t max_depth;
          };


          struct SearchThreadArgs {
              Searcher* searcher;
              depth_t max_depth;
              size_t pv_count;
          };


          void* SearchThreadEntry(void* raw) {

              auto* args =
                  static_cast<SearchThreadArgs*>(raw);

              args->searcher->Run(
                  args->max_depth,
                  args->pv_count
              );

              delete args;

              return nullptr;
          }


          bool CreateThreadWithStack(
              pthread_t* thread,
              size_t stack_size,
              void* (*entry)(void*),
              void* arg
          ) {

              pthread_attr_t attr;

              if (pthread_attr_init(&attr) != 0)
                  return false;

              if (
                  pthread_attr_setstacksize(
                      &attr,
                      stack_size
                  ) != 0
              ) {
                  pthread_attr_destroy(&attr);
                  return false;
              }

              int result =
                  pthread_create(
                      thread,
                      &attr,
                      entry,
                      arg
                  );

              pthread_attr_destroy(&attr);

              return result == 0;
          }

          }  // namespace


          uint8_t GetRTByteSizeLog"""

          c = c.replace(
              namespace_marker,
              helper,
              1
          )


          # ========================================================
          # SEARCHLAUNCHER::START
          # ========================================================

          old_start = """void SearchLauncher::Start(const q_core::Board& board, const std::vector<q_core::Move>& moves,
                                             time_control_t time_control, depth_t max_depth) {
              Join();
              control_.Reset();
              tt_.NextPosition();
              thread_ = std::thread([this, board, moves, time_control, max_depth]() {
                  StartMainThread(board, moves, time_control, max_depth);
              });
          }"""

          new_start = """void SearchLauncher::Start(const q_core::Board& board, const std::vector<q_core::Move>& moves,
                                             time_control_t time_control, depth_t max_depth) {
              Join();
              control_.Reset();
              tt_.NextPosition();

              auto* args =
                  new LauncherThreadArgs{
                      this,
                      board,
                      moves,
                      time_control,
                      max_depth
                  };

              if (!CreateThreadWithStack(
                      &thread_,
                      LAUNCHER_STACK_SIZE,
                      &SearchLauncher::LauncherThreadEntry,
                      args)) {

                  delete args;
                  thread_joinable_ = false;
                  q_util::PrintError(
                      "Failed to create launcher pthread"
                  );
                  return;
              }

              thread_joinable_ = true;
          }"""

          if old_start not in c:
              raise SystemExit(
                  "ERROR: original SearchLauncher::Start block not found"
              )

          c = c.replace(
              old_start,
              new_start,
              1
          )


          # ========================================================
          # LAUNCHER THREAD ENTRY
          # ========================================================

          entry_marker = """uint64_t GetNPS"""

          launcher_entry = """void* SearchLauncher::LauncherThreadEntry(void* raw) {

              auto* args =
                  static_cast<LauncherThreadArgs*>(raw);

              args->self->StartMainThread(
                  args->board,
                  args->moves,
                  args->time_control,
                  args->max_depth
              );

              delete args;

              return nullptr;
          }


          uint64_t GetNPS"""

          if entry_marker not in c:
              raise SystemExit(
                  "ERROR: GetNPS marker not found"
              )

          c = c.replace(
              entry_marker,
              launcher_entry,
              1
          )


          # ========================================================
          # SEARCHER ON HEAP + PTHREAD
          # ========================================================

          old_search = """    SearchStat stat;
              Searcher searcher(tt_, rt, board, control_, stat);
              SearchTimer timer(time_control, board, stat);
              std::thread search_thread = std::thread([&]() { searcher.Run(max_depth, real_pv_count); });"""

          new_search = """    SearchStat stat;

              auto searcher =
                  std::make_unique<Searcher>(
                      tt_,
                      rt,
                      board,
                      control_,
                      stat
                  );

              SearchTimer timer(
                  time_control,
                  board,
                  stat
              );

              auto* search_args =
                  new SearchThreadArgs{
                      searcher.get(),
                      max_depth,
                      real_pv_count
                  };

              pthread_t search_thread{};

              if (!CreateThreadWithStack(
                      &search_thread,
                      SEARCH_STACK_SIZE,
                      SearchThreadEntry,
                      search_args)) {

                  delete search_args;
                  q_util::PrintError(
                      "Failed to create search pthread"
                  );
                  return;
              }"""

          if old_search not in c:
              raise SystemExit(
                  "ERROR: original search thread block not found"
              )

          c = c.replace(
              old_search,
              new_search,
              1
          )


          # ========================================================
          # SEARCH THREAD JOIN
          # ========================================================

          old_join = """    search_thread.join();"""

          new_join = """    pthread_join(
                  search_thread,
                  nullptr
              );"""

          if old_join not in c:
              raise SystemExit(
                  "ERROR: search_thread.join() not found"
              )

          c = c.replace(
              old_join,
              new_join,
              1
          )


          # ========================================================
          # LAUNCHER JOIN
          # ========================================================

          old_launcher_join = """void SearchLauncher::Join() {
              if (thread_.joinable()) {
                  control_.Stop();
                  thread_.join();
              }
          }"""

          new_launcher_join = """void SearchLauncher::Join() {
              if (thread_joinable_) {
                  control_.Stop();

                  pthread_join(
                      thread_,
                      nullptr
                  );

                  thread_joinable_ = false;
              }
          }"""

          if old_launcher_join not in c:
              raise SystemExit(
                  "ERROR: original Join() block not found"
              )

          c = c.replace(
              old_launcher_join,
              new_launcher_join,
              1
          )


          # ========================================================
          # FINAL CHECK
          # ========================================================

          if "std::thread" in c:
              raise SystemExit(
                  "ERROR: std::thread still remains in launcher.cpp"
              )

          source.write_text(c)

          print("pthread patch completed.")
          PY


      # ============================================================
      # VERIFY THREAD PATCH
      # ============================================================
      - name: Verify pthread patch
        shell: bash
        run: |
          set -e

          echo "===== STACK SIZES ====="

          grep -nE \
            "LAUNCHER_STACK_SIZE|SEARCH_STACK_SIZE" \
            src/search/searcher/launcher.cpp

          echo
          echo "===== PTHREAD ====="

          grep -nE \
            "pthread_create|pthread_join|pthread_attr_setstacksize" \
            src/search/searcher/launcher.cpp

          echo
          echo "===== std::thread ====="

          if grep -RIn \
            --include='launcher.cpp' \
            --include='launcher.h' \
            'std::thread' \
            src/search/searcher ; then

            echo "ERROR: std::thread remains."
            exit 1
          fi

          echo "OK: no std::thread remains."


      # ============================================================
      # CLEAN BUILD
      # ============================================================
      - name: Configure ARM64 build
        shell: bash
        run: |
          set -eux

          rm -rf build

          export CC="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"

          echo "CC=$CC"
          echo "CXX=$CXX"

          "$CC" --version
          "$CXX" --version

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_FLAGS="-O3 -fno-fast-math -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-O3 -fno-fast-math -fno-omit-frame-pointer -pthread -DNO_AVX2=1" \
            -DCMAKE_EXE_LINKER_FLAGS="-pthread" \
            -DNO_AVX2=ON


      # ============================================================
      # VERIFY GENERATED FLAGS
      # ============================================================
      - name: Verify generated Ninja flags
        shell: bash
        run: |
          set -e

          echo "===== GENERATED FLAGS ====="

          grep -n "FLAGS =" build/build.ninja | head -50 || true

          echo
          echo "===== X86 FLAG CHECK ====="

          if grep -nE \
            '(^|[[:space:]])-m(sse|ssse|avx|avx2|popcnt|bmi|bmi2|fma|f16c|abm|xop)([[:space:]]|$)' \
            build/build.ninja ; then

            echo "ERROR: x86 flags reached build.ninja"
            exit 1
          fi

          if grep -nE \
            '(^|[[:space:]])(2|3|4\.1|4\.2)([[:space:]]|$)' \
            build/build.ninja ; then

            echo "ERROR: standalone numeric fragments reached build.ninja"
            exit 1
          fi

          echo "OK: generated flags are clean."


      # ============================================================
      # BUILD
      # ============================================================
      - name: Build Quirky
        shell: bash
        run: |
          set -eux

          cmake --build build --parallel 2


      # ============================================================
      # FIND QUIRKY EXECUTABLE
      # ============================================================
      - name: Find Quirky executable
        shell: bash
        run: |
          set -e

          echo "===== EXECUTABLES ====="

          find build \
            -type f \
            -perm -111 \
            -print

          BIN="$(find build \
            -type f \
            -perm -111 \
            ! -name '*.so' \
            ! -name '*.a' \
            -name 'Quirky' \
            | head -n1)"

          if [ -z "$BIN" ]; then
            echo "ERROR: Quirky executable not found."
            exit 1
          fi

          echo "Found:"
          echo "$BIN"

          echo "BIN=$BIN" >> "$GITHUB_ENV"


      # ============================================================
      # VERIFY AARCH64
      # ============================================================
      - name: Verify ARM64 ELF
        shell: bash
        run: |
          set -e

          echo "===== FILE ====="

          file "$BIN"

          echo
          echo "===== ELF ====="

          readelf -h "$BIN" | grep -E \
            'Class:|Machine:|Type:'

          if ! readelf -h "$BIN" | grep -q "AArch64"; then
            echo "ERROR: binary is not AArch64."
            exit 1
          fi

          echo "OK: AArch64 binary."


      # ============================================================
      # PACKAGE
      # ============================================================
      - name: Package binary
        shell: bash
        run: |
          set -e

          mkdir -p artifact

          cp "$BIN" \
            artifact/Quirky-android-arm64

          chmod +x \
            artifact/Quirky-android-arm64

          ls -lh \
            artifact/Quirky-android-arm64


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: Quirky-android-arm64
          path: artifact/Quirky-android-arm64
          if-no-files-found: error
