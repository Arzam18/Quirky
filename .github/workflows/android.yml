          void* SearchThreadEntry(void* raw) {

              auto* args =
                  static_cast<SearchThreadArgs*>(raw);

              args->searcher->Run(
                  args->max_depth,
                  args->real_pv_count
              );

              delete args;

              return nullptr;
          }


          bool CreateThreadWithStack(
              pthread_t* thread,
              size_t stack_size,
              void* (*entry)(void*),
              void* arg
          ) {

              pthread_attr_t attr;

              if (pthread_attr_init(&attr) != 0)
                  return false;

              if (
                  pthread_attr_setstacksize(
                      &attr,
                      stack_size
                  ) != 0
              ) {

                  pthread_attr_destroy(&attr);
                  return false;
              }

              const int result =
                  pthread_create(
                      thread,
                      &attr,
                      entry,
                      arg
                  );

              pthread_attr_destroy(&attr);

              return result == 0;
          }

