name: Quirky Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android NDK
        shell: bash
        run: |
          set -e

          if [ -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          else
            NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          fi

          if [ -z "$NDK" ]; then
            echo "ERROR: Android NDK not found."
            exit 1
          fi

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

          echo "Using NDK: $NDK"

      - name: Configure compiler
        shell: bash
        run: |
          set -e

          LLVM="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$LLVM/aarch64-linux-android24-clang"
          test -x "$LLVM/aarch64-linux-android24-clang++"

          echo "CC=$LLVM/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX=$LLVM/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"

      - name: Remove x86 flags
        shell: bash
        run: |
          set -e

          python3 -c '
          from pathlib import Path

          bad = [
              "-msse",
              "-msse2",
              "-msse3",
              "-mssse3",
              "-msse4.1",
              "-msse4.2",
              "-mpopcnt",
              "-mavx",
              "-mavx2",
              "-mbmi",
              "-mbmi2",
          ]

          for p in Path(".").rglob("*"):
              if p.is_file() and p.name in {"CMakeLists.txt", "Makefile", "makefile"}:
                  try:
                      s = p.read_text()
                      old = s
                      for flag in bad:
                          s = s.replace(flag, "")
                      if s != old:
                          p.write_text(s)
                          print("Patched:", p)
                  except Exception:
                      pass
          '

      # ============================================================
      # launcher.h
      # ============================================================

      - name: Patch launcher.h
        shell: bash
        run: |
          set -e

          FILE="src/search/searcher/launcher.h"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          if "#include <pthread.h>" not in s:
              s = s.replace(
                  "#include <thread>",
                  "#include <pthread.h>\n#include <thread>",
                  1
              )

          if "static void* ThreadEntry(void* arg);" not in s:
              pos = s.find("private:")
              if pos == -1:
                  raise SystemExit("ERROR: private: section not found.")

              s = s[:pos] + \
                  "    static void* ThreadEntry(void* arg);\n\n" + \
                  s[pos:]

          if "std::thread thread_;" not in s:
              raise SystemExit(
                  "ERROR: std::thread thread_ not found."
              )

          s = s.replace(
              "std::thread thread_;",
              "pthread_t thread_{};\n    bool thread_joinable_ = false;",
              1
          )

          p.write_text(s)

          print("launcher.h patched.")
          PY

      # ============================================================
      # launcher.cpp
      # ============================================================

      - name: Patch launcher.cpp
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/search/searcher/launcher.cpp")
          s = p.read_text()

          # --------------------------------------------------------
          # Includes
          # --------------------------------------------------------

          if "#include <memory>" not in s:
              marker = '#include "launcher.h"'
              s = s.replace(
                  marker,
                  marker + "\n\n#include <memory>\n#include <pthread.h>",
                  1
              )

          # --------------------------------------------------------
          # Thread stack helper
          # --------------------------------------------------------

          helper = (
              "namespace {\n"
              "\n"
              "constexpr size_t LAUNCHER_STACK_SIZE = 16 * 1024 * 1024;\n"
              "constexpr size_t SEARCH_STACK_SIZE = 32 * 1024 * 1024;\n"
              "\n"
              "int CreateThreadWithStack(\n"
              "    pthread_t* thread,\n"
              "    size_t stack_size,\n"
              "    void* (*entry)(void*),\n"
              "    void* argument) {\n"
              "\n"
              "    pthread_attr_t attr{};\n"
              "\n"
              "    int result = pthread_attr_init(&attr);\n"
              "    if (result != 0)\n"
              "        return result;\n"
              "\n"
              "    result = pthread_attr_setstacksize(&attr, stack_size);\n"
              "\n"
              "    if (result == 0) {\n"
              "        result = pthread_create(\n"
              "            thread,\n"
              "            &attr,\n"
              "            entry,\n"
              "            argument\n"
              "        );\n"
              "    }\n"
              "\n"
              "    pthread_attr_destroy(&attr);\n"
              "    return result;\n"
              "}\n"
              "\n"
              "} // namespace\n"
              "\n"
          )

          if "LAUNCHER_STACK_SIZE" not in s:
              marker = "namespace q_search {\n"
              if marker not in s:
                  raise SystemExit(
                      "ERROR: namespace q_search not found."
                  )

              s = s.replace(
                  marker,
                  marker + "\n" + helper,
                  1
              )

          # --------------------------------------------------------
          # Launcher thread argument structure
          # --------------------------------------------------------

          args_struct = (
              "namespace {\n"
              "\n"
              "struct LauncherThreadArgs {\n"
              "    SearchLauncher* launcher;\n"
              "    q_core::Board board;\n"
              "    std::vector<q_core::Move> moves;\n"
              "    time_control_t time_control;\n"
              "    depth_t max_depth;\n"
              "};\n"
              "\n"
              "}\n"
              "\n"
          )

          if "struct LauncherThreadArgs" not in s:
              marker = "void SearchLauncher::Start("
              pos = s.find(marker)

              if pos == -1:
                  raise SystemExit(
                      "ERROR: SearchLauncher::Start not found."
                  )

              s = s[:pos] + args_struct + s[pos:]

          # --------------------------------------------------------
          # ThreadEntry
          # --------------------------------------------------------

          if "SearchLauncher::ThreadEntry(void* raw)" not in s:
              marker = "void SearchLauncher::Start("
              pos = s.find(marker)

              if pos == -1:
                  raise SystemExit(
                      "ERROR: SearchLauncher::Start not found."
                  )

              entry = (
                  "void* SearchLauncher::ThreadEntry(void* raw) {\n"
                  "    auto* args = static_cast<LauncherThreadArgs*>(raw);\n"
                  "\n"
                  "    args->launcher->StartMainThread(\n"
                  "        args->board,\n"
                  "        args->moves,\n"
                  "        args->time_control,\n"
                  "        args->max_depth\n"
                  "    );\n"
                  "\n"
                  "    delete args;\n"
                  "    return nullptr;\n"
                  "}\n"
                  "\n"
              )

              s = s[:pos] + entry + s[pos:]

          # --------------------------------------------------------
          # Replace ONLY the std::thread creation inside Start().
          # --------------------------------------------------------

          old = "thread_ = std::thread([this, board, moves, time_control, max_depth]() {"

          if old in s:
              start = s.find("void SearchLauncher::Start(")
              end = s.find("}", start)

              block = s[start:end + 1]

              new_thread = (
                  "auto* args = new LauncherThreadArgs{\n"
                  "    this,\n"
                  "    board,\n"
                  "    moves,\n"
                  "    time_control,\n"
                  "    max_depth\n"
                  "};\n"
                  "\n"
                  "const int result = CreateThreadWithStack(\n"
                  "    &thread_,\n"
                  "    LAUNCHER_STACK_SIZE,\n"
                  "    &SearchLauncher::ThreadEntry,\n"
                  "    args\n"
                  ");\n"
                  "\n"
                  "if (result != 0) {\n"
                  "    delete args;\n"
                  "    thread_joinable_ = false;\n"
                  "    q_util::PrintError(\"Failed to create Quirky launcher thread\");\n"
                  "    return;\n"
                  "}\n"
                  "\n"
                  "thread_joinable_ = true;"
              )

              block = block.replace(
                  old + "\n"
                  "        StartMainThread(board, moves, time_control, max_depth);\n"
                  "    });",
                  new_thread
              )

              s = s[:start] + block + s[end + 1:]

          elif "thread_joinable_ = true;" not in s:
              raise SystemExit(
                  "ERROR: original launcher thread creation was not found."
              )

          # --------------------------------------------------------
          # Move Searcher to heap.
          # --------------------------------------------------------

          old = "Searcher searcher(tt_, rt, board, control_, stat);"

          if old in s:
              s = s.replace(
                  old,
                  (
                      "auto searcher = std::make_unique<Searcher>("
                      "tt_, rt, board, control_, stat);"
                  ),
                  1
              )

          # --------------------------------------------------------
          # Replace searcher.Run(...) with pointer access.
          # --------------------------------------------------------

          s = s.replace(
              "searcher.Run(max_depth, real_pv_count);",
              "searcher->Run(max_depth, real_pv_count);"
          )

          # --------------------------------------------------------
          # Inner search thread.
          # --------------------------------------------------------

          old = "std::thread search_thread = std::thread([&]() {"

          if old in s:
              start = s.find(old)

              end = s.find("});", start)

              if end == -1:
                  raise SystemExit(
                      "ERROR: search thread closing block not found."
                  )

              old_block = s[start:end + 3]

              new_block = (
                  "struct SearchThreadArgs {\n"
                  "    Searcher* searcher;\n"
                  "    depth_t max_depth;\n"
                  "    size_t pv_count;\n"
                  "};\n"
                  "\n"
                  "auto* search_args = new SearchThreadArgs{\n"
                  "    searcher.get(),\n"
                  "    max_depth,\n"
                  "    real_pv_count\n"
                  "};\n"
                  "\n"
                  "pthread_t search_thread{};\n"
                  "\n"
                  "const int search_result = CreateThreadWithStack(\n"
                  "    &search_thread,\n"
                  "    SEARCH_STACK_SIZE,\n"
                  "    [](void* raw) -> void* {\n"
                  "        auto* args = static_cast<SearchThreadArgs*>(raw);\n"
                  "        args->searcher->Run(args->max_depth, args->pv_count);\n"
                  "        delete args;\n"
                  "        return nullptr;\n"
                  "    },\n"
                  "    search_args\n"
                  ");\n"
                  "\n"
                  "if (search_result != 0) {\n"
                  "    delete search_args;\n"
                  "    q_util::PrintError(\"Failed to create Quirky search thread\");\n"
                  "    return;\n"
                  "}"
              )

              s = s[:start] + new_block + s[end + 3:]

          # --------------------------------------------------------
          # Join search thread.
          # --------------------------------------------------------

          s = s.replace(
              "search_thread.join();",
              "pthread_join(search_thread, nullptr);"
          )

          # --------------------------------------------------------
          # Launcher Join().
          # --------------------------------------------------------

          s = s.replace(
              "if (thread_.joinable()) {",
              "if (thread_joinable_) {"
          )

          s = s.replace(
              "thread_.join();",
              "pthread_join(thread_, nullptr);\n        thread_joinable_ = false;"
          )

          p.write_text(s)

          print("launcher.cpp patched.")
          PY

      # ============================================================
      # Verify
      # ============================================================

      - name: Verify patches
        shell: bash
        run: |
          set -e

          echo "=== Stack sizes ==="
          grep -n "STACK_SIZE" src/search/searcher/launcher.cpp

          echo
          echo "=== pthread ==="
          grep -n "pthread_create\|pthread_join" src/search/searcher/launcher.cpp

          echo
          echo "=== heap Searcher ==="
          grep -n "make_unique<Searcher>" src/search/searcher/launcher.cpp

          echo
          echo "=== thread entry ==="
          grep -n "ThreadEntry" src/search/searcher/launcher.cpp

          echo
          echo "=== std::thread remaining ==="

          if grep -n "std::thread" src/search/searcher/launcher.cpp; then
            echo "ERROR: std::thread remains."
            exit 1
          fi

      # ============================================================
      # Configure
      # ============================================================

      - name: Configure CMake
        shell: bash
        run: |
          set -e

          rm -rf build

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=24 \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK" \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_FLAGS="-O3 -fno-fast-math -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-pthread" \
            -DNO_AVX2=ON

      # ============================================================
      # Build
      # ============================================================

      - name: Build Quirky
        shell: bash
        run: |
          set -e

          cmake --build build \
            --parallel 2 \
            --verbose

      # ============================================================
      # Package
      # ============================================================

      - name: Package
        shell: bash
        run: |
          set -e

          BINARY="$(find build -type f -perm -111 | head -n 1)"

          if [ -z "$BINARY" ]; then
            echo "ERROR: executable not found."
            exit 1
          fi

          echo "Binary: $BINARY"

          cp "$BINARY" Quirky-android-arm64
          chmod +x Quirky-android-arm64

          file Quirky-android-arm64

          readelf -h Quirky-android-arm64 | \
            grep -E "Class:|Machine:|Type:"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Quirky-Android-ARM64
          path: Quirky-android-arm64
