name: Quirky Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ============================================================
      # 2. Locate Android NDK already installed on GitHub runner
      # ============================================================
      - name: Locate Android NDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          NDK=""

          if [ -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          elif [ -d "$ANDROID_SDK_ROOT/ndk/27.2.12479018" ]; then
            NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          else
            for d in \
              "$ANDROID_HOME/ndk/"* \
              "$ANDROID_SDK_ROOT/ndk/"*; do
              if [ -x "$d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" ]; then
                NDK="$d"
                break
              fi
            done
          fi

          if [ -z "$NDK" ]; then
            echo "ERROR: Android NDK not found."
            exit 1
          fi

          echo "Using NDK:"
          echo "$NDK"

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      # ============================================================
      # 3. Locate ARM64 Android compiler
      # ============================================================
      - name: Configure ARM64 compiler
        shell: bash
        run: |
          set -e

          CLANG="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          CLANGXX="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"

          test -x "$CLANG"
          test -x "$CLANGXX"

          echo "CC=$CLANG" >> "$GITHUB_ENV"
          echo "CXX=$CLANGXX" >> "$GITHUB_ENV"

          echo "CC=$CLANG"
          echo "CXX=$CLANGXX"

      # ============================================================
      # 4. Remove the original x86 compiler flags
      # ============================================================
      - name: Remove x86 compiler flags
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("CMakeLists.txt")
          s = p.read_text()

          bad_flags = [
              "-msse",
              "-msse2",
              "-msse3",
              "-mssse3",
              "-msse4.1",
              "-msse4.2",
              "-mpopcnt",
              "-mavx",
              "-mavx2",
              "-mbmi",
              "-mbmi2",
          ]

          for flag in bad_flags:
              s = s.replace(flag, "")

          p.write_text(s)

          print("Updated CMakeLists.txt")
          print(p.read_text())
          PY

      # ============================================================
      # 5. Patch launcher.h
      #
      # Original:
      #     std::thread thread_;
      #
      # Android pthread stack is too small for Quirky's search
      # structures/recursion. Use explicit pthread stacks.
      # ============================================================
      - name: Patch launcher.h for Android pthread stacks
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("src/search/searcher/launcher.h")
          s = p.read_text()

          s = s.replace(
              '#include <thread>',
              '#include <pthread.h>\n#include <thread>'
          )

          s = s.replace(
              'class SearchLauncher {',
              '''class SearchLauncher {
            struct ThreadArgs {
                SearchLauncher* launcher;
                q_core::Board board;
                std::vector<q_core::Move> moves;
                time_control_t time_control;
                depth_t max_depth;
            };

            static void* ThreadEntry(void* arg);'''
          )

          s = s.replace(
              'std::thread thread_;',
              '''pthread_t thread_{};
            bool thread_joinable_ = false;'''
          )

          p.write_text(s)

          print("Patched launcher.h")
          print(p.read_text())
          PY

      # ============================================================
      # 6. Patch launcher.cpp
      #
      # Launcher thread = 16 MB
      # Search thread   = 32 MB
      #
      # Searcher is also heap allocated.
      # ============================================================
      - name: Patch launcher.cpp for large Android stacks
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("src/search/searcher/launcher.cpp")
          s = p.read_text()

          # --------------------------------------------------------
          # Add pthread-related constants/helper
          # --------------------------------------------------------
          marker = '''namespace q_search {

          uint8_t GetRTByteSizeLog'''
          
          replacement = '''namespace q_search {

          namespace {

          constexpr size_t LAUNCHER_STACK_SIZE = 16 * 1024 * 1024;
          constexpr size_t SEARCH_STACK_SIZE = 32 * 1024 * 1024;

          int CreateThreadWithStack(pthread_t* thread,
                                    size_t stack_size,
                                    void* (*entry)(void*),
                                    void* arg) {
              pthread_attr_t attr;

              if (pthread_attr_init(&attr) != 0) {
                  return -1;
              }

              int result = pthread_attr_setstacksize(&attr, stack_size);

              if (result == 0) {
                  result = pthread_create(thread, &attr, entry, arg);
              }

              pthread_attr_destroy(&attr);
              return result;
          }

          }  // namespace

          uint8_t GetRTByteSizeLog'''

          if marker not in s:
              raise SystemExit("ERROR: namespace marker not found")

          s = s.replace(marker, replacement, 1)

          # --------------------------------------------------------
          # Replace SearchLauncher::Start
          # --------------------------------------------------------
          start_old = '''void SearchLauncher::Start(const q_core::Board& board, const std::vector<q_core::Move>& moves,
                           time_control_t time_control, depth_t max_depth) {
              Join();
              control_.Reset();
              tt_.NextPosition();
              thread_ = std::thread([this, board, moves, time_control, max_depth]() {
                  StartMainThread(board, moves, time_control, max_depth);
              });
          }'''

          start_new = '''void SearchLauncher::Start(const q_core::Board& board, const std::vector<q_core::Move>& moves,
                           time_control_t time_control, depth_t max_depth) {
              Join();
              control_.Reset();
              tt_.NextPosition();

              auto* args = new ThreadArgs{
                  this,
                  board,
                  moves,
                  time_control,
                  max_depth
              };

              const int result = CreateThreadWithStack(
                  &thread_,
                  LAUNCHER_STACK_SIZE,
                  &SearchLauncher::ThreadEntry,
                  args
              );

              if (result != 0) {
                  delete args;
                  thread_joinable_ = false;
                  q_util::PrintError(
                      "Failed to create launcher thread with large stack"
                  );
                  return;
              }

              thread_joinable_ = true;
          }

          void* SearchLauncher::ThreadEntry(void* raw_arg) {
              std::unique_ptr<ThreadArgs> args(
                  static_cast<ThreadArgs*>(raw_arg)
              );

              args->launcher->StartMainThread(
                  args->board,
                  args->moves,
                  args->time_control,
                  args->max_depth
              );

              return nullptr;
          }'''

          if start_old not in s:
              raise SystemExit("ERROR: original SearchLauncher::Start not found")

          s = s.replace(start_old, start_new, 1)

          # --------------------------------------------------------
          # Replace Searcher stack allocation with heap allocation
          # --------------------------------------------------------
          old_searcher = '''    SearchStat stat;
              Searcher searcher(tt_, rt, board, control_, stat);
              SearchTimer timer(time_control, board, stat);
              std::thread search_thread = std::thread([&]() { searcher.Run(max_depth, real_pv_count); });'''

          new_searcher = '''    SearchStat stat;
              auto searcher = std::make_unique<Searcher>(
                  tt_, rt, board, control_, stat
              );

              SearchTimer timer(time_control, board, stat);

              struct SearchThreadArgs {
                  Searcher* searcher;
                  depth_t max_depth;
                  size_t pv_count;
              };

              auto* search_args = new SearchThreadArgs{
                  searcher.get(),
                  max_depth,
                  real_pv_count
              };

              pthread_t search_thread{};
              const int search_thread_result = CreateThreadWithStack(
                  &search_thread,
                  SEARCH_STACK_SIZE,
                  [](void* raw) -> void* {
                      std::unique_ptr<SearchThreadArgs> args(
                          static_cast<SearchThreadArgs*>(raw)
                      );

                      args->searcher->Run(
                          args->max_depth,
                          args->pv_count
                      );

                      return nullptr;
                  },
                  search_args
              );

              if (search_thread_result != 0) {
                  delete search_args;
                  q_util::PrintError(
                      "Failed to create search thread with large stack"
                  );
                  return;
              }'''

          if old_searcher not in s:
              raise SystemExit(
                  "ERROR: Searcher block not found. "
                  "The source may already have been modified."
              )

          s = s.replace(old_searcher, new_searcher, 1)

          # --------------------------------------------------------
          # Replace final join
          # --------------------------------------------------------
          old_join = '''    search_thread.join();
          }'''

          new_join = '''    pthread_join(search_thread, nullptr);
          }'''

          if old_join not in s:
              raise SystemExit("ERROR: search thread join not found")

          s = s.replace(old_join, new_join, 1)

          # --------------------------------------------------------
          # Replace SearchLauncher::Join
          # --------------------------------------------------------
          old_launcher_join = '''void SearchLauncher::Join() {
              if (thread_.joinable()) {
                  control_.Stop();
                  thread_.join();
              }
          }'''

          new_launcher_join = '''void SearchLauncher::Join() {
              if (thread_joinable_) {
                  control_.Stop();
                  pthread_join(thread_, nullptr);
                  thread_joinable_ = false;
              }
          }'''

          if old_launcher_join not in s:
              raise SystemExit("ERROR: SearchLauncher::Join not found")

          s = s.replace(old_launcher_join, new_launcher_join, 1)

          p.write_text(s)

          print("Patched launcher.cpp")
          print(p.read_text())
          PY

      # ============================================================
      # 7. Verify pthread patches
      # ============================================================
      - name: Verify Android stack patches
        shell: bash
        run: |
          set -e

          echo "Checking launcher.h..."
          grep -n "pthread\|thread_joinable\|ThreadArgs" \
            src/search/searcher/launcher.h

          echo
          echo "Checking launcher.cpp..."
          grep -n "STACK_SIZE\|CreateThreadWithStack\|pthread_create\|pthread_join\|make_unique" \
            src/search/searcher/launcher.cpp

          echo
          echo "Checking no std::thread remains in launcher.cpp..."
          if grep -n "std::thread" src/search/searcher/launcher.cpp; then
            echo "ERROR: std::thread still present."
            exit 1
          fi

      # ============================================================
      # 8. Show source around patched search code
      # ============================================================
      - name: Show patched launcher
        shell: bash
        run: |
          sed -n '1,130p' src/search/searcher/launcher.cpp
          echo "----------------------------------------"
          sed -n '130,280p' src/search/searcher/launcher.cpp

      # ============================================================
      # 9. Configure CMake
      # ============================================================
      - name: Configure CMake
        shell: bash
        run: |
          set -e

          rm -rf build

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=24 \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK" \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_FLAGS="-O3 -fno-fast-math -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-pthread" \
            -DNO_AVX2=ON

      # ============================================================
      # 10. Build
      # ============================================================
      - name: Build Quirky
        shell: bash
        run: |
          set -e

          cmake --build build \
            --target Quirky \
            --parallel 2 \
            --verbose

      # ============================================================
      # 11. Locate binary
      # ============================================================
      - name: Locate binary
        shell: bash
        run: |
          set -e

          find build -type f -name "Quirky" -print

          BINARY="$(find build -type f -name "Quirky" -print -quit)"

          if [ -z "$BINARY" ]; then
            echo "ERROR: Quirky binary not found."
            exit 1
          fi

          cp "$BINARY" Quirky-android-arm64
          chmod +x Quirky-android-arm64

          echo "BINARY=$PWD/Quirky-android-arm64" >> "$GITHUB_ENV"

      # ============================================================
      # 12. Verify ELF architecture
      # ============================================================
      - name: Verify ARM64 ELF
        shell: bash
        run: |
          set -e

          file Quirky-android-arm64

          readelf -h Quirky-android-arm64 | grep -E \
            "Class:|Machine:|Type:"

          echo
          echo "Program stack segment:"
          readelf -l Quirky-android-arm64 | grep -A1 -E "GNU_STACK|STACK" || true

      # ============================================================
      # 13. Verify no x86 instructions/flags remain
      # ============================================================
      - name: Check binary strings
        shell: bash
        run: |
          set -e

          echo "Checking for obvious x86 compiler artifacts..."

          if strings Quirky-android-arm64 | grep -Ei \
            "avx2|avx|sse4|sse3|ssse3|popcnt"; then
            echo "WARNING: x86-related strings detected."
            echo "This does not necessarily mean x86 instructions exist."
          else
            echo "No obvious x86 strings found."
          fi

      # ============================================================
      # 14. Package
      # ============================================================
      - name: Package
        shell: bash
        run: |
          set -e

          mkdir -p package

          cp Quirky-android-arm64 package/

          chmod +x package/Quirky-android-arm64

          tar -czf Quirky-android-arm64.tar.gz \
            -C package \
            Quirky-android-arm64

      # ============================================================
      # 15. Upload artifact
      # ============================================================
      - name: Upload Android ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: Quirky-Android-ARM64
          path: Quirky-android-arm64

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: Quirky-Android-ARM64-tar
          path: Quirky-android-arm64.tar.gz
