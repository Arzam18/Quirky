name: Quirky Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # FIND ANDROID NDK
      # ============================================================
      - name: Find Android NDK
        shell: bash
        run: |
          set -e

          NDK="$(find "$ANDROID_SDK_ROOT/ndk" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | sort -V \
            | tail -n1)"

          if [ -z "$NDK" ]; then
            echo "ERROR: Android NDK not found"
            exit 1
          fi

          echo "Using NDK:"
          echo "$NDK"

          echo "NDK=$NDK" >> "$GITHUB_ENV"

          echo "TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            >> "$GITHUB_ENV"


      # ============================================================
      # REMOVE X86 FLAGS FROM CMAKE
      # ============================================================
      - name: Remove x86 compiler flags
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          bad_flags = [
              "-msse4.2",
              "-msse4.1",
              "-mssse3",
              "-msse3",
              "-msse2",
              "-msse",
              "-mpopcnt",
              "-mbmi2",
              "-mbmi",
              "-mavx2",
              "-mavx",
              "-mfma",
              "-mf16c",
              "-mabm",
              "-mxop",
          ]

          for path in Path(".").rglob("*"):

              if not path.is_file():
                  continue

              if path.name != "CMakeLists.txt" and path.suffix != ".cmake":
                  continue

              try:
                  text = path.read_text()
              except Exception:
                  continue

              original = text

              # Remove complete compiler flag tokens.
              # Longest first prevents -msse from matching
              # the beginning of -msse2, -msse3, etc.
              for flag in sorted(bad_flags, key=len, reverse=True):
                  text = re.sub(
                      rf"(?<![A-Za-z0-9_]){re.escape(flag)}(?![A-Za-z0-9_.-])",
                      "",
                      text
                  )

              # Remove numeric fragments accidentally produced by
              # earlier broken flag replacements.
              lines = []

              for line in text.splitlines():

                  if (
                      "CMAKE_CXX_FLAGS" in line
                      or "CMAKE_C_FLAGS" in line
                  ):
                      line = re.sub(
                          r"(?<![A-Za-z0-9_.-])"
                          r"(?:2|3|4\.1|4\.2)"
                          r"(?![A-Za-z0-9_.-])",
                          "",
                          line
                      )

                  lines.append(line)

              text = "\n".join(lines)

              if original.endswith("\n"):
                  text += "\n"

              if text != original:
                  path.write_text(text)
                  print("PATCHED:", path)

          PY


      # ============================================================
      # VERIFY CMAKE FLAGS
      # ============================================================
      - name: Verify CMake flags
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CMAKE FLAG LINES"
          echo "========================================"

          grep -RIn \
            --include='CMakeLists.txt' \
            --include='*.cmake' \
            'CMAKE_.*FLAGS' . || true

          echo
          echo "========================================"
          echo "X86 FLAG CHECK"
          echo "========================================"

          if grep -RInE \
            --include='CMakeLists.txt' \
            --include='*.cmake' \
            -- \
            '-m(sse|ssse|avx|avx2|popcnt|bmi|bmi2|fma|f16c|abm|xop)' \
            . ; then

            echo "ERROR: x86 compiler flags remain."
            exit 1
          fi

          echo "OK: no x86 compiler flags remain."


      # ============================================================
      # REPLACE THE AVX2 NNUE LAYERS
      #
      # The original Quirky layers.h directly uses:
      #
      #   <immintrin.h>
      #   __m256i
      #   _mm256_*
      #
      # Those are x86/AVX2 instructions.
      #
      # For the first Android build we use a scalar implementation
      # with the same layer interfaces and weight layout.
      #
      # This is a CORRECTNESS build first.
      # NEON optimization can be done after it works.
      # ============================================================
      - name: Replace AVX2 NNUE layers with ARM-safe implementation
        shell: bash
        run: |
          set -e

          cat > src/eval/layers.h <<'EOF'
          #ifndef QUIRKY_SRC_EVAL_LAYERS_H
          #define QUIRKY_SRC_EVAL_LAYERS_H

          #include <algorithm>
          #include <array>
          #include <cmath>
          #include <concepts>
          #include <cstddef>
          #include <cstdint>
          #include <limits>

          #include "core/board/types.h"
          #include "core/util.h"
          #include "model_weights.h"
          #include "util/bit.h"
          #include "util/io.h"

          namespace q_eval {

          static constexpr int WEIGHT_SCALE = 64;
          static constexpr int ACTIVATION_SCALE = 127;
          static constexpr int OUTPUT_SCALE = 64 * 64;
          static constexpr int PRECISE_WEIGHT_SCALE = 64;

          static constexpr uint8_t FEATURE_ADDITIONAL_PRECISION = 5;
          static constexpr uint8_t LINEAR_ADDITIONAL_PRECISION = 3;


          struct ModelReader {

            public:

              template <std::integral T>
              T ReadWeight(int scale) {

                  float weight = MODEL_WEIGHTS[index_++];

                  int64_t final_weight =
                      std::round(weight * scale);

                  if (
                      final_weight >
                          static_cast<int64_t>(
                              std::numeric_limits<T>::max())
                      ||
                      final_weight <
                          static_cast<int64_t>(
                              std::numeric_limits<T>::min())
                  ) {
                      q_util::ExitWithError(
                          "Model weights are out of range"
                      );
                  }

                  return static_cast<T>(final_weight);
              }

            private:

              size_t index_ = 0;
          };


          // ==========================================================
          // FEATURE LAYER
          // ==========================================================

          template <size_t INPUT_SIZE, size_t OUTPUT_SIZE>
          struct FeatureLayer {

            public:

              void Initialize(ModelReader& reader) {

                  for (size_t i = 0; i < INPUT_SIZE; i++) {

                      for (
                          size_t j = 0;
                          j < OUTPUT_SIZE / 2;
                          j++
                      ) {

                          weights_[i][j] =
                              reader.ReadWeight<int16_t>(
                                  ACTIVATION_SCALE *
                                  (1 << FEATURE_ADDITIONAL_PRECISION)
                              );

                          const q_core::cell_t cell =
                              i / q_core::BOARD_SIZE + 1;

                          const q_core::coord_t coord =
                              i % q_core::BOARD_SIZE;

                          size_t pos =
                              (
                                  static_cast<size_t>(
                                      q_core::FlipCellColor(cell)
                                  ) - 1
                              )
                              *
                              q_core::BOARD_SIZE
                              +
                              q_core::FlipCoord(coord);

                          weights_[pos]
                                  [j + OUTPUT_SIZE / 2] =
                              weights_[i][j];
                      }
                  }

                  for (
                      size_t i = 0;
                      i < OUTPUT_SIZE / 2;
                      i++
                  ) {

                      biases_[i] =
                          reader.ReadWeight<int16_t>(
                              ACTIVATION_SCALE *
                              (1 << FEATURE_ADDITIONAL_PRECISION)
                          );

                      biases_[i + OUTPUT_SIZE / 2] =
                          biases_[i];
                  }
              }


              void GetResultOnEmptyBoard(int16_t* output) {

                  std::copy(
                      biases_.begin(),
                      biases_.end(),
                      output
                  );
              }


              void Update(
                  int16_t* input,
                  size_t position,
                  int8_t delta
              ) {

                  const int16_t* weights =
                      weights_[position].data();

                  for (
                      size_t i = 0;
                      i < OUTPUT_SIZE;
                      i++
                  ) {

                      uint16_t value =
                          static_cast<uint16_t>(input[i]);

                      uint16_t weight =
                          static_cast<uint16_t>(weights[i]);

                      if (delta == -1) {

                          value =
                              static_cast<uint16_t>(
                                  value - weight
                              );

                      } else {

                          value =
                              static_cast<uint16_t>(
                                  value + weight
                              );
                      }

                      input[i] =
                          static_cast<int16_t>(value);
                  }
              }


              void Add(
                  int16_t* input,
                  size_t position
              ) {

                  const int16_t* weights =
                      weights_[position].data();

                  for (
                      size_t i = 0;
                      i < OUTPUT_SIZE;
                      i++
                  ) {

                      uint16_t value =
                          static_cast<uint16_t>(input[i]);

                      uint16_t weight =
                          static_cast<uint16_t>(weights[i]);

                      value =
                          static_cast<uint16_t>(
                              value + weight
                          );

                      input[i] =
                          static_cast<int16_t>(value);
                  }
              }


              void SubAdd(
                  int16_t* input,
                  size_t position_first,
                  size_t position_second
              ) {

                  const int16_t* first =
                      weights_[position_first].data();

                  const int16_t* second =
                      weights_[position_second].data();

                  for (
                      size_t i = 0;
                      i < OUTPUT_SIZE;
                      i++
                  ) {

                      uint16_t value =
                          static_cast<uint16_t>(input[i]);

                      value =
                          static_cast<uint16_t>(
                              value -
                              static_cast<uint16_t>(first[i])
                          );

                      value =
                          static_cast<uint16_t>(
                              value +
                              static_cast<uint16_t>(second[i])
                          );

                      input[i] =
                          static_cast<int16_t>(value);
                  }
              }


              void SubSubAdd(
                  int16_t* input,
                  size_t position_first,
                  size_t position_second,
                  size_t position_third
              ) {

                  const int16_t* first =
                      weights_[position_first].data();

                  const int16_t* second =
                      weights_[position_second].data();

                  const int16_t* third =
                      weights_[position_third].data();

                  for (
                      size_t i = 0;
                      i < OUTPUT_SIZE;
                      i++
                  ) {

                      uint16_t value =
                          static_cast<uint16_t>(input[i]);

                      value =
                          static_cast<uint16_t>(
                              value -
                              static_cast<uint16_t>(first[i])
                          );

                      value =
                          static_cast<uint16_t>(
                              value -
                              static_cast<uint16_t>(second[i])
                          );

                      value =
                          static_cast<uint16_t>(
                              value +
                              static_cast<uint16_t>(third[i])
                          );

                      input[i] =
                          static_cast<int16_t>(value);
                  }
              }


            private:

              alignas(64)
              std::array<
                  std::array<int16_t, OUTPUT_SIZE>,
                  INPUT_SIZE
              > weights_;

              alignas(64)
              std::array<int16_t, OUTPUT_SIZE> biases_;
          };


          // ==========================================================
          // FIRST LINEAR LAYER
          // ==========================================================

          template <size_t INPUT_SIZE, size_t OUTPUT_SIZE>
          struct LinearLayer {

            public:

              void Initialize(ModelReader& reader) {

                  for (
                      size_t i = 0;
                      i < INPUT_SIZE;
                      i++
                  ) {

                      for (
                          size_t j = 0;
                          j < OUTPUT_SIZE;
                          j++
                      ) {

                          weights_[
                              GetWeightIndex(
                                  static_cast<int>(
                                      j * INPUT_SIZE + i
                                  )
                          ] =
                              reader.ReadWeight<int8_t>(
                                  WEIGHT_SCALE *
                                  (1 << LINEAR_ADDITIONAL_PRECISION)
                              );
                      }
                  }

                  for (
                      size_t i = 0;
                      i < OUTPUT_SIZE;
                      i++
                  ) {

                      biases_[i] =
                          reader.ReadWeight<int32_t>(
                              ACTIVATION_SCALE *
                              WEIGHT_SCALE *
                              (1 << LINEAR_ADDITIONAL_PRECISION)
                          );
                  }
              }


              void Process(
                  const int8_t* src,
                  int32_t* dest
              ) {

                  /*
                   * The original AVX2 implementation uses
                   * unsigned activation bytes and signed weights.
                   *
                   * ClippedReLU16 guarantees src >= 0.
                   *
                   * We therefore reproduce the same scalar
                   * multiplication here.
                   */

                  for (
                      size_t output = 0;
                      output < OUTPUT_SIZE;
                      output++
                  ) {

                      int32_t accumulator =
                          biases_[output];

                      for (
                          size_t input = 0;
                          input < INPUT_SIZE;
                          input++
                      ) {

                          int8_t activation =
                              src[input];

                          if (activation <= 0)
                              continue;

                          const int8_t weight =
                              weights_[
                                  GetWeightIndex(
                                      static_cast<int>(
                                          output *
                                          INPUT_SIZE +
                                          input
                                      )
                                  )
                              ];

                          accumulator +=
                              static_cast<int32_t>(
                                  static_cast<uint8_t>(
                                      activation
                                  )
                              )
                              *
                              static_cast<int32_t>(
                                  weight
                              );
                      }

                      dest[output] =
                          accumulator >>
                          LINEAR_ADDITIONAL_PRECISION;
                  }
              }


            private:

              static constexpr int GetWeightIndex(
                  int idx
              ) {

                  return
                      (
                          (idx / 4)
                          %
                          (INPUT_SIZE / 4)
                          *
                          OUTPUT_SIZE *
                          4
                      )
                      +
                      (idx / INPUT_SIZE * 4)
                      +
                      (idx % 4);
              }


              alignas(64)
              std::array<
                  int8_t,
                  INPUT_SIZE * OUTPUT_SIZE
              > weights_;

              alignas(64)
              std::array<
                  int32_t,
                  OUTPUT_SIZE
              > biases_;
          };


          // ==========================================================
          // PRECISE LINEAR LAYER
          // ==========================================================

          template <size_t INPUT_SIZE, size_t OUTPUT_SIZE>
          struct PreciseLinearLayer {

            public:

              void Initialize(ModelReader& reader) {

                  for (
                      size_t i = 0;
                      i < INPUT_SIZE;
                      i++
                  ) {

                      for (
                          size_t j = 0;
                          j < OUTPUT_SIZE;
                          j++
                      ) {

                          weights_[
                              j * INPUT_SIZE + i
                          ] =
                              reader.ReadWeight<int16_t>(
                                  WEIGHT_SCALE *
                                  PRECISE_WEIGHT_SCALE
                              );
                      }
                  }

                  for (
                      size_t i = 0;
                      i < OUTPUT_SIZE;
                      i++
                  ) {

                      biases_[i] =
                          reader.ReadWeight<int32_t>(
                              ACTIVATION_SCALE *
                              WEIGHT_SCALE *
                              WEIGHT_SCALE *
                              PRECISE_WEIGHT_SCALE
                          );
                  }
              }


              void Process(
                  const int16_t* input,
                  int32_t* output
              ) {

                  constexpr int SHIFT = 12;

                  for (
                      size_t out = 0;
                      out < OUTPUT_SIZE;
                      out++
                  ) {

                      int32_t sum =
                          biases_[out];

                      const size_t offset =
                          out * INPUT_SIZE;

                      for (
                          size_t i = 0;
                          i < INPUT_SIZE;
                          i++
                      ) {

                          sum +=
                              static_cast<int32_t>(
                                  input[i]
                              )
                              *
                              static_cast<int32_t>(
                                  weights_[offset + i]
                              );
                      }

                      output[out] =
                          sum >> SHIFT;
                  }
              }


            private:

              alignas(64)
              std::array<
                  int16_t,
                  INPUT_SIZE * OUTPUT_SIZE
              > weights_;

              alignas(64)
              std::array<
                  int32_t,
                  OUTPUT_SIZE
              > biases_;
          };


          // ==========================================================
          // OUTPUT LAYER
          // ==========================================================

          template <size_t INPUT_SIZE>
          struct OutputLayer {

            public:

              void Initialize(ModelReader& reader) {

                  for (
                      size_t i = 0;
                      i < INPUT_SIZE;
                      i++
                  ) {

                      weights_[i] =
                          reader.ReadWeight<int16_t>(
                              WEIGHT_SCALE *
                              OUTPUT_SCALE /
                              ACTIVATION_SCALE
                          );
                  }

                  bias_ =
                      reader.ReadWeight<int32_t>(
                          WEIGHT_SCALE *
                          OUTPUT_SCALE
                      );
              }


              int32_t Process(
                  const int16_t* input
              ) {

                  int32_t ans = 0;

                  for (
                      uint16_t i = 0;
                      i < INPUT_SIZE;
                      i++
                  ) {

                      ans +=
                          static_cast<int32_t>(
                              input[i]
                          )
                          *
                          static_cast<int32_t>(
                              weights_[i]
                          );
                  }

                  ans += bias_;

                  return ans;
              }


            private:

              alignas(64)
              std::array<
                  int16_t,
                  INPUT_SIZE
              > weights_;

              int32_t bias_;
          };


          // ==========================================================
          // CLIPPED RELU 16 -> INT8
          // ==========================================================

          inline void ClippedReLU16(
              int size,
              int8_t* output,
              const int16_t* input
          ) {

              for (
                  int i = 0;
                  i < size;
                  i++
              ) {

                  int value =
                      static_cast<int>(
                          input[i]
                      )
                      >>
                      FEATURE_ADDITIONAL_PRECISION;

                  if (value < -128)
                      value = -128;

                  if (value > 127)
                      value = 127;

                  if (value < 0)
                      value = 0;

                  output[i] =
                      static_cast<int8_t>(
                          value
                      );
              }
          }


          // ==========================================================
          // CLIPPED RELU 32 -> INT16
          // ==========================================================

          inline void ClippedReLU32(
              int size,
              int16_t* output,
              const int32_t* input
          ) {

              constexpr int upper =
                  32768 *
                  WEIGHT_SCALE /
                  256
                  -
                  1;

              for (
                  int i = 0;
                  i < size;
                  i++
              ) {

                  int32_t value =
                      input[i];

                  if (value < 0)
                      value = 0;

                  if (value > upper)
                      value = upper;

                  output[i] =
                      static_cast<int16_t>(
                          value
                      );
              }
          }

          }  // namespace q_eval

          #endif  // QUIRKY_SRC_EVAL_LAYERS_H
          EOF

          echo "ARM-safe scalar layers.h installed."


      # ============================================================
      # ENABLE NO_AVX2
      # ============================================================
      - name: Configure ARM64 Android
        shell: bash
        run: |
          set -eux

          rm -rf build

          export CC="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"

          echo "CC=$CC"
          echo "CXX=$CXX"

          "$CC" --version
          "$CXX" --version

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_FLAGS="-O3 -fno-fast-math -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-O3 -fno-fast-math -fno-omit-frame-pointer -pthread -DNO_AVX2=1" \
            -DCMAKE_EXE_LINKER_FLAGS="-pthread" \
            -DNO_AVX2=ON


      # ============================================================
      # VERIFY GENERATED FLAGS
      # ============================================================
      - name: Verify generated build flags
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GENERATED NINJA FLAGS"
          echo "========================================"

          grep -n "FLAGS =" build/build.ninja | head -40 || true

          echo
          echo "========================================"
          echo "X86 FLAG CHECK"
          echo "========================================"

          if grep -nE \
            '(^|[[:space:]])-m(sse|ssse|avx|avx2|popcnt|bmi|bmi2|fma|f16c|abm|xop)([[:space:]]|$)' \
            build/build.ninja ; then

            echo "ERROR: x86 flags reached generated Ninja."
            exit 1
          fi

          if grep -nE \
            '(^|[[:space:]])(2|3|4\.1|4\.2)([[:space:]]|$)' \
            build/build.ninja ; then

            echo "ERROR: standalone numeric fragments reached Ninja."
            exit 1
          fi

          echo "OK: generated flags are clean."


      # ============================================================
      # VERIFY NO X86 INTRINSICS REMAIN IN THE NNUE LAYERS
      # ============================================================
      - name: Verify ARM-safe NNUE source
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "layers.h x86 intrinsic check"
          echo "========================================"

          if grep -nE \
            '#include <immintrin.h>|__m256|__m128|_mm256_|_mm_' \
            src/eval/layers.h ; then

            echo "ERROR: x86 intrinsics remain in layers.h."
            exit 1
          fi

          echo "OK: layers.h is ARM-safe."

          echo
          echo "========================================"
          echo "remaining intrinsic includes"
          echo "========================================"

          grep -RInE \
            '#include <(immintrin|xmmintrin|emmintrin|smmintrin|tmmintrin|wmmintrin|avxintrin|avx2intrin)' \
            src \
            --include='*.h' \
            --include='*.hpp' \
            --include='*.cpp' \
            || true


      # ============================================================
      # PATCH SEARCH THREADING
      #
      # Original Quirky:
      #
      #   SearchLauncher::Start()
      #       -> std::thread
      #
      #   StartMainThread()
      #       -> std::thread
      #           -> Searcher::Run()
      #
      # Android previously reported:
      #
      #   SIGSEGV
      #   SEGV_ACCERR
      #   Cause: stack pointer is not in a rw map;
      #          likely due to stack overflow.
      #
      # We give the two pthreads explicit large stacks.
      # ============================================================
      - name: Patch Quirky pthread stacks
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          h = Path("src/search/searcher/launcher.h")
          cpp = Path("src/search/searcher/launcher.cpp")

          if not h.exists():
              raise SystemExit("ERROR: launcher.h not found")

          if not cpp.exists():
              raise SystemExit("ERROR: launcher.cpp not found")

          hs = h.read_text()
          cs = cpp.read_text()


          # ========================================================
          # launcher.h
          # ========================================================

          hs = hs.replace(
              "#include <thread>",
              "#include <pthread.h>"
          )

          if "pthread_t thread_{};" not in hs:

              old = "    std::thread thread_;"

              if old not in hs:
                  raise SystemExit(
                      "ERROR: std::thread member not found in launcher.h"
                  )

              hs = hs.replace(
                  old,
                  "    pthread_t thread_{};\n"
                  "    bool thread_joinable_ = false;\n"
                  "    static void* LauncherThreadEntry(void* raw);",
                  1
              )

          elif "LauncherThreadEntry" not in hs:

              marker = "    bool thread_joinable_ = false;"

              hs = hs.replace(
                  marker,
                  marker +
                  "\n"
                  "    static void* LauncherThreadEntry(void* raw);",
                  1
              )

          h.write_text(hs)


          # ========================================================
          # launcher.cpp includes
          # ========================================================

          if "#include <pthread.h>" not in cs:

              marker = '#include "launcher.h"\n'

              if marker not in cs:
                  raise SystemExit(
                      "ERROR: launcher.cpp include marker not found"
                  )

              cs = cs.replace(
                  marker,
                  marker +
                  "\n"
                  "#include <pthread.h>\n"
                  "#include <memory>\n",
                  1
              )


          # ========================================================
          # Helper structures and pthread function
          # ========================================================

          if "LAUNCHER_STACK_SIZE" not in cs:

              marker = "namespace q_search {\n"

              if marker not in cs:
                  raise SystemExit(
                      "ERROR: q_search namespace not found"
                  )

              helper = """
          namespace {

          constexpr size_t LAUNCHER_STACK_SIZE =
              16 * 1024 * 1024;

          constexpr size_t SEARCH_STACK_SIZE =
              32 * 1024 * 1024;


          struct LauncherThreadArgs {
              SearchLauncher* self;
              q_core::Board board;
              std::vector<q_core::Move> moves;
              time_control_t time_control;
              depth_t max_depth;
          };


          struct SearchThreadArgs {
              Searcher* searcher;
              depth_t max_depth;
              size_t real_pv_count;
