name: Build Quirky for Android ARM64 NEON

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 file

      - name: Download Android NDK r27c
        shell: bash
        run: |
          set -Eeuo pipefail
          NDK_ARCHIVE="$RUNNER_TEMP/android-ndk-r27c-linux.zip"
          NDK_DIR="$RUNNER_TEMP/android-ndk-r27c"
          curl -fL --retry 3 --retry-delay 2 \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip \
            -o "$NDK_ARCHIVE"
          mkdir -p "$NDK_DIR"
          unzip -q "$NDK_ARCHIVE" -d "$NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR/android-ndk-r27c" >> "$GITHUB_ENV"
          test -x "$NDK_DIR/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"

      - name: Build and verify Android ARM64 NEON engine
        shell: bash
        run: bash ./scripts/build-android.sh

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quirky-Android-ARM64-NEON
          path: |
            dist/Quirky-Android-ARM64-NEON
            dist/Quirky-Android-ARM64-NEON.sha256
          if-no-files-found: error
          retention-days: 30
