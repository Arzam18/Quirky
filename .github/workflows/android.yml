name: Quirky Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android NDK
        shell: bash
        run: |
          set -e

          NDK="$(find "$ANDROID_SDK_ROOT/ndk" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | sort -V \
            | tail -n1)"

          if [ -z "$NDK" ]; then
            echo "ERROR: Android NDK not found"
            exit 1
          fi

          echo "NDK=$NDK"
          echo "NDK=$NDK" >> "$GITHUB_ENV"

          echo "TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            >> "$GITHUB_ENV"

      # ============================================================
      # Remove x86 compiler flags from ALL CMake files.
      # ============================================================
      - name: Remove x86 flags
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          bad_flags = [
              "-msse4.2",
              "-msse4.1",
              "-mssse3",
              "-msse3",
              "-msse2",
              "-msse",
              "-mpopcnt",
              "-mbmi2",
              "-mbmi",
              "-mavx2",
              "-mavx",
              "-mfma",
              "-mf16c",
              "-mabm",
              "-mxop",
          ]

          files = []

          for p in Path(".").rglob("*"):
              if not p.is_file():
                  continue

              if p.name == "CMakeLists.txt" or p.suffix == ".cmake":
                  files.append(p)

          for p in files:
              try:
                  text = p.read_text()
              except Exception:
                  continue

              original = text

              # Remove complete flags.
              for flag in sorted(bad_flags, key=len, reverse=True):
                  text = re.sub(
                      rf'(?<![A-Za-z0-9_]){re.escape(flag)}(?![A-Za-z0-9_.-])',
                      '',
                      text
                  )

              # Remove numeric fragments left by previous bad
              # replacements, but ONLY on compiler flag lines.
              new_lines = []

              for line in text.splitlines():
                  if (
                      "CMAKE_CXX_FLAGS" in line
                      or "CMAKE_C_FLAGS" in line
                  ):
                      line = re.sub(
                          r'(?<![A-Za-z0-9_.-])'
                          r'(?:2|3|4\.1|4\.2)'
                          r'(?![A-Za-z0-9_.-])',
                          '',
                          line
                      )

                  new_lines.append(line)

              text = "\n".join(new_lines)

              if original.endswith("\n"):
                  text += "\n"

              if text != original:
                  p.write_text(text)
                  print("PATCHED:", p)

          PY

      - name: Verify CMake flags
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CMAKE FLAG LINES"
          echo "========================================"

          grep -RIn \
            --include='CMakeLists.txt' \
            --include='*.cmake' \
            'CMAKE_.*FLAGS' . || true

          echo
          echo "========================================"
          echo "X86 FLAG CHECK"
          echo "========================================"

          if grep -RInE \
            --include='CMakeLists.txt' \
            --include='*.cmake' \
            -- \
            '-m(sse|ssse|avx|avx2|popcnt|bmi|bmi2|fma|f16c|abm|xop)' \
            . ; then

            echo "ERROR: x86 flags remain."
            exit 1
          fi

          echo "OK: no x86 flags."

      # ============================================================
      # Configure ARM64 Android.
      # ============================================================
      - name: Configure ARM64
        shell: bash
        run: |
          set -eux

          rm -rf build

          export CC="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"

          echo "CC=$CC"
          echo "CXX=$CXX"

          "$CC" --version
          "$CXX" --version

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_FLAGS="-O3 -fno-fast-math -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-O3 -fno-fast-math -fno-omit-frame-pointer -pthread" \
            -DCMAKE_EXE_LINKER_FLAGS="-pthread"

      - name: Verify generated Ninja flags
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GENERATED FLAGS"
          echo "========================================"

          grep -n "FLAGS =" build/build.ninja | head -30 || true

          echo
          echo "========================================"
          echo "BAD X86 FLAG CHECK"
          echo "========================================"

          if grep -nE \
            '(^|[[:space:]])-m(sse|ssse|avx|avx2|popcnt|bmi|bmi2|fma|f16c|abm|xop)([[:space:]]|$)' \
            build/build.ninja ; then

            echo "ERROR: x86 flag reached Ninja."
            exit 1
          fi

          if grep -nE \
            '(^|[[:space:]])(2|3|4\.1|4\.2)([[:space:]]|$)' \
            build/build.ninja ; then

            echo "ERROR: numeric fragments reached Ninja."
            exit 1
          fi

          echo "OK: generated flags are clean."

      # ============================================================
      # Patch BOTH Quirky threads.
      #
      # Outer thread:
      #   SearchLauncher::Start()
      #
      # Inner search thread:
      #   StartMainThread()
      #
      # The Android crash showed stack overflow in the search thread.
      # ============================================================
      - name: Patch Quirky threading
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          h = Path("src/search/searcher/launcher.h")
          cpp = Path("src/search/searcher/launcher.cpp")

          hs = h.read_text()
          cs = cpp.read_text()

          # --------------------------------------------------------
          # launcher.h
          # --------------------------------------------------------

          hs = hs.replace(
              "#include <thread>",
              "#include <pthread.h>"
          )

          hs = hs.replace(
              "    std::thread thread_;\n",
              "    pthread_t thread_{};\n"
              "    bool thread_joinable_ = false;\n"
          )

          h.write_text(hs)

          # --------------------------------------------------------
          # launcher.cpp includes
          # --------------------------------------------------------

          cs = cs.replace(
              "#include <string>\n",
              "#include <string>\n"
              "#include <pthread.h>\n"
              "#include <memory>\n"
          )

          # --------------------------------------------------------
          # Insert helper structures/functions immediately after
          # namespace q_search {
          # --------------------------------------------------------

          marker = "namespace q_search {\n"

          if "LAUNCHER_STACK_SIZE" not in cs:

              helper = r'''
          namespace {

          constexpr size_t LAUNCHER_STACK_SIZE = 16 * 1024 * 1024;
          constexpr size_t SEARCH_STACK_SIZE   = 32 * 1024 * 1024;

          struct LauncherThreadArgs {
              SearchLauncher* self;
              q_core::Board board;
              std::vector<q_core::Move> moves;
              time_control_t time_control;
              depth_t max_depth;
          };

          struct SearchThreadArgs {
              Searcher* searcher;
              depth_t max_depth;
              size_t real_pv_count;
          };

          void* SearchThreadEntry(void* raw) {
              auto* args =
                  static_cast<SearchThreadArgs*>(raw);

              args->searcher->Run(
                  args->max_depth,
                  args->real_pv_count
              );

              delete args;
              return nullptr;
          }

          void* LauncherThreadEntry(void* raw) {
              auto* args =
                  static_cast<LauncherThreadArgs*>(raw);

              args->self->StartMainThread(
                  args->board,
                  args->moves,
                  args->time_control,
                  args->max_depth
              );

              delete args;
              return nullptr;
          }

          bool CreateThreadWithStack(
              pthread_t* thread,
              size_t stack_size,
              void* (*entry)(void*),
              void* arg)
          {
              pthread_attr_t attr;

              if (pthread_attr_init(&attr) != 0)
                  return false;

              if (pthread_attr_setstacksize(
                      &attr,
                      stack_size) != 0) {

                  pthread_attr_destroy(&attr);
                  return false;
              }

              int result = pthread_create(
                  thread,
                  &attr,
                  entry,
                  arg
              );

              pthread_attr_destroy(&attr);

              return result == 0;
          }

          } // namespace

          '''

              cs = cs.replace(
                  marker,
                  marker + helper,
                  1
              )

          # --------------------------------------------------------
          # Replace the ORIGINAL Start() body exactly.
          # --------------------------------------------------------

          old_start = '''void SearchLauncher::Start(const q_core::Board& board, const std::vector<q_core::Move>& moves,
                           time_control_t time_control, depth_t max_depth) {
    Join();
    control_.Reset();
    tt_.NextPosition();
    thread_ = std::thread([this, board, moves, time_control, max_depth]() {
        StartMainThread(board, moves, time_control, max_depth);
    });
}'''

          new_start = '''void SearchLauncher::Start(const q_core::Board& board, const std::vector<q_core::Move>& moves,
                           time_control_t time_control, depth_t max_depth) {
    Join();
    control_.Reset();
    tt_.NextPosition();

    auto* args = new LauncherThreadArgs{
        this,
        board,
        moves,
        time_control,
        max_depth
    };

    if (!CreateThreadWithStack(
            &thread_,
            LAUNCHER_STACK_SIZE,
            LauncherThreadEntry,
            args)) {

        delete args;
        thread_joinable_ = false;
        return;
    }

    thread_joinable_ = true;
}'''

          if old_start not in cs:
              raise SystemExit(
                  "ERROR: original SearchLauncher::Start() "
                  "was not found exactly."
              )

          cs = cs.replace(
              old_start,
              new_start,
              1
          )

          # --------------------------------------------------------
          # Replace Searcher stack object with heap object.
          # --------------------------------------------------------

          old_searcher = '''    Searcher searcher(tt_, rt, board, control_, stat);
    SearchTimer timer(time_control, board, stat);
    std::thread search_thread = std::thread([&]() { searcher.Run(max_depth, real_pv_count); });'''

          new_searcher = '''    auto searcher = std::make_unique<Searcher>(
        tt_,
        rt,
        board,
        control_,
        stat
    );

    SearchTimer timer(time_control, board, stat);

    auto* search_args = new SearchThreadArgs{
        searcher.get(),
        max_depth,
        real_pv_count
    };

    pthread_t search_thread{};

    if (!CreateThreadWithStack(
            &search_thread,
            SEARCH_STACK_SIZE,
            SearchThreadEntry,
            search_args)) {

        delete search_args;
        return;
    }'''

          if old_searcher not in cs:
              raise SystemExit(
                  "ERROR: Searcher/std::thread search block "
                  "was not found exactly."
              )

          cs = cs.replace(
              old_searcher,
              new_searcher,
              1
          )

          # --------------------------------------------------------
          # Replace the inner search_thread.join().
          # --------------------------------------------------------

          old_join = "    search_thread.join();"

          new_join = '''    pthread_join(search_thread, nullptr);'''

          if old_join not in cs:
              raise SystemExit(
                  "ERROR: search_thread.join() was not found."
              )

          cs = cs.replace(
              old_join,
              new_join,
              1
          )

          # --------------------------------------------------------
          # Replace outer Join().
          # --------------------------------------------------------

          old_outer_join = '''void SearchLauncher::Join() {
    if (thread_.joinable()) {
        control_.Stop();
        thread_.join();
    }
}'''

          new_outer_join = '''void SearchLauncher::Join() {
    if (thread_joinable_) {
        control_.Stop();
        pthread_join(thread_, nullptr);
        thread_joinable_ = false;
    }
}'''

          if old_outer_join not in cs:
              raise SystemExit(
                  "ERROR: original Join() was not found exactly."
              )

          cs = cs.replace(
              old_outer_join,
              new_outer_join,
              1
          )

          cpp.write_text(cs)

          print("Thread patch completed.")

          PY

      # ============================================================
      # Verify BOTH threads are gone from launcher.cpp.
      # ============================================================
      - name: Verify pthread patch
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STACK SIZES"
          echo "========================================"

          grep -n "STACK_SIZE" \
            src/search/searcher/launcher.cpp

          echo
          echo "========================================"
          echo "PTHREAD CREATION"
          echo "========================================"

          grep -n "pthread_create\|CreateThreadWithStack" \
            src/search/searcher/launcher.cpp

          echo
          echo "========================================"
          echo "SEARCH THREAD"
          echo "========================================"

          grep -n "SearchThreadEntry\|search_thread\|SEARCH_STACK_SIZE" \
            src/search/searcher/launcher.cpp

          echo
          echo "========================================"
          echo "STD::THREAD CHECK"
          echo "========================================"

          if grep -RIn \
            --include='launcher.cpp' \
            --include='launcher.h' \
            'std::thread' \
            src/search/searcher ; then

            echo "ERROR: std::thread remains."
            exit 1
          fi

          echo "OK: no std::thread remains."

      # ============================================================
      # Build
      # ============================================================
      - name: Build
        shell: bash
        run: |
          set -eux

          cmake --build build --parallel 2

      # ============================================================
      # Find executable
      # ============================================================
      - name: Find binary
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXECUTABLES"
          echo "========================================"

          find build \
            -type f \
            -perm -111 \
            -print

          BIN="$(find build \
            -type f \
            -perm -111 \
            ! -name '*.so' \
            ! -name '*.a' \
            | head -n1)"

          if [ -z "$BIN" ]; then
            echo "ERROR: executable not found."
            exit 1
          fi

          echo "BIN=$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      # ============================================================
      # Verify AArch64
      # ============================================================
      - name: Verify ARM64
        shell: bash
        run: |
          set -e

          file "$BIN"

          readelf -h "$BIN" | grep -E \
            'Class:|Machine:|Type:'

          if ! readelf -h "$BIN" | grep -q "AArch64"; then
            echo "ERROR: binary is not AArch64."
            exit 1
          fi

      # ============================================================
      # Package
      # ============================================================
      - name: Package
        shell: bash
        run: |
          set -e

          mkdir -p artifact

          cp "$BIN" \
            artifact/Quirky-android-arm64

          chmod +x \
            artifact/Quirky-android-arm64

          ls -lh \
            artifact/Quirky-android-arm64

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: Quirky-android-arm64
          path: artifact/Quirky-android-arm64
          if-no-files-found: error
