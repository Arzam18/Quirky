name: Quirky Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android NDK
        shell: bash
        run: |
          set -e

          NDK="$(find "$ANDROID_SDK_ROOT/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n1)"

          if [ -z "$NDK" ]; then
            echo "ERROR: Android NDK not found"
            exit 1
          fi

          echo "NDK=$NDK"
          echo "NDK=$NDK" >> "$GITHUB_ENV"

          echo "TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Remove ALL x86-specific compiler flags from the source CMake
      # files BEFORE CMake configuration.
      # ------------------------------------------------------------
      - name: Remove x86 flags from CMake
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          bad_flags = [
              "-msse4.2",
              "-msse4.1",
              "-mssse3",
              "-msse3",
              "-msse2",
              "-msse",
              "-mpopcnt",
              "-mbmi2",
              "-mbmi",
              "-mavx2",
              "-mavx",
              "-mfma",
              "-mf16c",
              "-mabm",
              "-mxop",
              "-msse4",
          ]

          # Process every CMake file.
          files = []

          for p in Path(".").rglob("*"):
              if not p.is_file():
                  continue

              if p.name == "CMakeLists.txt" or p.suffix == ".cmake":
                  files.append(p)

          print("CMake files found:")
          for p in files:
              print("  ", p)

          for p in files:
              try:
                  text = p.read_text()
              except Exception:
                  continue

              original = text

              # Remove complete compiler-flag tokens.
              #
              # IMPORTANT:
              # Do this longest -> shortest so -msse4.2 is removed
              # before -msse can accidentally match it.
              for flag in sorted(bad_flags, key=len, reverse=True):
                  text = re.sub(
                      rf'(?<![A-Za-z0-9_]){re.escape(flag)}(?![A-Za-z0-9_.-])',
                      '',
                      text
                  )

              # Remove numeric fragments accidentally produced by
              # an earlier bad patch, but ONLY on CMAKE_*_FLAGS lines.
              lines = []

              for line in text.splitlines():
                  if "CMAKE_CXX_FLAGS" in line or "CMAKE_C_FLAGS" in line:
                      line = re.sub(
                          r'(?<![A-Za-z0-9_.-])(?:2|3|4\.1|4\.2)(?![A-Za-z0-9_.-])',
                          '',
                          line
                      )

                  lines.append(line)

              text = "\n".join(lines)

              if original.endswith("\n"):
                  text += "\n"

              if text != original:
                  p.write_text(text)
                  print("PATCHED:", p)

          PY

      # ------------------------------------------------------------
      # Show the result BEFORE configuring CMake.
      # ------------------------------------------------------------
      - name: Verify CMake flags
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CMAKE FLAG LINES"
          echo "========================================"

          grep -RIn \
            --include='CMakeLists.txt' \
            --include='*.cmake' \
            'CMAKE_.*FLAGS' . || true

          echo
          echo "========================================"
          echo "SEARCHING FOR X86 FLAGS"
          echo "========================================"

          if grep -RInE \
            --include='CMakeLists.txt' \
            --include='*.cmake' \
            -- \
            '-m(sse|ssse|avx|avx2|popcnt|bmi|bmi2|fma|f16c|abm|xop)' \
            . ; then

            echo
            echo "ERROR: x86 flags still remain."
            exit 1
          fi

          echo "OK: no x86 compiler flags remain."

      # ------------------------------------------------------------
      # Force Android ARM64 compiler.
      # ------------------------------------------------------------
      - name: Configure ARM64
        shell: bash
        run: |
          set -eux

          rm -rf build

          export CC="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"

          "$CC" --version
          "$CXX" --version

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_FLAGS="-O3 -fno-fast-math -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-O3 -fno-fast-math -fno-omit-frame-pointer -pthread" \
            -DCMAKE_EXE_LINKER_FLAGS="-pthread"

      # ------------------------------------------------------------
      # Verify generated Ninja did NOT inherit broken x86 flags.
      # ------------------------------------------------------------
      - name: Verify generated build flags
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GENERATED NINJA FLAGS"
          echo "========================================"

          grep -n "FLAGS =" build/build.ninja | head -20 || true

          echo
          echo "========================================"
          echo "CHECKING FOR BAD X86 FLAGS"
          echo "========================================"

          if grep -nE \
            '(^|[[:space:]])-m(sse|ssse|avx|avx2|popcnt|bmi|bmi2|fma|f16c|abm|xop)([[:space:]]|$)' \
            build/build.ninja ; then

            echo "ERROR: x86 flags reached generated Ninja."
            exit 1
          fi

          # Catch the exact corruption from the previous workflow.
          if grep -nE \
            '(^|[[:space:]])(2|3|4\.1|4\.2)([[:space:]]|$)' \
            build/build.ninja ; then

            echo "ERROR: standalone numeric flag fragments reached Ninja."
            exit 1
          fi

          echo "OK: generated flags are clean."

      # ------------------------------------------------------------
      # Patch Quirky's launcher so its search pthread gets a large
      # stack. The crash previously reported by Android was:
      #
      #   SEGV_ACCERR
      #   Cause: stack pointer is not in a rw map; likely due to
      #   stack overflow.
      # ------------------------------------------------------------
      - name: Patch launcher for large Android pthread stacks
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          h = Path("src/search/searcher/launcher.h")
          cpp = Path("src/search/searcher/launcher.cpp")

          if not h.exists():
              raise SystemExit(f"ERROR: missing {h}")

          if not cpp.exists():
              raise SystemExit(f"ERROR: missing {cpp}")

          hs = h.read_text()
          cs = cpp.read_text()

          # --------------------------------------------------------
          # launcher.h
          # --------------------------------------------------------

          hs = hs.replace(
              "#include <thread>",
              "#include <pthread.h>"
          )

          # Replace the std::thread member.
          hs = re.sub(
              r'\bstd::thread\s+thread_\s*;',
              'pthread_t thread_{};\n    bool thread_joinable_ = false;',
              hs
          )

          # Add pthread entry declaration if it isn't already there.
          if "ThreadEntry(void*" not in hs:
              marker = "private:"
              if marker in hs:
                  hs = hs.replace(
                      marker,
                      "static void* ThreadEntry(void* raw);\n\n    " + marker,
                      1
                  )
              else:
                  hs += (
                      "\nprivate:\n"
                      "    static void* ThreadEntry(void* raw);\n"
                  )

          h.write_text(hs)

          # --------------------------------------------------------
          # launcher.cpp
          # --------------------------------------------------------

          cs = cs.replace(
              "#include <thread>",
              "#include <pthread.h>\n"
              "#include <memory>"
          )

          if "#include <pthread.h>" not in cs:
              cs = "#include <pthread.h>\n#include <memory>\n" + cs

          # --------------------------------------------------------
          # Add stack constants and pthread helper.
          # --------------------------------------------------------

          helper = r'''
          namespace {

          constexpr size_t LAUNCHER_STACK_SIZE = 16 * 1024 * 1024;
          constexpr size_t SEARCH_STACK_SIZE   = 32 * 1024 * 1024;

          struct LauncherThreadArgs {
              SearchLauncher* self;
              q_core::Board board;
              std::vector<q_core::Move> moves;
              time_control_t time_control;
              depth_t max_depth;
          };

          struct SearchThreadArgs {
              std::unique_ptr<Searcher> searcher;
          };

          static bool CreateThreadWithStack(
              pthread_t* thread,
              size_t stack_size,
              void* (*entry)(void*),
              void* arg)
          {
              pthread_attr_t attr;

              if (pthread_attr_init(&attr) != 0)
                  return false;

              if (pthread_attr_setstacksize(&attr, stack_size) != 0) {
                  pthread_attr_destroy(&attr);
                  return false;
              }

              const int result =
                  pthread_create(thread, &attr, entry, arg);

              pthread_attr_destroy(&attr);

              return result == 0;
          }

          } // namespace
          '''

          # Only insert once.
          if "LAUNCHER_STACK_SIZE" not in cs:
              # Put helper after includes.
              pos = 0

              # Find the end of the include block.
              matches = list(re.finditer(r'^#include[^\n]*\n', cs, re.MULTILINE))

              if matches:
                  pos = matches[-1].end()

              cs = cs[:pos] + "\n" + helper + "\n" + cs[pos:]

          # --------------------------------------------------------
          # Replace Start() implementation.
          # --------------------------------------------------------

          start_pattern = re.compile(
              r'(void\s+SearchLauncher::Start\s*\([^)]*\)\s*\{).*?'
              r'\n\}',
              re.DOTALL
          )

          m = start_pattern.search(cs)

          if m:
              old = m.group(0)

              if "CreateThreadWithStack" not in old:
                  # We need to preserve the function signature while
                  # replacing its body.
                  signature = m.group(1)

                  new = signature + r'''
              auto* args = new LauncherThreadArgs{
                  this,
                  board,
                  moves,
                  time_control,
                  max_depth
              };

              if (!CreateThreadWithStack(
                      &thread_,
                      LAUNCHER_STACK_SIZE,
                      &SearchLauncher::ThreadEntry,
                      args)) {

                  delete args;
                  thread_joinable_ = false;
                  return;
              }

              thread_joinable_ = true;
          }'''

                  cs = cs[:m.start()] + new + cs[m.end():]

          # --------------------------------------------------------
          # Replace the outer thread lambda if one remains.
          # --------------------------------------------------------

          cs = re.sub(
              r'thread_\s*=\s*std::thread\s*\(\s*\[this,\s*board,\s*moves,\s*time_control,\s*max_depth\]\s*\(\)\s*\{.*?\}\s*\);',
              '',
              cs,
              flags=re.DOTALL
          )

          # --------------------------------------------------------
          # Replace destructor join.
          # --------------------------------------------------------

          cs = re.sub(
              r'thread_\s*\.\s*join\s*\(\s*\)\s*;',
              'if (thread_joinable_) {\n'
              '        pthread_join(thread_, nullptr);\n'
              '        thread_joinable_ = false;\n'
              '    }',
              cs
          )

          # --------------------------------------------------------
          # Replace Searcher stack allocation.
          # --------------------------------------------------------

          cs = re.sub(
              r'\bSearcher\s+searcher\s*\(',
              'auto searcher = std::make_unique<Searcher>(',
              cs
          )

          # The above replacement changes the closing `);` naturally
          # into a make_unique call, but references need -> instead of .
          # Do this only within SearchLauncher-related code.
          #
          # We use a conservative replacement for common references.
          if "searcher->" not in cs:
              cs = re.sub(
                  r'\bsearcher\.',
                  'searcher->',
                  cs
              )

          # --------------------------------------------------------
          # Add ThreadEntry implementation if missing.
          # --------------------------------------------------------

          if "SearchLauncher::ThreadEntry(void*" not in cs:
              entry = r'''

          void* SearchLauncher::ThreadEntry(void* raw)
          {
              std::unique_ptr<LauncherThreadArgs> args(
                  static_cast<LauncherThreadArgs*>(raw));

              args->self->StartMainThread(
                  args->board,
                  args->moves,
                  args->time_control,
                  args->max_depth);

              return nullptr;
          }

          '''

              # Put before namespace close if possible.
              idx = cs.rfind("}")
              if idx >= 0:
                  cs = cs[:idx] + entry + cs[idx:]
              else:
                  cs += entry

          cpp.write_text(cs)

          PY

      # ------------------------------------------------------------
      # IMPORTANT:
      # Check source after patching.
      # ------------------------------------------------------------
      - name: Verify launcher patch
        shell: bash
        run: |
          set -e

          echo "=== pthread ==="
          grep -n "pthread" \
            src/search/searcher/launcher.h \
            src/search/searcher/launcher.cpp || true

          echo
          echo "=== stack sizes ==="
          grep -n "STACK_SIZE" \
            src/search/searcher/launcher.cpp || true

          echo
          echo "=== std::thread remaining ==="

          if grep -RIn \
            --include='launcher.cpp' \
            --include='launcher.h' \
            'std::thread' \
            src/search/searcher ; then

            echo "ERROR: std::thread remains in launcher."
            exit 1
          fi

          echo "OK: no std::thread remains in launcher."

      # ------------------------------------------------------------
      # Build.
      # ------------------------------------------------------------
      - name: Build Quirky
        shell: bash
        run: |
          set -eux

          cmake --build build --parallel 2

      # ------------------------------------------------------------
      # Locate executable.
      # ------------------------------------------------------------
      - name: Find executable
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXECUTABLES"
          echo "========================================"

          find build -type f -perm -111 -print

          BIN="$(find build -type f -perm -111 \
            ! -name '*.so' \
            ! -name '*.a' \
            | head -n1)"

          if [ -z "$BIN" ]; then
            echo "ERROR: executable not found."
            exit 1
          fi

          echo "Selected binary:"
          echo "$BIN"

          echo "BIN=$BIN" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Verify architecture.
      # ------------------------------------------------------------
      - name: Verify ARM64 binary
        shell: bash
        run: |
          set -e

          file "$BIN"

          readelf -h "$BIN" | grep -E \
            'Class:|Machine:|Type:'

          if ! readelf -h "$BIN" | grep -q "AArch64"; then
            echo "ERROR: binary is not AArch64."
            exit 1
          fi

      # ------------------------------------------------------------
      # Package with the expected DroidFish filename.
      # ------------------------------------------------------------
      - name: Package
        shell: bash
        run: |
          set -e

          mkdir -p artifact

          cp "$BIN" \
            artifact/Quirky-android-arm64

          chmod +x \
            artifact/Quirky-android-arm64

          ls -lh artifact/Quirky-android-arm64

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: Quirky-android-arm64
          path: artifact/Quirky-android-arm64
          if-no-files-found: error
