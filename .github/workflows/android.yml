      # ============================================================
      # VERIFY THREAD PATCH
      # ============================================================
      - name: Verify pthread patch
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STACK SIZES"
          echo "========================================"

          grep -n "STACK_SIZE" \
            src/search/searcher/launcher.cpp

          echo
          echo "========================================"
          echo "PTHREAD CREATION"
          echo "========================================"

          grep -nE \
            "pthread_create|pthread_join|CreateThreadWithStack" \
            src/search/searcher/launcher.cpp

          echo
          echo "========================================"
          echo "SEARCH THREAD"
          echo "========================================"

          grep -nE \
            "SearchThreadEntry|search_thread|SEARCH_STACK_SIZE" \
            src/search/searcher/launcher.cpp

          echo
          echo "========================================"
          echo "STD::THREAD CHECK"
          echo "========================================"

          if grep -RIn \
            --include='launcher.cpp' \
            --include='launcher.h' \
            'std::thread' \
            src/search/searcher ; then

            echo "ERROR: std::thread remains."
            exit 1
          fi

          echo "OK: no std::thread remains."


      # ============================================================
      # BUILD
      # ============================================================
      - name: Build Quirky
        shell: bash
        run: |
          set -eux

          cmake --build build --parallel 2


      # ============================================================
      # FIND EXECUTABLE
      # ============================================================
      - name: Find executable
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXECUTABLES"
          echo "========================================"

          find build \
            -type f \
            -perm -111 \
            -print

          BIN="$(find build \
            -type f \
            -perm -111 \
            ! -name '*.so' \
            ! -name '*.a' \
            | head -n1)"

          if [ -z "$BIN" ]; then
            echo "ERROR: executable not found."
            exit 1
          fi

          echo
          echo "Selected binary:"
          echo "$BIN"

          echo "BIN=$BIN" >> "$GITHUB_ENV"


      # ============================================================
      # VERIFY ARM64
      # ============================================================
      - name: Verify AArch64 binary
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FILE"
          echo "========================================"

          file "$BIN"

          echo
          echo "========================================"
          echo "ELF HEADER"
          echo "========================================"

          readelf -h "$BIN" | grep -E \
            'Class:|Machine:|Type:'

          if ! readelf -h "$BIN" | grep -q "AArch64"; then
            echo "ERROR: binary is not AArch64."
            exit 1
          fi

          echo "OK: AArch64 binary."


      # ============================================================
      # PACKAGE
      # ============================================================
      - name: Package Quirky
        shell: bash
        run: |
          set -e

          mkdir -p artifact

          cp "$BIN" \
            artifact/Quirky-android-arm64

          chmod +x \
            artifact/Quirky-android-arm64

          echo "========================================"
          echo "FINAL BINARY"
          echo "========================================"

          ls -lh \
            artifact/Quirky-android-arm64


      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: Quirky-android-arm64
          path: artifact/Quirky-android-arm64
          if-no-files-found: error
