name: Build Quirky Android ARM64

on:
  workflow_dispatch:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ------------------------------------------------------------
      # Android NDK
      # ------------------------------------------------------------

      - name: Locate Android NDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID ENVIRONMENT"
          echo "========================================"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "SDK: $SDK"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo
          echo "Installed NDKs:"
          find "$SDK/ndk" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -print 2>/dev/null || true

          if [ -d "$SDK/ndk/27.2.12479018" ]; then
            NDK="$SDK/ndk/27.2.12479018"
          else
            NDK=$(find "$SDK/ndk" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print 2>/dev/null |
              sort -V |
              tail -n 1)
          fi

          if [ -z "${NDK:-}" ] || [ ! -d "$NDK" ]; then
            echo "ERROR: No Android NDK found."
            exit 1
          fi

          echo
          echo "Selected NDK:"
          echo "$NDK"

          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

      - name: Locate ARM64 Compiler
        shell: bash
        run: |
          set -e

          TOOLCHAIN="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CC="$TOOLCHAIN/aarch64-linux-android28-clang"
          CXX="$TOOLCHAIN/aarch64-linux-android28-clang++"

          if [ ! -x "$CC" ]; then
            echo "ERROR: ARM64 C compiler not found:"
            echo "$CC"
            exit 1
          fi

          if [ ! -x "$CXX" ]; then
            echo "ERROR: ARM64 C++ compiler not found:"
            echo "$CXX"
            exit 1
          fi

          echo "NDK_CC=$CC" >> "$GITHUB_ENV"
          echo "NDK_CXX=$CXX" >> "$GITHUB_ENV"

      - name: Verify Compiler
        shell: bash
        run: |
          set -e

          echo "C compiler:"
          "$NDK_CC" --version

          echo
          echo "C++ compiler:"
          "$NDK_CXX" --version

          echo
          echo "Target:"
          "$NDK_CXX" -dumpmachine

      # ------------------------------------------------------------
      # REMOVE X86 / SSE FLAGS
      # ------------------------------------------------------------

      - name: Remove x86 CPU Flags
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "REMOVING X86/SSE FLAGS"
          echo "========================================"

          echo
          echo "Searching repository..."

          grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude='*.md' \
            --exclude='*.txt' \
            --exclude='*.json' \
            --exclude='*.lock' \
            -- \
            '-msse|-msse2|-msse3|-mssse3|-msse4\.1|-msse4\.2|-mpopcnt|-mavx|-mavx2|-mfma' \
            . || true

          echo
          echo "Removing flags from CMake/source configuration..."

          python3 <<'PY'
          from pathlib import Path
          import re

          flags = [
              "-msse",
              "-msse2",
              "-msse3",
              "-mssse3",
              "-msse4.1",
              "-msse4.2",
              "-mpopcnt",
              "-mavx",
              "-mavx2",
              "-mfma",
              "-mbmi",
              "-mbmi2",
              "-mlzcnt",
              "-mf16c",
              "-mxsave",
              "-mxsaveopt",
          ]

          extensions = {
              ".cmake",
              ".txt",
              ".mk",
              ".make",
              ".cpp",
              ".cc",
              ".c",
              ".h",
              ".hpp",
          }

          replacements = 0

          for path in Path(".").rglob("*"):

              if not path.is_file():
                  continue

              if ".git" in path.parts:
                  continue

              if "build" in path.parts:
                  continue

              if path.suffix.lower() not in extensions:
                  continue

              try:
                  text = path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
              except Exception:
                  continue

              original = text

              for flag in flags:
                  text = re.sub(
                      rf"(?<![A-Za-z0-9_+-]){re.escape(flag)}(?![A-Za-z0-9_.-])",
                      "",
                      text
                  )

              if text != original:
                  path.write_text(
                      text,
                      encoding="utf-8"
                  )

                  print("Modified:", path)
                  replacements += 1

          print()
          print("Files modified:", replacements)
          PY

          echo
          echo "Remaining x86 flags:"
          grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude='*.md' \
            -- \
            '-msse|-msse2|-msse3|-mssse3|-msse4\.1|-msse4\.2|-mpopcnt|-mavx|-mavx2|-mfma' \
            . || true

      # ------------------------------------------------------------
      # PORTABLE NNUE
      # ------------------------------------------------------------

      - name: Back Up Original NNUE Layers
        shell: bash
        run: |
          set -e

          test -f src/eval/layers.h

          cp \
            src/eval/layers.h \
            src/eval/layers.h.original

          echo "Original layers.h backed up."

      - name: Install Portable ARM NNUE Layers
        shell: bash
        run: |
          set -e

          cat > src/eval/layers.h <<'EOF'
          #ifndef QUIRKY_SRC_EVAL_LAYERS_H
          #define QUIRKY_SRC_EVAL_LAYERS_H

          #include <algorithm>
          #include <array>
          #include <cmath>
          #include <cstddef>
          #include <cstdint>
          #include <limits>

          #include "core/board/types.h"
          #include "core/util.h"
          #include "model_weights.h"
          #include "util/bit.h"
          #include "util/io.h"

          namespace q_eval {

          static constexpr int WEIGHT_SCALE = 64;
          static constexpr int ACTIVATION_SCALE = 127;
          static constexpr int OUTPUT_SCALE = 64 * 64;
          static constexpr int PRECISE_WEIGHT_SCALE = 64;

          static constexpr uint8_t FEATURE_ADDITIONAL_PRECISION = 5;
          static constexpr uint8_t LINEAR_ADDITIONAL_PRECISION = 3;

          struct ModelReader {

              template <std::integral T>
              T ReadWeight(int scale) {

                  float weight = MODEL_WEIGHTS[index_++];

                  int64_t final_weight =
                      std::round(weight * scale);

                  if (
                      final_weight >
                          static_cast<int64_t>(
                              std::numeric_limits<T>::max())
                      ||
                      final_weight <
                          static_cast<int64_t>(
                              std::numeric_limits<T>::min())
                  ) {
                      q_util::ExitWithError(
                          "Model weights are out of range");
                  }

                  return static_cast<T>(final_weight);
              }

          private:
              size_t index_ = 0;
          };

          template <size_t INPUT_SIZE, size_t OUTPUT_SIZE>
          struct FeatureLayer {

              void Initialize(ModelReader& reader) {

                  for (size_t i = 0; i < INPUT_SIZE; ++i) {

                      for (size_t j = 0;
                           j < OUTPUT_SIZE / 2;
                           ++j) {

                          weights_[i][j] =
                              reader.ReadWeight<int16_t>(
                                  ACTIVATION_SCALE *
                                  (1 << FEATURE_ADDITIONAL_PRECISION));

                          const q_core::cell_t cell =
                              i / q_core::BOARD_SIZE + 1;

                          const q_core::coord_t coord =
                              i % q_core::BOARD_SIZE;

                          const size_t pos =
                              (
                                  static_cast<size_t>(
                                      q_core::FlipCellColor(cell))
                                  - 1
                              ) *
                              q_core::BOARD_SIZE +
                              q_core::FlipCoord(coord);

                          weights_[pos][j + OUTPUT_SIZE / 2] =
                              weights_[i][j];
                      }
                  }

                  for (size_t i = 0;
                       i < OUTPUT_SIZE / 2;
                       ++i) {

                      biases_[i] =
                          reader.ReadWeight<int16_t>(
                              ACTIVATION_SCALE *
                              (1 << FEATURE_ADDITIONAL_PRECISION));

                      biases_[i + OUTPUT_SIZE / 2] =
                          biases_[i];
                  }
              }

              void GetResultOnEmptyBoard(int16_t* output) {

                  std::copy(
                      biases_.begin(),
                      biases_.end(),
                      output);
              }

              void Update(
                  int16_t* __restrict input,
                  size_t position,
                  int8_t delta) {

                  const int16_t* weights =
                      weights_[position].data();

                  if (delta == -1) {

                      for (size_t i = 0;
                           i < OUTPUT_SIZE;
                           ++i) {

                          input[i] -= weights[i];
                      }

                  } else {

                      for (size_t i = 0;
                           i < OUTPUT_SIZE;
                           ++i) {

                          input[i] += weights[i];
                      }
                  }
              }

              void Add(
                  int16_t* input,
                  size_t position) {

                  const int16_t* weights =
                      weights_[position].data();

                  for (size_t i = 0;
                       i < OUTPUT_SIZE;
                       ++i) {

                      input[i] += weights[i];
                  }
              }

              void SubAdd(
                  int16_t* input,
                  size_t position_first,
                  size_t position_second) {

                  const int16_t* first =
                      weights_[position_first].data();

                  const int16_t* second =
                      weights_[position_second].data();

                  for (size_t i = 0;
                       i < OUTPUT_SIZE;
                       ++i) {

                      input[i] -= first[i];
                      input[i] += second[i];
                  }
              }

              void SubSubAdd(
                  int16_t* input,
                  size_t position_first,
                  size_t position_second,
                  size_t position_third) {

                  const int16_t* first =
                      weights_[position_first].data();

                  const int16_t* second =
                      weights_[position_second].data();

                  const int16_t* third =
                      weights_[position_third].data();

                  for (size_t i = 0;
                       i < OUTPUT_SIZE;
                       ++i) {

                      input[i] -= first[i];
                      input[i] -= second[i];
                      input[i] += third[i];
                  }
              }

          private:

              alignas(64)
              std::array<
                  std::array<int16_t, OUTPUT_SIZE>,
                  INPUT_SIZE
              > weights_;

              alignas(64)
              std::array<int16_t, OUTPUT_SIZE> biases_;
          };

          template <size_t INPUT_SIZE, size_t OUTPUT_SIZE>
          struct LinearLayer {

              void Initialize(ModelReader& reader) {

                  for (size_t i = 0;
                       i < INPUT_SIZE;
                       ++i) {

                      for (size_t j = 0;
                           j < OUTPUT_SIZE;
                           ++j) {

                          weights_[
                              GetWeightIndex(
                                  static_cast<int>(
                                      j * INPUT_SIZE + i))
                          ] =
                              reader.ReadWeight<int8_t>(
                                  WEIGHT_SCALE *
                                  (1 << LINEAR_ADDITIONAL_PRECISION));
                      }
                  }

                  for (size_t i = 0;
                       i < OUTPUT_SIZE;
                       ++i) {

                      biases_[i] =
                          reader.ReadWeight<int32_t>(
                              ACTIVATION_SCALE *
                              WEIGHT_SCALE *
                              (1 << LINEAR_ADDITIONAL_PRECISION));
                  }

                  for (size_t i = 0; i < 256; ++i) {

                      for (size_t j = 0; j < 8; ++j)
                          lookup_indices_[i][j] = 0;

                      uint64_t bits = i;
                      uint64_t k = 0;

                      while (bits > 0) {

                          lookup_indices_[i][k++] =
                              q_util::ExtractLowestBit(bits);
                      }
                  }
              }

              void Process(
                  const int8_t* src,
                  int32_t* dest) {

                  for (size_t output = 0;
                       output < OUTPUT_SIZE;
                       ++output) {

                      int32_t sum = biases_[output];

                      for (size_t input = 0;
                           input < INPUT_SIZE;
                           ++input) {

                          const int8_t value = src[input];

                          if (value == 0)
                              continue;

                          const int index =
                              GetWeightIndex(
                                  static_cast<int>(
                                      output *
                                      INPUT_SIZE +
                                      input));

                          sum +=
                              static_cast<int32_t>(value) *
                              static_cast<int32_t>(
                                  weights_[index]);
                      }

                      dest[output] =
                          sum >> LINEAR_ADDITIONAL_PRECISION;
                  }
              }

          private:

              int GetWeightIndex(int idx) {

                  return
                      ((idx / 4) %
                       (INPUT_SIZE / 4) *
                       OUTPUT_SIZE * 4)
                      +
                      (idx / INPUT_SIZE * 4)
                      +
                      (idx % 4);
              }

              alignas(64)
              std::array<
                  int8_t,
                  INPUT_SIZE * OUTPUT_SIZE
              > weights_;

              alignas(64)
              std::array<int32_t, OUTPUT_SIZE> biases_;

              alignas(64)
              std::array<
                  std::array<uint16_t, 8>,
                  256
              > lookup_indices_;
          };

          template <size_t INPUT_SIZE, size_t OUTPUT_SIZE>
          struct PreciseLinearLayer {

              void Initialize(ModelReader& reader) {

                  for (size_t i = 0;
                       i < INPUT_SIZE;
                       ++i) {

                      for (size_t j = 0;
                           j < OUTPUT_SIZE;
                           ++j) {

                          weights_[j * INPUT_SIZE + i] =
                              reader.ReadWeight<int16_t>(
                                  WEIGHT_SCALE *
                                  PRECISE_WEIGHT_SCALE);
                      }
                  }

                  for (size_t i = 0;
                       i < OUTPUT_SIZE;
                       ++i) {

                      biases_[i] =
                          reader.ReadWeight<int32_t>(
                              ACTIVATION_SCALE *
                              WEIGHT_SCALE *
                              WEIGHT_SCALE *
                              PRECISE_WEIGHT_SCALE);
                  }
              }

              void Process(
                  const int16_t* input,
                  int32_t* output) {

                  for (size_t out = 0;
                       out < OUTPUT_SIZE;
                       ++out) {

                      int32_t sum = biases_[out];

                      for (size_t in = 0;
                           in < INPUT_SIZE;
                           ++in) {

                          sum +=
                              static_cast<int32_t>(
                                  input[in]) *
                              static_cast<int32_t>(
                                  weights_[
                                      out * INPUT_SIZE + in]);
                      }

                      output[out] =
                          sum >>
                          q_util::GetHighestBit(
                              static_cast<uint32_t>(
                                  WEIGHT_SCALE *
                                  PRECISE_WEIGHT_SCALE));
                  }
              }

          private:

              alignas(64)
              std::array<
                  int16_t,
                  INPUT_SIZE * OUTPUT_SIZE
              > weights_;

              alignas(64)
              std::array<int32_t, OUTPUT_SIZE> biases_;
          };

          template <size_t INPUT_SIZE>
          struct OutputLayer {

              void Initialize(ModelReader& reader) {

                  for (size_t i = 0;
                       i < INPUT_SIZE;
                       ++i) {

                      weights_[i] =
                          reader.ReadWeight<int16_t>(
                              WEIGHT_SCALE *
                              OUTPUT_SCALE /
                              ACTIVATION_SCALE);
                  }

                  bias_ =
                      reader.ReadWeight<int32_t>(
                          WEIGHT_SCALE *
                          OUTPUT_SCALE);
              }

              int32_t Process(
                  const int16_t* input) {

                  int32_t answer = 0;

                  for (size_t i = 0;
                       i < INPUT_SIZE;
                       ++i) {

                      answer +=
                          static_cast<int32_t>(input[i]) *
                          static_cast<int32_t>(weights_[i]);
                  }

                  answer += bias_;

                  return answer;
              }

          private:

              alignas(64)
              std::array<int16_t, INPUT_SIZE> weights_;

              int32_t bias_;
          };

          inline void ClippedReLU16(
              int size,
              int8_t* output,
              const int16_t* input) {

              for (int i = 0; i < size; ++i) {

                  int value =
                      static_cast<int>(input[i]) >>
                      FEATURE_ADDITIONAL_PRECISION;

                  if (value < 0)
                      value = 0;

                  if (value > 127)
                      value = 127;

                  output[i] =
                      static_cast<int8_t>(value);
              }
          }

          inline void ClippedReLU32(
              int size,
              int16_t* output,
              const int32_t* input) {

              constexpr int upper =
                  32768 *
                  WEIGHT_SCALE /
                  256 - 1;

              for (int i = 0; i < size; ++i) {

                  int32_t value = input[i];

                  if (value < 0)
                      value = 0;

                  if (value > upper)
                      value = upper;

                  output[i] =
                      static_cast<int16_t>(value);
              }
          }

          } // namespace q_eval

          #endif
          EOF

          echo "Portable NNUE layers installed."

      # ------------------------------------------------------------
      # CMAKE
      # ------------------------------------------------------------

      - name: Configure CMake
        shell: bash
        run: |
          set -e

          rm -rf build

          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=28 \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK" \
            -DCMAKE_C_COMPILER="$NDK_CC" \
            -DCMAKE_CXX_COMPILER="$NDK_CXX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DNO_AVX2=ON \
            -DCMAKE_C_FLAGS="-O3" \
            -DCMAKE_CXX_FLAGS="-O3 -fno-fast-math"

      # ------------------------------------------------------------
      # BUILD
      # ------------------------------------------------------------

      - name: Build Quirky
        shell: bash
        run: |
          set -e

          cmake --build build \
            --config Release \
            --parallel "$(nproc)"

      # ------------------------------------------------------------
      # FIND BINARY
      # ------------------------------------------------------------

      - name: Find Quirky Binary
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILD OUTPUT"
          echo "========================================"

          find build \
            -type f \
            -perm -111 \
            -print

          BINARY=""

          for candidate in \
            "build/Quirky" \
            "build/quirky" \
            "build/src/Quirky" \
            "build/src/quirky" \
            "build/bin/Quirky" \
            "build/bin/quirky"
          do
            if [ -f "$candidate" ]; then
              BINARY="$candidate"
              break
            fi
          done

          if [ -z "$BINARY" ]; then
            BINARY=$(find build \
              -type f \
              -perm -111 \
              -print |
              grep -Ei '/quirky$' |
              head -n 1 || true)
          fi

          if [ -z "$BINARY" ]; then
            echo "ERROR: Quirky executable not found."
            exit 1
          fi

          echo "Binary:"
          echo "$BINARY"

          mkdir -p dist/bin

          cp "$BINARY" \
            dist/bin/Quirky-android-arm64

          chmod +x \
            dist/bin/Quirky-android-arm64

      # ------------------------------------------------------------
      # VERIFY
      # ------------------------------------------------------------

      - name: Verify ELF
        shell: bash
        run: |
          set -e

          BINARY="dist/bin/Quirky-android-arm64"

          file "$BINARY"

          echo
          readelf -h "$BINARY" |
            grep -E \
              "Class:|Machine:|Type:|Entry point"

          echo
          echo "Dependencies:"
          readelf -d "$BINARY" |
            grep NEEDED ||
            true

      - name: Check Binary For x86 Instructions
        shell: bash
        run: |
          set -e

          BINARY="dist/bin/Quirky-android-arm64"

          echo "Checking binary strings..."

          if strings "$BINARY" |
             grep -Ei \
               "avx2|avx|ymm|__m256|_mm256"; then

            echo "WARNING: AVX-related strings detected."

          else

            echo "No obvious AVX references."

          fi

      # ------------------------------------------------------------
      # PACKAGE
      # ------------------------------------------------------------

      - name: Package
        shell: bash
        run: |
          set -e

          mkdir -p dist/package

          cp \
            dist/bin/Quirky-android-arm64 \
            dist/package/

          sha256sum \
            dist/package/Quirky-android-arm64 \
            > dist/package/SHA256SUMS.txt

          tar -czf \
            dist/quirky-android-arm64.tar.gz \
            -C dist/package \
            .

      - name: Upload Android ARM64
        uses: actions/upload-artifact@v4
        with:
          name: quirky-android-arm64-portable
          path: |
            dist/bin/Quirky-android-arm64
            dist/quirky-android-arm64.tar.gz
            dist/package/SHA256SUMS.txt
