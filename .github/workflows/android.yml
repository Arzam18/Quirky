name: Quirky Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android NDK
        shell: bash
        run: |
          set -e

          NDK="$(find "$ANDROID_SDK_ROOT/ndk" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | sort -V \
            | tail -n1)"

          if [ -z "$NDK" ]; then
            echo "ERROR: Android NDK not found"
            exit 1
          fi

          echo "NDK=$NDK"
          echo "NDK=$NDK" >> "$GITHUB_ENV"

          echo "TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            >> "$GITHUB_ENV"

      # ============================================================
      # Remove x86 compiler flags
      # ============================================================
      - name: Remove x86 flags
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          bad_flags = [
              "-msse4.2",
              "-msse4.1",
              "-mssse3",
              "-msse3",
              "-msse2",
              "-msse",
              "-mpopcnt",
              "-mbmi2",
              "-mbmi",
              "-mavx2",
              "-mavx",
              "-mfma",
              "-mf16c",
              "-mabm",
              "-mxop",
          ]

          for p in Path(".").rglob("*"):
              if not p.is_file():
                  continue

              if p.name != "CMakeLists.txt" and p.suffix != ".cmake":
                  continue

              try:
                  text = p.read_text()
              except Exception:
                  continue

              original = text

              for flag in sorted(bad_flags, key=len, reverse=True):
                  text = re.sub(
                      rf"(?<![A-Za-z0-9_]){re.escape(flag)}(?![A-Za-z0-9_.-])",
                      "",
                      text
                  )

              lines = []

              for line in text.splitlines():
                  if "CMAKE_CXX_FLAGS" in line or "CMAKE_C_FLAGS" in line:
                      line = re.sub(
                          r"(?<![A-Za-z0-9_.-])(?:2|3|4\.1|4\.2)(?![A-Za-z0-9_.-])",
                          "",
                          line
                      )

                  lines.append(line)

              text = "\n".join(lines)

              if original.endswith("\n"):
                  text += "\n"

              if text != original:
                  p.write_text(text)
                  print("PATCHED:", p)

          PY

      - name: Verify CMake flags
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CMAKE FLAGS"
          echo "========================================"

          grep -RIn \
            --include='CMakeLists.txt' \
            --include='*.cmake' \
            'CMAKE_.*FLAGS' . || true

          echo
          echo "========================================"
          echo "X86 FLAG CHECK"
          echo "========================================"

          if grep -RInE \
            --include='CMakeLists.txt' \
            --include='*.cmake' \
            -- \
            '-m(sse|ssse|avx|avx2|popcnt|bmi|bmi2|fma|f16c|abm|xop)' \
            . ; then

            echo "ERROR: x86 flags remain."
            exit 1
          fi

          echo "OK: no x86 flags."

      # ============================================================
      # Configure ARM64
      # ============================================================
      - name: Configure ARM64
        shell: bash
        run: |
          set -eux

          rm -rf build

          export CC="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"

          "$CC" --version
          "$CXX" --version

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_FLAGS="-O3 -fno-fast-math -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-O3 -fno-fast-math -fno-omit-frame-pointer -pthread" \
            -DCMAKE_EXE_LINKER_FLAGS="-pthread"

      - name: Verify generated flags
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GENERATED NINJA FLAGS"
          echo "========================================"

          grep -n "FLAGS =" build/build.ninja | head -30 || true

          echo
          echo "========================================"
          echo "BAD FLAG CHECK"
          echo "========================================"

          if grep -nE \
            '(^|[[:space:]])-m(sse|ssse|avx|avx2|popcnt|bmi|bmi2|fma|f16c|abm|xop)([[:space:]]|$)' \
            build/build.ninja ; then

            echo "ERROR: x86 flag reached Ninja."
            exit 1
          fi

          if grep -nE \
            '(^|[[:space:]])(2|3|4\.1|4\.2)([[:space:]]|$)' \
            build/build.ninja ; then

            echo "ERROR: numeric fragments reached Ninja."
            exit 1
          fi

          echo "OK: generated flags are clean."

      # ============================================================
      # Patch BOTH Quirky pthreads
      # ============================================================
      - name: Patch Quirky threading
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          h = Path("src/search/searcher/launcher.h")
          cpp = Path("src/search/searcher/launcher.cpp")

          if not h.exists():
              raise SystemExit("ERROR: launcher.h not found")

          if not cpp.exists():
              raise SystemExit("ERROR: launcher.cpp not found")

          hs = h.read_text()
          cs = cpp.read_text()

          # --------------------------------------------------------
          # launcher.h
          # --------------------------------------------------------

          hs = hs.replace(
              "#include <thread>",
              "#include <pthread.h>"
          )

          hs = hs.replace(
              "    std::thread thread_;",
              "    pthread_t thread_{};\n"
              "    bool thread_joinable_ = false;"
          )

          h.write_text(hs)

          # --------------------------------------------------------
          # launcher.cpp includes
          # --------------------------------------------------------

          if "#include <pthread.h>" not in cs:
              lines = cs.splitlines()

              insert_at = 0

              for i, line in enumerate(lines):
                  if line.startswith("#include "):
                      insert_at = i + 1

              lines.insert(insert_at, "#include <pthread.h>")
              lines.insert(insert_at + 1, "#include <memory>")

              cs = "\n".join(lines) + "\n"

          # --------------------------------------------------------
          # Constants
          # --------------------------------------------------------

          if "LAUNCHER_STACK_SIZE" not in cs:

              marker = "namespace q_search {"

              helper = [
                  "",
                  "namespace {",
                  "",
                  "constexpr size_t LAUNCHER_STACK_SIZE = 16 * 1024 * 1024;",
                  "constexpr size_t SEARCH_STACK_SIZE = 32 * 1024 * 1024;",
                  "",
                  "struct LauncherThreadArgs {",
                  "    SearchLauncher* self;",
                  "    q_core::Board board;",
                  "    std::vector<q_core::Move> moves;",
                  "    time_control_t time_control;",
                  "    depth_t max_depth;",
                  "};",
                  "",
                  "struct SearchThreadArgs {",
                  "    Searcher* searcher;",
                  "    depth_t max_depth;",
                  "    size_t real_pv_count;",
                  "};",
                  "",
                  "void* SearchThreadEntry(void* raw) {",
                  "    auto* args = static_cast<SearchThreadArgs*>(raw);",
                  "",
                  "    args->searcher->Run(",
                  "        args->max_depth,",
                  "        args->real_pv_count",
                  "    );",
                  "",
                  "    delete args;",
                  "    return nullptr;",
                  "}",
                  "",
                  "void* LauncherThreadEntry(void* raw) {",
                  "    auto* args = static_cast<LauncherThreadArgs*>(raw);",
                  "",
                  "    args->self->StartMainThread(",
                  "        args->board,",
                  "        args->moves,",
                  "        args->time_control,",
                  "        args->max_depth",
                  "    );",
                  "",
                  "    delete args;",
                  "    return nullptr;",
                  "}",
                  "",
                  "bool CreateThreadWithStack(",
                  "    pthread_t* thread,",
                  "    size_t stack_size,",
                  "    void* (*entry)(void*),",
                  "    void* arg",
                  ") {",
                  "    pthread_attr_t attr;",
                  "",
                  "    if (pthread_attr_init(&attr) != 0)",
                  "        return false;",
                  "",
                  "    if (pthread_attr_setstacksize(&attr, stack_size) != 0) {",
                  "        pthread_attr_destroy(&attr);",
                  "        return false;",
                  "    }",
                  "",
                  "    int result = pthread_create(",
                  "        thread,",
                  "        &attr,",
                  "        entry,",
                  "        arg",
                  "    );",
                  "",
                  "    pthread_attr_destroy(&attr);",
                  "",
                  "    return result == 0;",
                  "}",
                  "",
                  "} // namespace",
                  ""
              ]

              helper_text = "\n".join(helper)

              if marker not in cs:
                  raise SystemExit(
                      "ERROR: namespace q_search not found"
                  )

              cs = cs.replace(
                  marker,
                  marker + helper_text,
                  1
              )

          # --------------------------------------------------------
          # Replace Start() body using brace matching.
          # --------------------------------------------------------

          start = cs.find("void SearchLauncher::Start(")

          if start < 0:
              raise SystemExit(
                  "ERROR: SearchLauncher::Start not found"
              )

          brace = cs.find("{", start)

          if brace < 0:
              raise SystemExit(
                  "ERROR: Start() opening brace not found"
              )

          depth = 0
          end = -1

          for i in range(brace, len(cs)):
              if cs[i] == "{":
                  depth += 1
              elif cs[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

          if end < 0:
              raise SystemExit(
                  "ERROR: Start() closing brace not found"
              )

          start_body = [
              cs[start:brace + 1],
              "    Join();",
              "    control_.Reset();",
              "    tt_.NextPosition();",
              "",
              "    auto* args = new LauncherThreadArgs{",
              "        this,",
              "        board,",
              "        moves,",
              "        time_control,",
              "        max_depth",
              "    };",
              "",
              "    if (!CreateThreadWithStack(",
              "            &thread_,",
              "            LAUNCHER_STACK_SIZE,",
              "            LauncherThreadEntry,",
              "            args)) {",
              "",
              "        delete args;",
              "        thread_joinable_ = false;",
              "        return;",
              "    }",
              "",
              "    thread_joinable_ = true;",
              "}"
          ]

          cs = cs[:start] + "\n".join(start_body) + cs[end:]

          # --------------------------------------------------------
          # Replace inner Searcher + std::thread block.
          # --------------------------------------------------------

          pattern = re.compile(
              r"\s*Searcher\s+searcher\s*\("
              r".*?"
              r"std::thread\s+search_thread\s*="
              r"\s*std::thread\s*\(\[&\]\(\)\s*\{"
              r".*?"
              r"\}\s*\);",
              re.DOTALL
          )

          replacement = "\n".join([
              "",
              "    auto searcher = std::make_unique<Searcher>(",
              "        tt_,",
              "        rt,",
              "        board,",
              "        control_,",
              "        stat",
              "    );",
              "",
              "    SearchTimer timer(time_control, board, stat);",
              "",
              "    auto* search_args = new SearchThreadArgs{",
              "        searcher.get(),",
              "        max_depth,",
              "        real_pv_count",
              "    };",
              "",
              "    pthread_t search_thread{};",
              "",
              "    if (!CreateThreadWithStack(",
              "            &search_thread,",
              "            SEARCH_STACK_SIZE,",
              "            SearchThreadEntry,",
              "            search_args)) {",
              "",
              "        delete search_args;",
              "        return;",
              "    }"
          ])

          new_cs, count = pattern.subn(
              replacement,
              cs,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Searcher/std::thread block not found"
              )

          cs = new_cs

          # --------------------------------------------------------
          # Replace inner join.
          # --------------------------------------------------------

          if "search_thread.join();" in cs:
              cs = cs.replace(
                  "search_thread.join();",
                  "pthread_join(search_thread, nullptr);"
              )
          elif "pthread_join(search_thread" not in cs:
              raise SystemExit(
                  "ERROR: search_thread join not found"
              )

          # --------------------------------------------------------
          # Replace outer Join() using brace matching.
          # --------------------------------------------------------

          join_start = cs.find(
              "void SearchLauncher::Join("
          )

          if join_start < 0:
              raise SystemExit(
                  "ERROR: SearchLauncher::Join not found"
              )

          join_brace = cs.find("{", join_start)

          if join_brace < 0:
              raise SystemExit(
                  "ERROR: Join opening brace not found"
              )

          depth = 0
          join_end = -1

          for i in range(join_brace, len(cs)):
              if cs[i] == "{":
                  depth += 1
              elif cs[i] == "}":
                  depth -= 1
                  if depth == 0:
                      join_end = i + 1
                      break

          if join_end < 0:
              raise SystemExit(
                  "ERROR: Join closing brace not found"
              )

          join_text = "\n".join([
              cs[join_start:join_brace + 1],
              "    if (thread_joinable_) {",
              "        control_.Stop();",
              "        pthread_join(thread_, nullptr);",
              "        thread_joinable_ = false;",
              "    }",
              "}"
          ])

          cs = cs[:join_start] + join_text + cs[join_end:]

          cpp.write_text(cs)

          print("Thread patch completed successfully.")

          PY

      # ============================================================
      # Verify threading patch
      # ============================================================
      - name: Verify threading
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STACK SIZES"
          echo "========================================"

          grep -n "STACK_SIZE" \
            src/search/searcher/launcher.cpp

          echo
          echo "========================================"
          echo "PTHREAD"
          echo "========================================"

          grep -nE \
            "pthread_create|pthread_join|CreateThreadWithStack|SearchThreadEntry" \
            src/search/searcher/launcher.cpp

          echo
          echo "========================================"
          echo "STD::THREAD CHECK"
          echo "========================================"

          if grep -RIn \
            --include='launcher.cpp' \
            --include='launcher.h' \
            'std::thread' \
            src/search/searcher ; then

            echo "ERROR: std::thread remains."
            exit 1
          fi

          echo "OK: no std::thread remains."

      # ============================================================
      # Build
      # ============================================================
      - name: Build
        shell: bash
        run: |
          set -eux

          cmake --build build --parallel 2

      # ============================================================
      # Find binary
      # ============================================================
      - name: Find binary
        shell: bash
        run: |
          set -e

          find build \
            -type f \
            -perm -111 \
            -print

          BIN="$(find build \
            -type f \
            -perm -111 \
            ! -name '*.so' \
            ! -name '*.a' \
            | head -n1)"

          if [ -z "$BIN" ]; then
            echo "ERROR: executable not found."
            exit 1
          fi

          echo "BIN=$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Verify ARM64
        shell: bash
        run: |
          set -e

          file "$BIN"

          readelf -h "$BIN" | grep -E \
            'Class:|Machine:|Type:'

          if ! readelf -h "$BIN" | grep -q "AArch64"; then
            echo "ERROR: binary is not AArch64."
            exit 1
          fi

      # ============================================================
      # Package
      # ============================================================
      - name: Package
        shell: bash
        run: |
          set -e

          mkdir -p artifact

          cp "$BIN" \
            artifact/Quirky-android-arm64

          chmod +x \
            artifact/Quirky-android-arm64

          ls -lh artifact/Quirky-android-arm64

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: Quirky-android-arm64
          path: artifact/Quirky-android-arm64
          if-no-files-found: error
