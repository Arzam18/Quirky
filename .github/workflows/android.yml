name: Quirky Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Locate Android NDK
      # ============================================================
      - name: Locate Android NDK
        shell: bash
        run: |
          set -e

          NDK=""

          if [ -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          else
            for d in "$ANDROID_HOME/ndk/"*; do
              if [ -x "$d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" ]; then
                NDK="$d"
                break
              fi
            done
          fi

          if [ -z "$NDK" ]; then
            echo "ERROR: Android NDK not found."
            exit 1
          fi

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

          echo "Using NDK: $NDK"

      # ============================================================
      # 3. Configure ARM64 compiler
      # ============================================================
      - name: Configure compiler
        shell: bash
        run: |
          set -e

          LLVM="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$LLVM/aarch64-linux-android24-clang"
          test -x "$LLVM/aarch64-linux-android24-clang++"

          echo "CC=$LLVM/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX=$LLVM/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"

      # ============================================================
      # 4. Remove x86-only flags
      # ============================================================
      - name: Remove x86 flags
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          bad = [
              "-msse",
              "-msse2",
              "-msse3",
              "-mssse3",
              "-msse4.1",
              "-msse4.2",
              "-mpopcnt",
              "-mavx",
              "-mavx2",
              "-mbmi",
              "-mbmi2",
          ]

          for p in Path(".").rglob("*"):
              if not p.is_file():
                  continue

              if p.name not in {
                  "CMakeLists.txt",
                  "Makefile",
                  "makefile",
              }:
                  continue

              try:
                  s = p.read_text()
              except Exception:
                  continue

              old = s

              for flag in bad:
                  s = s.replace(flag, "")

              if s != old:
                  p.write_text(s)
                  print("Patched:", p)
          PY

      # ============================================================
      # 5. Patch launcher.h
      # ============================================================
      - name: Patch launcher.h
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("src/search/searcher/launcher.h")
          s = p.read_text()

          # Add pthread.
          if "#include <pthread.h>" not in s:
              s = s.replace(
                  "#include <thread>",
                  "#include <pthread.h>\n#include <thread>"
              )

          # Add static pthread entry declaration.
          marker = """    void StartMainThread(q_core::Board board, const std::vector<q_core::Move>& moves,
                         time_control_t time_control, depth_t max_depth);"""

          replacement = """    void StartMainThread(q_core::Board board, const std::vector<q_core::Move>& moves,
                         time_control_t time_control, depth_t max_depth);

    static void* ThreadEntry(void* arg);"""

          if "static void* ThreadEntry(void* arg);" not in s:
              if marker not in s:
                  raise SystemExit(
                      "ERROR: StartMainThread declaration not found in launcher.h"
                  )
              s = s.replace(marker, replacement, 1)

          # Replace std::thread.
          if "std::thread thread_;" not in s:
              raise SystemExit(
                  "ERROR: std::thread thread_ not found in launcher.h"
              )

          s = s.replace(
              "    std::thread thread_;",
              """    pthread_t thread_{};
    bool thread_joinable_ = false;""",
              1
          )

          p.write_text(s)

          print("launcher.h patched successfully.")
          PY

          cat src/search/searcher/launcher.h

      # ============================================================
      # 6. Patch launcher.cpp
      # ============================================================
      - name: Patch launcher.cpp
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("src/search/searcher/launcher.cpp")
          s = p.read_text()

          # --------------------------------------------------------
          # Includes
          # --------------------------------------------------------

          if "#include <memory>" not in s:
              s = s.replace(
                  '#include "launcher.h"\n',
                  '#include "launcher.h"\n\n#include <memory>\n#include <pthread.h>\n',
                  1
              )

          # --------------------------------------------------------
          # Stack/thread helper
          # --------------------------------------------------------

          marker = """namespace q_search {

          uint8_t GetRTByteSizeLog"""

          replacement = """namespace q_search {

          namespace {

          constexpr size_t LAUNCHER_STACK_SIZE = 16 * 1024 * 1024;
          constexpr size_t SEARCH_STACK_SIZE = 32 * 1024 * 1024;

          int CreateThreadWithStack(
              pthread_t* thread,
              size_t stack_size,
              void* (*entry)(void*),
              void* argument) {

              pthread_attr_t attr{};

              int result = pthread_attr_init(&attr);

              if (result != 0) {
                  return result;
              }

              result = pthread_attr_setstacksize(&attr, stack_size);

              if (result == 0) {
                  result = pthread_create(
                      thread,
                      &attr,
                      entry,
                      argument
                  );
              }

              pthread_attr_destroy(&attr);

              return result;
          }

          }  // namespace

          uint8_t GetRTByteSizeLog"""

          if "LAUNCHER_STACK_SIZE" not in s:
              if marker not in s:
                  raise SystemExit(
                      "ERROR: namespace insertion point not found."
                  )

              s = s.replace(marker, replacement, 1)

          # --------------------------------------------------------
          # SearchLauncher::Start
          #
          # Replace only the actual std::thread part.
          # --------------------------------------------------------

          old = """    thread_ = std::thread([this, board, moves, time_control, max_depth]() {
        StartMainThread(board, moves, time_control, max_depth);
    });"""

          new = """    struct StartArgs {
        SearchLauncher* launcher;
        q_core::Board board;
        std::vector<q_core::Move> moves;
        time_control_t time_control;
        depth_t max_depth;
    };

    auto* args = new StartArgs{
        this,
        board,
        moves,
        time_control,
        max_depth
    };

    const int result = CreateThreadWithStack(
        &thread_,
        LAUNCHER_STACK_SIZE,
        &SearchLauncher::ThreadEntry,
        args
    );

    if (result != 0) {
        delete args;
        thread_joinable_ = false;
        q_util::PrintError("Failed to create Quirky launcher thread");
        return;
    }

    thread_joinable_ = true;"""

          if "CreateThreadWithStack(" not in s or "thread_joinable_ = true;" not in s:
              if old not in s:
                  raise SystemExit(
                      "ERROR: actual std::thread body in SearchLauncher::Start was not found."
                  )

              s = s.replace(old, new, 1)

          # --------------------------------------------------------
          # Insert ThreadEntry before Start()
          # --------------------------------------------------------

          marker = """void SearchLauncher::Start(const q_core::Board& board"""

          entry = """void* SearchLauncher::ThreadEntry(void* raw) {
    struct StartArgs {
        SearchLauncher* launcher;
        q_core::Board board;
        std::vector<q_core::Move> moves;
        time_control_t time_control;
        depth_t max_depth;
    };

    auto* args = static_cast<StartArgs*>(raw);

    args->launcher->StartMainThread(
        args->board,
        args->moves,
        args->time_control,
        args->max_depth
    );

    delete args;
    return nullptr;
}

void SearchLauncher::Start(const q_core::Board& board"""

          if "void* SearchLauncher::ThreadEntry(void* raw)" not in s:
              if marker not in s:
                  raise SystemExit(
                      "ERROR: SearchLauncher::Start definition not found."
                  )

              s = s.replace(marker, entry, 1)

          # --------------------------------------------------------
          # IMPORTANT:
          # The local StartArgs type above must be the SAME type
          # expected by ThreadEntry.
          #
          # Because function-local types are different types in C++,
          # replace both with a namespace-level helper structure.
          # --------------------------------------------------------

          bad_entry_start = """void* SearchLauncher::ThreadEntry(void* raw) {
    struct StartArgs {
        SearchLauncher* launcher;
        q_core::Board board;
        std::vector<q_core::Move> moves;
        time_control_t time_control;
        depth_t max_depth;
    };

    auto* args = static_cast<StartArgs*>(raw);"""

          good_entry_start = """namespace {

          struct LauncherThreadArgs {
              SearchLauncher* launcher;
              q_core::Board board;
              std::vector<q_core::Move> moves;
              time_control_t time_control;
              depth_t max_depth;
          };

          }

          void* SearchLauncher::ThreadEntry(void* raw) {
    auto* args = static_cast<LauncherThreadArgs*>(raw);"""

          if bad_entry_start in s:
              s = s.replace(
                  bad_entry_start,
                  good_entry_start,
                  1
              )

          # Change Start's local struct to LauncherThreadArgs.
          start_struct = """    struct StartArgs {
        SearchLauncher* launcher;
        q_core::Board board;
        std::vector<q_core::Move> moves;
        time_control_t time_control;
        depth_t max_depth;
    };

    auto* args = new StartArgs{"""

          if start_struct in s:
              s = s.replace(
                  start_struct,
                  """    auto* args = new LauncherThreadArgs{""",
                  1
              )

          # --------------------------------------------------------
          # Move Searcher to heap.
          # --------------------------------------------------------

          old_searcher = """    SearchStat stat;
    Searcher searcher(tt_, rt, board, control_, stat);
    SearchTimer timer(time_control, board, stat);
    std::thread search_thread = std::thread([&]() { searcher.Run(max_depth, real_pv_count); });"""

          new_searcher = """    SearchStat stat;

    auto searcher = std::make_unique<Searcher>(
        tt_,
        rt,
        board,
        control_,
        stat
    );

    SearchTimer timer(time_control, board, stat);

    struct SearchThreadArgs {
        Searcher* searcher;
        depth_t max_depth;
        size_t pv_count;
    };

    auto* search_args = new SearchThreadArgs{
        searcher.get(),
        max_depth,
        real_pv_count
    };

    pthread_t search_thread{};

    const int search_result = CreateThreadWithStack(
        &search_thread,
        SEARCH_STACK_SIZE,
        [](void* raw) -> void* {
            auto* args = static_cast<SearchThreadArgs*>(raw);

            args->searcher->Run(
                args->max_depth,
                args->pv_count
            );

            delete args;
            return nullptr;
        },
        search_args
    );

    if (search_result != 0) {
        delete search_args;
        q_util::PrintError("Failed to create Quirky search thread");
        return;
    }"""

          if "auto searcher = std::make_unique<Searcher>" not in s:
              if old_searcher not in s:
                  raise SystemExit(
                      "ERROR: original Searcher/search_thread block was not found."
                  )

              s = s.replace(old_searcher, new_searcher, 1)

          # --------------------------------------------------------
          # Search thread join
          # --------------------------------------------------------

          s = s.replace(
              "    search_thread.join();",
              "    pthread_join(search_thread, nullptr);"
          )

          # --------------------------------------------------------
          # SearchLauncher::Join
          # --------------------------------------------------------

          old_join = """void SearchLauncher::Join() {
    if (thread_.joinable()) {
        control_.Stop();
        thread_.join();
    }
}"""

          new_join = """void SearchLauncher::Join() {
    if (thread_joinable_) {
        control_.Stop();
        pthread_join(thread_, nullptr);
        thread_joinable_ = false;
    }
}"""

          if old_join in s:
              s = s.replace(old_join, new_join, 1)
          elif "thread_.joinable()" in s:
              raise SystemExit(
                  "ERROR: Join() contains std::thread join but expected block was not found."
              )

          p.write_text(s)

          print("launcher.cpp patched successfully.")
          PY

      # ============================================================
      # 7. Verify source modifications
      # ============================================================
      - name: Verify patches
        shell: bash
        run: |
          set -e

          echo "===== launcher.cpp ====="
          grep -n -E \
            "LAUNCHER_STACK_SIZE|SEARCH_STACK_SIZE|pthread_create|pthread_join|make_unique|ThreadEntry|thread_joinable" \
            src/search/searcher/launcher.cpp

          echo
          echo "===== remaining std::thread ====="

          if grep -n "std::thread" src/search/searcher/launcher.cpp; then
            echo "ERROR: std::thread still remains in launcher.cpp."
            exit 1
          fi

          echo
          echo "===== launcher.h ====="

          grep -n -E \
            "pthread|ThreadEntry|thread_joinable|thread_" \
            src/search/searcher/launcher.h

      # ============================================================
      # 8. Configure
      # ============================================================
      - name: Configure CMake
        shell: bash
        run: |
          set -e

          rm -rf build

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=24 \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK" \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_FLAGS="-O3 -fno-fast-math -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-pthread" \
            -DNO_AVX2=ON

      # ============================================================
      # 9. Build
      # ============================================================
      - name: Build Quirky
        shell: bash
        run: |
          set -e

          cmake --build build \
            --parallel 2 \
            --verbose

      # ============================================================
      # 10. Locate binary
      # ============================================================
      - name: Package binary
        shell: bash
        run: |
          set -e

          echo "Executables:"
          find build -type f -perm -111 -print

          BINARY=""

          for f in \
            build/Quirky \
            build/quirky \
            build/src/Quirky \
            build/src/quirky; do

            if [ -f "$f" ]; then
              BINARY="$f"
              break
            fi
          done

          if [ -z "$BINARY" ]; then
            BINARY="$(find build -type f -perm -111 | head -n 1)"
          fi

          if [ -z "$BINARY" ]; then
            echo "ERROR: executable not found."
            exit 1
          fi

          cp "$BINARY" Quirky-android-arm64
          chmod +x Quirky-android-arm64

          file Quirky-android-arm64

          readelf -h Quirky-android-arm64 | \
            grep -E "Class:|Machine:|Type:"

      # ============================================================
      # 11. Upload
      # ============================================================
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: Quirky-Android-ARM64
          path: Quirky-android-arm64
